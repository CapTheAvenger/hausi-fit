itamin D3","es":"Vitamina D3"},"1.000–2.000 IE täglich, v.a. Oktober–März (idealerweise nach Bluttest)":{"de":"1.000–2.000 IE täglich, v.a. Oktober–März (idealerweise nach Bluttest)","en":"1,000–2,000 IU daily, especially October–March (ideally after a blood test)","es":"1.000–2.000 UI al día, sobre todo de octubre a marzo (idealmente tras un análisis de sangre)"},"1–2 g EPA+DHA täglich (Fischöl oder veganes Algenöl)":{"de":"1–2 g EPA+DHA täglich (Fischöl oder veganes Algenöl)","en":"1–2 g EPA+DHA daily (fish oil or vegan algae oil)","es":"1–2 g de EPA+DHA al día (aceite de pescado o aceite de algas vegano)"},"200–400 mg täglich (z.B. abends), bei Bedarf":{"de":"200–400 mg täglich (z.B. abends), bei Bedarf","en":"200–400 mg daily (e.g. in the evening), as needed","es":"200–400 mg al día (p. ej. por la noche), según necesidad"},"3–5 g täglich, dauerhaft (kein Laden nötig)":{"de":"3–5 g täglich, dauerhaft (kein Laden nötig)","en":"3–5 g daily, permanently (no loading needed)","es":"3–5 g al día, de forma permanente (sin necesidad de fase de carga)"},"3–6 mg pro kg Körpergewicht ~30–60 Min vor dem Training":{"de":"3–6 mg pro kg Körpergewicht ~30–60 Min vor dem Training","en":"3–6 mg per kg of body weight ~30–60 min before training","es":"3–6 mg por kg de peso corporal ~30–60 min antes del entrenamiento"},"Am besten erforschtes Supplement überhaupt. Steigert Kraft, Trainingsleistung und Muskelaufbau messbar; unterstützt zusätzlich Regeneration und Gehirnfunktion. Tageszeit egal.":{"de":"Am besten erforschtes Supplement überhaupt. Steigert Kraft, Trainingsleistung und Muskelaufbau messbar; unterstützt zusätzlich Regeneration und Gehirnfunktion. Tageszeit egal.","en":"The best-researched supplement of all. Measurably increases strength, training performance and muscle growth; it also supports recovery and brain function. Time of day doesn't matter.","es":"El suplemento mejor investigado que existe. Aumenta de forma medible la fuerza, el rendimiento en el entrenamiento y el desarrollo muscular; además favorece la recuperación y la función cerebral. La hora del día es indiferente."},"Die meisten nehmen zu wenig Omega-3. Wirkt entzündungshemmend, unterstützt Herz, Gehirn und Regeneration. Sinnvoll, wenn wenig fetter Seefisch gegessen wird.":{"de":"Die meisten nehmen zu wenig Omega-3. Wirkt entzündungshemmend, unterstützt Herz, Gehirn und Regeneration. Sinnvoll, wenn wenig fetter Seefisch gegessen wird.","en":"Most people get too little omega-3. It has an anti-inflammatory effect and supports the heart, brain and recovery. Worthwhile if you eat little oily sea fish.","es":"La mayoría toma muy poco omega-3. Tiene un efecto antiinflamatorio y favorece el corazón, el cerebro y la recuperación. Útil si se come poco pescado azul de mar."},"Häufig knapp in der Ernährung. Unterstützt Muskel- und Nervenfunktion, Schlaf und Regeneration. Sinnvoll bei viel Sport oder Krämpfen.":{"de":"Häufig knapp in der Ernährung. Unterstützt Muskel- und Nervenfunktion, Schlaf und Regeneration. Sinnvoll bei viel Sport oder Krämpfen.","en":"Often in short supply in the diet. Supports muscle and nerve function, sleep and recovery. Worthwhile if you do a lot of exercise or get cramps.","es":"A menudo escaso en la alimentación. Favorece la función muscular y nerviosa, el sueño y la recuperación. Útil con mucho deporte o calambres."},"Kein Zaubermittel, sondern ein praktisches Lebensmittel: hilft, den Proteinbedarf (2–2,2 g/kg im Defizit) bequem zu decken. Wichtig für Muskelerhalt beim Abnehmen.":{"de":"Kein Zaubermittel, sondern ein praktisches Lebensmittel: hilft, den Proteinbedarf (2–2,2 g/kg im Defizit) bequem zu decken. Wichtig für Muskelerhalt beim Abnehmen.","en":"Not a magic bullet, but a practical food: it helps you conveniently meet your protein needs (2–2.2 g/kg in a deficit). Important for preserving muscle while losing weight.","es":"No es un producto milagroso, sino un alimento práctico: ayuda a cubrir cómodamente las necesidades de proteína (2–2,2 g/kg en déficit). Importante para conservar la masa muscular al adelgazar."},"Nach Bedarf, um die tägliche Eiweißmenge zu erreichen (z.B. 25–30 g pro Shake)":{"de":"Nach Bedarf, um die tägliche Eiweißmenge zu erreichen (z.B. 25–30 g pro Shake)","en":"As needed, to reach your daily protein amount (e.g. 25–30 g per shake)","es":"Según necesidad, para alcanzar la cantidad diaria de proteína (p. ej. 25–30 g por batido)"},"Stärkstes legales Trainings-Boostersupplement: mehr Fokus, Kraft und Ausdauer, dämpft den Appetit. Nicht zu spät am Tag (Schlaf!).":{"de":"Stärkstes legales Trainings-Boostersupplement: mehr Fokus, Kraft und Ausdauer, dämpft den Appetit. Nicht zu spät am Tag (Schlaf!).","en":"The strongest legal training-booster supplement: more focus, strength and endurance, and it curbs appetite. Not too late in the day (sleep!).","es":"El suplemento potenciador del entrenamiento legal más fuerte: más concentración, fuerza y resistencia, y reduce el apetito. No demasiado tarde en el día (¡el sueño!)."},"Über die Ernährung kaum zu decken, im Winter bildet die Haut kaum welches. Wichtig für Knochen, Immunsystem und Hormonhaushalt (u.a. Testosteron).":{"de":"Über die Ernährung kaum zu decken, im Winter bildet die Haut kaum welches. Wichtig für Knochen, Immunsystem und Hormonhaushalt (u.a. Testosteron).","en":"Hard to cover through diet, and in winter the skin produces hardly any. Important for bones, the immune system and hormone balance (including testosterone).","es":"Difícil de cubrir con la alimentación, y en invierno la piel apenas produce. Importante para los huesos, el sistema inmunitario y el equilibrio hormonal (entre otros, la testosterona)."},"Cardio richtig einsetzen":{"de":"Cardio richtig einsetzen","en":"Using cardio the right way","es":"Usar el cardio correctamente"},"Fette & Kohlenhydrate flexibel einsetzen":{"de":"Fette & Kohlenhydrate flexibel einsetzen","en":"Using fats & carbs flexibly","es":"Usar grasas y carbohidratos con flexibilidad"},"Fettverlust-Pyramide & Energiebilanz":{"de":"Fettverlust-Pyramide & Energiebilanz","en":"Fat-loss pyramid & energy balance","es":"Pirámide de la pérdida de grasa y balance energético"},"Mahlzeitenfrequenz & Lebensmittelwahl":{"de":"Mahlzeitenfrequenz & Lebensmittelwahl","en":"Meal frequency & food choice","es":"Frecuencia de las comidas y elección de alimentos"},"Trainingsprinzipien fürs Krafttraining":{"de":"Trainingsprinzipien fürs Krafttraining","en":"Training principles for strength training","es":"Principios de entrenamiento para el entrenamiento de fuerza"},"Warum Protein so wichtig ist":{"de":"Warum Protein so wichtig ist","en":"Why protein is so important","es":"Por qué la proteína es tan importante"},"1 g Protein liefert ~4,1 kcal.":{"de":"1 g Protein liefert ~4,1 kcal.","en":"1 g of protein provides ~4.1 kcal.","es":"1 g de proteína aporta ~4,1 kcal."},"80/20-Regel: ~80 % nährstoffreiche, sättigende Lebensmittel (Eiweißquellen, Gemüse, Obst, Vollkorn), ~20 % Genuss – so bleibt der Plan langfristig durchhaltbar.":{"de":"80/20-Regel: ~80 % nährstoffreiche, sättigende Lebensmittel (Eiweißquellen, Gemüse, Obst, Vollkorn), ~20 % Genuss – so bleibt der Plan langfristig durchhaltbar.","en":"80/20 rule: ~80% nutrient-dense, filling foods (protein sources, vegetables, fruit, whole grains), ~20% indulgence – that keeps the plan sustainable in the long run.","es":"Regla 80/20: ~80 % de alimentos ricos en nutrientes y saciantes (fuentes de proteína, verdura, fruta, integrales), ~20 % de placer: así el plan se mantiene sostenible a largo plazo."},"Alltagsbewegung (NEAT: Schritte, Treppen, Spazieren) bringt oft mehr als eine einzelne Cardio-Einheit und ist leichter durchzuhalten.":{"de":"Alltagsbewegung (NEAT: Schritte, Treppen, Spazieren) bringt oft mehr als eine einzelne Cardio-Einheit und ist leichter durchzuhalten.","en":"Everyday movement (NEAT: steps, stairs, walking) often does more than a single cardio session and is easier to keep up.","es":"El movimiento cotidiano (NEAT: pasos, escaleras, pasear) a menudo aporta más que una sola sesión de cardio y es más fácil de mantener."},"Angestrebte Fettzufuhr: ~25–35 % der Gesamtkalorien. 1 g Fett = 9,1 kcal.":{"de":"Angestrebte Fettzufuhr: ~25–35 % der Gesamtkalorien. 1 g Fett = 9,1 kcal.","en":"Target fat intake: ~25–35% of total calories. 1 g of fat = 9.1 kcal.","es":"Ingesta de grasa recomendada: ~25–35 % de las calorías totales. 1 g de grasa = 9,1 kcal."},"Ballaststoffe (Gemüse, Obst, Vollkorn, Hülsenfrüchte) sättigen, fördern die Verdauung – Richtwert ~30 g/Tag.":{"de":"Ballaststoffe (Gemüse, Obst, Vollkorn, Hülsenfrüchte) sättigen, fördern die Verdauung – Richtwert ~30 g/Tag.","en":"Fiber (vegetables, fruit, whole grains, legumes) is filling and aids digestion – guideline ~30 g/day.","es":"La fibra (verdura, fruta, integrales, legumbres) sacia y favorece la digestión: valor orientativo ~30 g/día."},"Bestes Defizit: ca. 300–500 kcal bzw. 15–25 % unter dem Verbrauch. Über dem Grundumsatz, unter dem Leistungsumsatz – das „goldene Fenster“.":{"de":"Bestes Defizit: ca. 300–500 kcal bzw. 15–25 % unter dem Verbrauch. Über dem Grundumsatz, unter dem Leistungsumsatz – das „goldene Fenster“.","en":"Best deficit: about 300–500 kcal, or 15–25% below your expenditure. Above your basal metabolic rate, below your total expenditure – the “golden window”.","es":"El mejor déficit: unas 300–500 kcal, es decir, un 15–25 % por debajo del gasto. Por encima del metabolismo basal, por debajo del gasto total: la «ventana dorada»."},"Cardio ist ein Werkzeug, um den Verbrauch zu erhöhen – kein Muss für Fettverlust. Das Defizit entsteht in erster Linie über die Ernährung.":{"de":"Cardio ist ein Werkzeug, um den Verbrauch zu erhöhen – kein Muss für Fettverlust. Das Defizit entsteht in erster Linie über die Ernährung.","en":"Cardio is a tool to increase expenditure – not a must for fat loss. The deficit is created primarily through diet.","es":"El cardio es una herramienta para aumentar el gasto, no una obligación para perder grasa. El déficit se crea sobre todo a través de la alimentación."},"Das genaue KH-zu-Fett-Verhältnis ist – solange Minimums erfüllt sind – zweitrangig. Nimm, was dir schmeckt und satt macht.":{"de":"Das genaue KH-zu-Fett-Verhältnis ist – solange Minimums erfüllt sind – zweitrangig. Nimm, was dir schmeckt und satt macht.","en":"The exact carb-to-fat ratio is – as long as the minimums are met – secondary. Take whatever tastes good and keeps you full.","es":"La proporción exacta entre carbohidratos y grasa es secundaria, siempre que se cumplan los mínimos. Toma lo que te guste y te sacie."},"Der Gesamtverbrauch (TDEE) besteht aus: Grundumsatz (~60 %), Alltagsbewegung/NEAT, Sport und der thermischen Wirkung der Nahrung (TEF).":{"de":"Der Gesamtverbrauch (TDEE) besteht aus: Grundumsatz (~60 %), Alltagsbewegung/NEAT, Sport und der thermischen Wirkung der Nahrung (TEF).","en":"Total expenditure (TDEE) consists of: basal metabolic rate (~60%), everyday movement/NEAT, exercise and the thermic effect of food (TEF).","es":"El gasto total (TDEE) se compone de: metabolismo basal (~60 %), movimiento cotidiano/NEAT, deporte y el efecto térmico de los alimentos (TEF)."},"Energiebilanz = aufgenommene Kalorien gegen verbrauchte Kalorien. Defizit → Fett runter, Überschuss → Aufbau. Das ist der mit Abstand größte Hebel.":{"de":"Energiebilanz = aufgenommene Kalorien gegen verbrauchte Kalorien. Defizit → Fett runter, Überschuss → Aufbau. Das ist der mit Abstand größte Hebel.","en":"Energy balance = calories consumed versus calories burned. Deficit → fat down, surplus → gain. This is by far the biggest lever.","es":"Balance energético = calorías ingeridas frente a calorías gastadas. Déficit → baja la grasa, superávit → aumento. Esta es, con diferencia, la mayor palanca."},"Fett-Minimum für den Hormonhaushalt: etwa Körpergröße in cm ÷ 3 = Gramm Fett/Tag (bei 180 cm ≈ 60 g). Diesen Wert nicht dauerhaft unterschreiten.":{"de":"Fett-Minimum für den Hormonhaushalt: etwa Körpergröße in cm ÷ 3 = Gramm Fett/Tag (bei 180 cm ≈ 60 g). Diesen Wert nicht dauerhaft unterschreiten.","en":"Fat minimum for hormone balance: roughly body height in cm ÷ 3 = grams of fat/day (at 180 cm ≈ 60 g). Don't stay below this value permanently.","es":"Mínimo de grasa para el equilibrio hormonal: aproximadamente la estatura en cm ÷ 3 = gramos de grasa/día (con 180 cm ≈ 60 g). No bajar de este valor de forma permanente."},"Iss überwiegend Dinge, die dir schmecken. Ein perfekter Plan, den du hasst, funktioniert nicht.":{"de":"Iss überwiegend Dinge, die dir schmecken. Ein perfekter Plan, den du hasst, funktioniert nicht.","en":"Eat mostly things you enjoy. A perfect plan that you hate won't work.","es":"Come sobre todo cosas que te gusten. Un plan perfecto que odias no funciona."},"Kohlenhydrate füllen den Rest der Kalorien. Sie sind die bevorzugte Energiequelle fürs Krafttraining und fördern so indirekt den Muskelaufbau. 1 g KH = 4,1 kcal.":{"de":"Kohlenhydrate füllen den Rest der Kalorien. Sie sind die bevorzugte Energiequelle fürs Krafttraining und fördern so indirekt den Muskelaufbau. 1 g KH = 4,1 kcal.","en":"Carbs fill up the rest of the calories. They're the preferred energy source for strength training and thus indirectly support muscle growth. 1 g of carbs = 4.1 kcal.","es":"Los carbohidratos rellenan el resto de las calorías. Son la fuente de energía preferida para el entrenamiento de fuerza y así favorecen indirectamente el desarrollo muscular. 1 g de carbohidratos = 4,1 kcal."},"Kraft geht vor Cardio: Priorität hat der Muskelerhalt. Cardio ergänzt, ersetzt aber nie das Krafttraining.":{"de":"Kraft geht vor Cardio: Priorität hat der Muskelerhalt. Cardio ergänzt, ersetzt aber nie das Krafttraining.","en":"Strength before cardio: preserving muscle takes priority. Cardio complements strength training but never replaces it.","es":"La fuerza va antes que el cardio: la prioridad es conservar la masa muscular. El cardio complementa, pero nunca sustituye, al entrenamiento de fuerza."},"Krafttraining ist im Defizit der Reiz, der der Muskulatur sagt: „werde behalten“. Ohne ihn verlierst du mit dem Fett auch Muskeln.":{"de":"Krafttraining ist im Defizit der Reiz, der der Muskulatur sagt: „werde behalten“. Ohne ihn verlierst du mit dem Fett auch Muskeln.","en":"In a deficit, strength training is the stimulus that tells your muscles: “you'll be kept”. Without it, you lose muscle along with the fat.","es":"En déficit, el entrenamiento de fuerza es el estímulo que le dice a la musculatura: «te conservarás». Sin él, pierdes músculo junto con la grasa."},"Kurz aufwärmen: 5–10 Min lockeres Warmmachen + ein paar Aufwärmsätze mit leichterem Gewicht senken das Verletzungsrisiko.":{"de":"Kurz aufwärmen: 5–10 Min lockeres Warmmachen + ein paar Aufwärmsätze mit leichterem Gewicht senken das Verletzungsrisiko.","en":"Warm up briefly: 5–10 min of easy warming up + a few warm-up sets with lighter weight lower the risk of injury.","es":"Calienta brevemente: 5–10 min de calentamiento suave + unas series de aproximación con peso más ligero reducen el riesgo de lesión."},"Nachdem Kalorien und Protein stehen, teilst du den Rest auf Fett und Kohlenhydrate auf.":{"de":"Nachdem Kalorien und Protein stehen, teilst du den Rest auf Fett und Kohlenhydrate auf.","en":"Once calories and protein are set, you split the rest between fat and carbs.","es":"Una vez fijadas las calorías y la proteína, repartes el resto entre grasa y carbohidratos."},"Nicht alles ist gleich wichtig. Die Reihenfolge der Hebel: 1. Energiebilanz, 2. Proteinzufuhr, 3. der Rest (KH/Fett-Verhältnis, Timing …).":{"de":"Nicht alles ist gleich wichtig. Die Reihenfolge der Hebel: 1. Energiebilanz, 2. Proteinzufuhr, 3. der Rest (KH/Fett-Verhältnis, Timing …).","en":"Not everything is equally important. The order of the levers: 1. energy balance, 2. protein intake, 3. the rest (carb/fat ratio, timing …).","es":"No todo es igual de importante. El orden de las palancas: 1. balance energético, 2. ingesta de proteína, 3. el resto (proporción carbohidratos/grasa, timing …)."},"Progressive Überlastung ist der Schlüssel: mit der Zeit mehr Gewicht, mehr Wiederholungen oder mehr Sätze – kleine, stetige Steigerungen. (Genau dafür trackt die App deine Werte.)":{"de":"Progressive Überlastung ist der Schlüssel: mit der Zeit mehr Gewicht, mehr Wiederholungen oder mehr Sätze – kleine, stetige Steigerungen. (Genau dafür trackt die App deine Werte.)","en":"Progressive overload is the key: over time more weight, more reps or more sets – small, steady increases. (That's exactly why the app tracks your numbers.)","es":"La sobrecarga progresiva es la clave: con el tiempo más peso, más repeticiones o más series: incrementos pequeños y constantes. (Justo por eso la app registra tus valores.)"},"Protein ist der zweitwichtigste Hebel nach der Energiebilanz – gerade im Defizit schützt es die Muskulatur.":{"de":"Protein ist der zweitwichtigste Hebel nach der Energiebilanz – gerade im Defizit schützt es die Muskulatur.","en":"Protein is the second most important lever after energy balance – especially in a deficit it protects your muscles.","es":"La proteína es la segunda palanca más importante después del balance energético: sobre todo en déficit protege la musculatura."},"Protein sättigt am stärksten und hat die höchste thermische Wirkung (20–30 % der Energie verpuffen bei der Verdauung) – doppelt hilfreich beim Abnehmen.":{"de":"Protein sättigt am stärksten und hat die höchste thermische Wirkung (20–30 % der Energie verpuffen bei der Verdauung) – doppelt hilfreich beim Abnehmen.","en":"Protein is the most filling and has the highest thermic effect (20–30% of the energy is used up during digestion) – doubly helpful when losing weight.","es":"La proteína es la que más sacia y tiene el mayor efecto térmico (el 20–30 % de la energía se disipa en la digestión): doblemente útil al adelgazar."},"Proteinqualität zählt: tierische Quellen (Fleisch, Fisch, Ei, Milch) sind besser verwertbar als pflanzliche. Ausnahme: gutes Sojaprotein.":{"de":"Proteinqualität zählt: tierische Quellen (Fleisch, Fisch, Ei, Milch) sind besser verwertbar als pflanzliche. Ausnahme: gutes Sojaprotein.","en":"Protein quality matters: animal sources (meat, fish, egg, milk) are better utilized than plant-based ones. Exception: good soy protein.","es":"La calidad de la proteína importa: las fuentes animales (carne, pescado, huevo, leche) se aprovechan mejor que las vegetales. Excepción: una buena proteína de soja."},"Regeneration ist Teil des Trainings: Muskeln wachsen in der Pause. Genug Schlaf und Proteinzufuhr sind Pflicht.":{"de":"Regeneration ist Teil des Trainings: Muskeln wachsen in der Pause. Genug Schlaf und Proteinzufuhr sind Pflicht.","en":"Recovery is part of training: muscles grow during the rest. Enough sleep and protein intake are a must.","es":"La recuperación es parte del entrenamiento: los músculos crecen en el descanso. Dormir lo suficiente y una ingesta adecuada de proteína son obligatorios."},"Richtwert: 8.000–10.000 Schritte/Tag sind ein starker, unterschätzter Hebel.":{"de":"Richtwert: 8.000–10.000 Schritte/Tag sind ein starker, unterschätzter Hebel.","en":"Guideline: 8,000–10,000 steps/day are a powerful, underrated lever.","es":"Valor orientativo: 8.000–10.000 pasos/día son una palanca potente e infravalorada."},"Richtwert: ca. 1,6–2,2 g pro kg Körpergewicht; im Kaloriendefizit eher am oberen Ende (2–2,4 g/kg).":{"de":"Richtwert: ca. 1,6–2,2 g pro kg Körpergewicht; im Kaloriendefizit eher am oberen Ende (2–2,4 g/kg).","en":"Guideline: about 1.6–2.2 g per kg of body weight; in a calorie deficit rather at the upper end (2–2.4 g/kg).","es":"Valor orientativo: unos 1,6–2,2 g por kg de peso corporal; en déficit calórico más bien en el extremo superior (2–2,4 g/kg)."},"Studien zeigen: Menschen unterschätzen ihre Kalorienaufnahme im Schnitt um ~47 %. Ehrliches Tracking schlägt Bauchgefühl.":{"de":"Studien zeigen: Menschen unterschätzen ihre Kalorienaufnahme im Schnitt um ~47 %. Ehrliches Tracking schlägt Bauchgefühl.","en":"Studies show: on average, people underestimate their calorie intake by ~47%. Honest tracking beats gut feeling.","es":"Los estudios muestran: de media, las personas subestiman su ingesta calórica en un ~47 %. Un registro honesto supera a la intuición."},"Technik vor Ego: saubere, kontrollierte Ausführung über den vollen Bewegungsumfang schlägt schwereres Gewicht mit Schwung.":{"de":"Technik vor Ego: saubere, kontrollierte Ausführung über den vollen Bewegungsumfang schlägt schwereres Gewicht mit Schwung.","en":"Technique over ego: clean, controlled execution through the full range of motion beats heavier weight swung with momentum.","es":"Técnica antes que ego: una ejecución limpia y controlada en todo el rango de movimiento supera a un peso mayor con impulso."},"Trainiere nah ans Muskelversagen (RPE 8–10, also 0–2 Wiederholungen „im Tank“) für einen ausreichenden Reiz.":{"de":"Trainiere nah ans Muskelversagen (RPE 8–10, also 0–2 Wiederholungen „im Tank“) für einen ausreichenden Reiz.","en":"Train close to muscle failure (RPE 8–10, i.e. 0–2 reps “in the tank”) for a sufficient stimulus.","es":"Entrena cerca del fallo muscular (RPE 8–10, es decir, 0–2 repeticiones «en la recámara») para un estímulo suficiente."},"Vegan? Quellen kombinieren (Getreide + Hülsenfrüchte) und ~20 % mehr Protein einplanen, um Mängel auszugleichen.":{"de":"Vegan? Quellen kombinieren (Getreide + Hülsenfrüchte) und ~20 % mehr Protein einplanen, um Mängel auszugleichen.","en":"Vegan? Combine sources (grains + legumes) and plan for ~20% more protein to make up for deficiencies.","es":"¿Vegano? Combina fuentes (cereales + legumbres) y planifica un ~20 % más de proteína para compensar las carencias."},"Wenn Cardio, dann so dosiert, dass es die Regeneration fürs Krafttraining nicht auffrisst. Lockeres Ausdauertraining (Zone 2) ist gelenkschonend.":{"de":"Wenn Cardio, dann so dosiert, dass es die Regeneration fürs Krafttraining nicht auffrisst. Lockeres Ausdauertraining (Zone 2) ist gelenkschonend.","en":"If you do cardio, dose it so it doesn't eat into your recovery for strength training. Easy endurance training (Zone 2) is gentle on the joints.","es":"Si haces cardio, dosifícalo de modo que no consuma la recuperación para el entrenamiento de fuerza. El entrenamiento de resistencia suave (Zona 2) es suave para las articulaciones."},"Wie viele Mahlzeiten pro Tag ist Geschmackssache – 3 bis 5 funktionieren alle. Entscheidend ist die Tagesbilanz, nicht die Verteilung.":{"de":"Wie viele Mahlzeiten pro Tag ist Geschmackssache – 3 bis 5 funktionieren alle. Entscheidend ist die Tagesbilanz, nicht die Verteilung.","en":"How many meals per day is a matter of taste – 3 to 5 all work. What matters is the daily balance, not the distribution.","es":"Cuántas comidas al día es cuestión de gustos: 3 a 5 funcionan todas. Lo decisivo es el balance diario, no la distribución."},"Wähle die Frequenz, mit der du am besten satt bleibst und deinen Plan durchhältst.":{"de":"Wähle die Frequenz, mit der du am besten satt bleibst und deinen Plan durchhältst.","en":"Choose the frequency that keeps you fullest and helps you stick to your plan.","es":"Elige la frecuencia con la que mejor te mantienes saciado y cumples tu plan."},"Zu aggressiv abnehmen führt zu Heißhunger, Muskelabbau, Müdigkeit und schwächerem Immunsystem.":{"de":"Zu aggressiv abnehmen führt zu Heißhunger, Muskelabbau, Müdigkeit und schwächerem Immunsystem.","en":"Losing weight too aggressively leads to cravings, muscle loss, fatigue and a weaker immune system.","es":"Adelgazar de forma demasiado agresiva provoca antojos, pérdida muscular, cansancio y un sistema inmunitario más débil."},"„You can't outrun a bad diet.“ Sport verbrennt weniger als die meisten denken – die Ernährung entscheidet.":{"de":"„You can't outrun a bad diet.“ Sport verbrennt weniger als die meisten denken – die Ernährung entscheidet.","en":"“You can't outrun a bad diet.” Exercise burns less tha /* ================= Cloud sync (Firebase) ================= */
var FB = null;            // set by the module script when Firebase is ready (var => window.FB)
const DEMO = new URLSearchParams(location.search).get('demo')==='1';
let cloudUser = null;
let cloudTimer = null;
let syncState = 'off';    // off | ok | err
function setSync(st){
  syncState = st;
  const el = document.getElementById('syncdot');
  if(el) el.className = 'syncdot ' + (st==='ok'?'ok':(st==='err'?'err':''));
}
function cloudSave(){
  if(!FB || !cloudUser) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async ()=>{
    try{
      await FB.saveState(cloudUser.uid, JSON.stringify(S), S.ts);
      setSync('ok');
    }catch(e){ setSync('err'); }
  }, 1200);
}
async function onAuth(user){
  if(DEMO){ document.getElementById('login').classList.remove('open'); return; }
  cloudUser = user;
  if(!user){
    document.getElementById('login').classList.add('open');
    setSync('off');
    renderLogin();
    return;
  }
  document.getElementById('login').classList.remove('open');
  try{
    const remote = await FB.loadState(user.uid);
    if(remote && remote.json){
      const rts = remote.ts || 0;
      if(rts >= (S.ts||0)){
        try{
          const obj = JSON.parse(remote.json);
          S = Object.assign(defaultState(), obj);
          try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
          if(S.fav && DATA.splits.some(s=>s.id===S.fav)) S.split = S.fav;
          setTheme(S.theme);
        }catch(e){}
      }else{
        await FB.saveState(user.uid, JSON.stringify(S), S.ts);
      }
    }else{
      await FB.saveState(user.uid, JSON.stringify(S), S.ts||Date.now());
    }
    setSync('ok');
  }catch(e){ setSync('err'); }
  renderAll();
}
/* pull fresh data when returning to the app */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState!=='visible' || !FB || !cloudUser) return;
  try{
    const remote = await FB.loadState(cloudUser.uid);
    if(remote && remote.json && (remote.ts||0) > (S.ts||0)){
      S = Object.assign(defaultState(), JSON.parse(remote.json));
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      if(S.theme==='auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', S.theme);
      renderAll();
    }
    setSync('ok');
  }catch(e){}
});

function authErr(e){
  const c = (e && e.code) || '';
  if(c.includes('email-already-in-use')) return t('err_exists');
  if(c.includes('weak-password')) return t('err_weak');
  if(c.includes('invalid-email')) return t('err_email');

/* ================= Training view ================= */
function getSplit(){ return DATA.splits.find(s=>s.id===S.split) || DATA.splits[0]; }
function slotExercise(splitId, dayIdx, slotIdx){
  const ov = S.sel?.[splitId]?.[dayIdx]?.[slotIdx];
  if(ov && EXALL()[ov]) return ov;
  return getSplitById(splitId).days[dayIdx].slots[slotIdx].exercise;
}
function getSplitById(id){ return DATA.splits.find(s=>s.id===id); }
function setSlotExercise(splitId, dayIdx, slotIdx, exId){
  S.sel[splitId] = S.sel[splitId]||{};
  S.sel[splitId][dayIdx] = S.sel[splitId][dayIdx]||{};
  S.sel[splitId][dayIdx][slotIdx] = exId;
  save();
}
function lastLog(eid){
  const e = S.ex[eid]; if(!e) return null;
  if(e.hist && e.hist.length) return e.hist[e.hist.length-1];
  if(e.w!==null&&e.w!==undefined) return {d:null,w:e.w,r:e.r,s:e.s};
  return null;
}
function renderTrain(){
  const sp = getSplit();
  if(S.dayIdx >= sp.days.length) S.dayIdx = 0;
  let h = '<div class="chips">';
  const ordered = DATA.splits.slice().sort((a,b)=>(a.id===S.fav?-1:0)-(b.id===S.fav?-1:0));
  for(const s of ordered){
    const isFav = s.id===S.fav, isOn = s.id===S.split;
    const star = isOn ? `<span class="star" onclick="event.stopPropagation();toggleFav('${s.id}')">${isFav?'⭐':'☆'}</span>` : (isFav?' ⭐':'');
    h += `<button class="chip ${isOn?'on':''}" onclick="S.split='${s.id}';S.dayIdx=0;save();renderTrain()">${esc(t(s.nameKey))}${star}</button>`;
  }
  h += '</div><div class="chips">';
  sp.days.forEach((d,i)=>{
    h += `<button class="chip ${i===S.dayIdx?'on':''}" onclick="S.dayIdx=${i};save();renderTrain()">${esc(t(d.nameKey))}</button>`;
  });
  h += '</div>';
  h += `<div class="note" style="margin:0 2px 10px">${esc(t('fav_hint'))}</div>`;
  const day = sp.days[S.dayIdx];
  day.slots.forEach((slot,si)=>{
    const eid = slotExercise(sp.id, S.dayIdx, si);
    const st = S.ex[eid]||{};
    const ll = lastLog(eid);
    const w = st.w ?? '';
    const r = st.r ?? slot.rep;
    const sets = st.s ?? slot.set;
    h += `<div class="card excard">
      <div class="exhead"><div style="min-width:0">
        <div class="expat">${esc(t('pat_'+slot.pattern))}</div>
        <button class="exname" onclick="openPicker('${sp.id}',${S.dayIdx},${si})">${esc(exName(eid))} <span class="sw">⇄ ${esc(t('swap'))}</span></button>
        <div class="extarget">${esc(t('target'))}: ${esc(slot.rep)} ${esc(t('reps'))} × ${slot.set} ${esc(t('sets'))}</div>
        ${ll? `<div class="exlast">${esc(t('last'))}: <b>${fmt(ll.w, ll.w%1?1:0)} ${t('kg')}</b> × ${esc(ll.r??'–')}${ll.s?' ('+ll.s+' '+t('sets')+')':''}${ll.d?' · '+fmtDate(ll.d):''}</div>` : `<div class="exlast">${esc(t('no_data'))}</div>`}
      </div></div>
      <div class="exrow">
        <div class="fld" style="flex:1.4"><label>${esc(t('weight'))} (${t('kg')})</label>
          <div class="numwrap">
            <button class="stepbtn" onclick="stepW('${eid}',-2.5)">−</button>
            <input type="number" inputmode="decimal" step="0.5" id="w_${eid}_${si}" value="${w}" onchange="inpW('${eid}',this.value)">
            <button class="stepbtn" onclick="stepW('${eid}',2.5)">+</button>
          </div></div>
        <div class="fld"><label>${esc(t('reps'))}</label>
          <div class="numwrap"><input type="text" inputmode="numeric" id="r_${eid}_${si}" value="${esc(r??'')}" onchange="S.ex['${eid}']=S.ex['${eid}']||{hist:[]};S.ex['${eid}'].r=this.value;save()"></div></div>
        <div class="fld"><label>${esc(t('sets'))}</label>
          <div class="numwrap"><input type="number" inputmode="numeric" id="s_${eid}_${si}" value="${sets??''}" onchange="S.ex['${eid}']=S.ex['${eid}']||{hist:[]};S.ex['${eid}'].s=+this.value;save()"></div></div>
        <button class="btn savebtn" onclick="logSet('${eid}',${si})">✓</button>
      </div>
      ${st.hist && st.hist.length ? `<div class="histwrap">${esc(t('history'))}: ${st.hist.slice(-5).reverse().map(x=>`<span class="histchip">${fmtDate(x.d)} · ${fmt(x.w,x.w%1?1:0)}${t('kg')}×${esc(x.r??'')}</span>`).join('')}</div>`:''}
    </div>`;
  });
  const done = day.slots.every((sl,si)=>{ const e=S.ex[slotExercise(sp.id,S.dayIdx,si)];
    return e && e.hist && e.hist.length && e.hist[e.hist.length-1].d===todayISO(); });
  h += `<button class="btn ${done?'':'sec'}" style="width:100%;margin:4px 0 10px" onclick="finishDay()">✓ ${esc(t('train_finish'))}</button>
    <div class="note" style="margin:0 2px 16px">${esc(t('train_finish_note').replace('{d}', t(sp.days[(S.dayIdx+1)%sp.days.length].nameKey)))}</div>`;
  document.getElementById('v-train').innerHTML = h;
}
function finishDay(){
  const sp = getSplit();
  S.dayIdx = (S.dayIdx+1) % sp.days.length;
  save(); toast(t('train_finished')); renderTrain(); window.scrollTo(0,0);
}
function toggleFav(id){
  S.fav = (S.fav===id) ? null : id;
  save(); renderTrain();
  if(S.fav) toast('⭐ ' + t(getSplitById(id).nameKey));
}
function ensureEx(eid){ S.ex[eid] = S.ex[eid]||{w:null,r:'',s:null,hist:[]}; if(!S.ex[eid].hist) S.ex[eid].hist=[]; return S.ex[eid]; }
function stepW(eid, d){
  const e = ensureEx(eid);
  e.w = Math.max(0, Math.round(((+e.w||0)+d)*10)/10);
  save(); renderTrain();
}
function inpW(eid, v){ const e=ensureEx(eid); e.w = v===''?null:+v; save(); }
function logSet(eid, si){
  const e = ensureEx(eid);
  const wEl = document.getElementById(`w_${eid}_${si}`);
  const rEl = document.getElementById(`r_${eid}_${si}`);
  const sEl = document.getElementById(`s_${eid}_${si}`);
  if(wEl && wEl.value!=='') e.w = +wEl.value;
  if(rEl) e.r = rEl.value;
  if(sEl && sEl.value!=='') e.s = +sEl.value;
  const d = todayISO();
  const entry = {d, w:e.w, r:e.r, s:e.s};
  if(e.hist.length && e.hist[e.hist.length-1].d === d) e.hist[e.hist.length-1] = entry;
  else e.hist.push(entry);
  if(e.hist.length>60) e.hist = e.hist.slice(-60);
  save(); toast(t('saved')); renderTrain();
}

  h += `<div style="margin-top:12px"><button class="btn sec" style="width:100%" onclick="closeModal()">${esc(t('close'))}</button></div>`;

function pickAll(splitId, dayIdx, slotIdx){
  const all = Object.values(EXALL()).sort((a,b)=>tc(a.name).localeCompare(tc(b.name)));
  let h = `<h3>${esc(t('pick_exercise'))}</h3>
  <input type="text" placeholder="${esc(t('search'))}" oninput="filterPick(this.value)" style="margin-bottom:8px">
  <div id="pickall">`;
  for(const e of all){
    const ll = lastLog(e.id);

      <span>${esc(tc(e.name))}</span><span class="pw">${ll? fmt(ll.w, ll.w%1?1:0)+' '+t('kg') : ''}</span></div>`;
  }

function filterPick(q){
  q = q.toLowerCase();
  document.querySelectorAll('#pickall .pickitem').forEach(el=>{
    el.style.display = el.dataset.n.includes(q)?'':'none';
  });
}
function pickEx(splitId, dayIdx, slotIdx, exId){
  setSlotExercise(splitId, dayIdx, slotIdx, exId);
  closeModal(); renderTrain();
}
function newEx(splitId, dayIdx, slotIdx, pattern){
  const name = prompt(t('new_ex_prompt'));
  if(!name) return;
  const id = 'c_' + name.toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').replace(/^-|-$/g,'');

const PAL_ROWS = [
  {k:'pal_sleep', v:1.0}, {k:'pal_lying', v:1.2}, {k:'pal_sitting', v:1.5},
  {k:'pal_sitstand', v:1.9}, {k:'pal_standing', v:2.3}, {k:'pal_hard', v:5.0},
];
/* PAR-Werte nach FAO/WHO/UNU 2004 (Human Energy Requirements, Tab. 5.2).
   Die Summe ergibt den PAL; Nahrungsthermogenese ist darin bereits enthalten. */
const PAL_FLOOR = 1.40;   // FAO/WHO/UNU: Untergrenze fuer frei lebende Erwachsene
const KCAL_PER_KG = 7700; // Energiegehalt Koerperfett (Wishnofsky), inkl. Anpassungsverlusten
const BMR_FORMULAS = ['mifflin','harris','katch'];
const REFEED = [
  {bf:'>30', m:'1', f:'1', lo:30, hi:200},
  {bf:'25–30', m:'1', f:'1–2', lo:25, hi:30},
  {bf:'22–24', m:'1', f:'2', lo:22, hi:25},
  {bf:'18–21', m:'1', f:'2–3', lo:18, hi:22},
  {bf:'15–17', m:'2', f:'3', lo:15, hi:18},
  {bf:'12–14', m:'2–3', f:'–', lo:12, hi:15},
  {bf:'<12', m:'3', f:'–', lo:0, hi:12},
];
function bmrFor(formula, c){
  const w=+c.weight, hgt=+c.height, a=+c.age, m=c.gender==='m';
  if(formula==='harris') return m ? 66.5+13.7*w+5*hgt-6.8*a : 655+9.6*w+1.8*hgt-4.7*a;
  if(formula==='katch'){ const lbm = w*(1-(+c.bf||0)/100); return 370+21.6*lbm; }
  return m ? 10*w+6.25*hgt-5*a+5 : 10*w+6.25*hgt-5*a-161;   // Mifflin-St Jeor
}
function calcAll(){
  const c = S.calc;
  const w=+c.weight, goal=+c.goal;
  const formula = BMR_FORMULAS.includes(c.bmrF) ? c.bmrF : 'mifflin';
  const bmr = bmrFor(formula, c);
  const bmrAlt = BMR_FORMULAS.filter(f=>f!==formula).map(f=>({f, v:bmrFor(f,c)}));
  const hours = c.palH.reduce((x,y)=>x+(+y||0),0);
  const palRaw = hours>0 ? c.palH.reduce((acc,hh,i)=>acc+(+hh||0)*PAL_ROWS[i].v,0)/hours : PAL_FLOOR;
  const palLow = palRaw < PAL_FLOOR;
  const pal = Math.max(PAL_FLOOR, palRaw);
  const tdee = bmr*pal;
  const maint = tdee;                       // Erhaltungsbedarf = heutiger Verbrauch
  const goalMaint = bmrFor(formula, {...c, weight:goal})*pal;  // Bedarf beim Zielgewicht (nur Info)
  const defPct = Math.max(0, Math.min(25, +c.deficit||0));
  const defCapped = (+c.deficit||0) > 25;
  const intake = maint*(1-defPct/100);
  const defDay = maint-intake;
  const jogWeek = (+c.jogS||0)*(+c.jogK||0);
  const weekDef = defDay*7;
  const lossWeek = weekDef/KCAL_PER_KG, lossWeekJog=(weekDef+jogWeek)/KCAL_PER_KG;
  return {bmr, bmrF:formula, bmrAlt, hours, pal, palRaw, palLow, tdee, goalMaint, maint,
    intake, defPct, defCapped, defDay, weekDef, lossWeek, lossWeekJog,
    lossPctWeek: w>0 ? lossWeek/w*100 : 0, lossPctWeekJog: w>0 ? lossWeekJog/w*100 : 0,
    underBmr: intake < bmr, weekKcal:intake*7, jogWeek,
    fatMin: Math.max(Math.round(0.6*w), Math.round(0.20*maint*(1-defPct/100)/9)),
    carbMin: 130};
}
/* Energiefaktoren nach EU-LMIV (VO 1169/2011, Anhang XIV):
   Protein 4, Kohlenhydrate 4, Fett 9, Ballaststoffe 2, Alkohol 7 kcal/g */
const KCAL_P=4, KCAL_C=4, KCAL_F=9, KCAL_FIB=2, KCAL_ALC=7;
function macroCalc(kcal){
  const c=S.calc, w=+c.weight;
  if(c.macroMode==='auto'){
    const pg = c.ppk*w, fg = c.fpk*w;
    const pk = pg*KCAL_P, fk = fg*KCAL_F;
    const cg = Math.max(0,(kcal-pk-fk)/KCAL_C);
    return {p:pg,f:fg,c:cg,pk,fk,ck:cg*KCAL_C};
  }else{
    const sum = (+c.mp||0)+(+c.mf||0)+(+c.mc||0);
    const n = sum>0 ? 100/sum : 1;           // auf 100 % normieren statt kcal zu verlieren
    const pk=kcal*(+c.mp||0)*n/100, fk=kcal*(+c.mf||0)*n/100, ck=kcal*(+c.mc||0)*n/100;
    return {p:pk/KCAL_P,f:fk/KCAL_F,c:ck/KCAL_C,pk,fk,ck};
  }
}
function saveMyCalc(){
  S.calcSaved = JSON.parse(JSON.stringify(S.calc)); save();
  window._calcSavedFlash = true; renderCalc();
  setTimeout(()=>{ window._calcSavedFlash=false; const el=document.getElementById('calcsavedflash'); if(el) el.remove(); }, 2000);
}
function loadMyCalc(){
  if(!S.calcSaved) return;
  S.calc = JSON.parse(JSON.stringify(S.calcSaved)); save(); renderCalc();
}
function setPalH(i, val){
  val = Math.max(0, Math.min(24, +val||0));
  S.calc.palH[i] = val; save(); calcSoon();
}
function setCalcNum(key, val){
  S.calc[key] = +val||0; save(); calcSoon();
}
/* Ein Neu-Rendern ersetzt das komplette innerHTML einer View. Ohne die folgenden
   zwei Helfer klappen dabei alle <details> zu und der Fokus geht verloren —
   Durchtabben durch die Eingabefelder wird unmoeglich. */
const ACC_OPEN = new Set();
document.addEventListener('toggle', e=>{
  const d = e.target;
  if(!d || !d.dataset || !d.dataset.acc) return;
  if(d.open) ACC_OPEN.add(d.dataset.acc); else ACC_OPEN.delete(d.dataset.acc);
}, true);
function keepUI(viewId, build){
  const root = document.getElementById(viewId);
  const ae = document.activeElement;
  const fid = (ae && ae.id && root && root.contains(ae)) ? ae.id : null;
  let ss=null, se=null;
  if(fid){ try{ ss=ae.selectionStart; se=ae.selectionEnd; }catch(err){} }
  const sy = window.scrollY;
  root.innerHTML = build();
  root.querySelectorAll('details[data-acc]').forEach(d=>{ if(ACC_OPEN.has(d.dataset.acc)) d.open = true; });
  if(fid){
    const el = document.getElementById(fid);
    if(el){
      el.focus({preventScroll:true});
      if(ss!=null){ try{ el.setSelectionRange(ss,se); }catch(err){} }
    }
  }
  window.scrollTo(0, sy);
}
/* Aus einem change-Handler heraus NICHT sofort neu rendern: erst laesst man den
   Browser den Tab-Sprung zu Ende fuehren, dann wird gerendert und der Fokus

function drawChart(arr, unit){
  const box = document.getElementById('chart');
  const leg = document.getElementById('legend');
  if(!box) return;
  if(arr.length<2){ box.innerHTML = `<div class="note" style="padding:20px 0;text-align:center">${esc(t('no_data'))}</div>`; leg.innerHTML=''; return; }
  const W = Math.max(300, box.clientWidth||340), H = 220;
  const padL=38, padR=12, padT=14, padB=26;
  const xs = arr.map(e=>new Date(e.d+'T12:00:00').getTime());
  const ys = arr.map(e=>e.v);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=(y1-y0)*0.15||1; y0-=pad; y1+=pad;
  const X=v=>padL+(v-x0)/(x1-x0||1)*(W-padL-padR);
  const Y=v=>padT+(1-(v-y0)/(y1-y0||1))*(H-padT-padB);
  // 7-day rolling average
  const avg = arr.map((e,i)=>{
    const t0 = xs[i]-6.5*86400000;
    const win = arr.filter((_,j)=>xs[j]>=t0 && xs[j]<=xs[i]);
    return win.reduce((a,b)=>a+b.v,0)/win.length;
  });
  const cs = getComputedStyle(document.documentElement);
  const cLine = cs.getPropertyValue('--accent').trim();
  const cMut = cs.getPropertyValue('--muted').trim();
  const cGrid = cs.getPropertyValue('--grid').trim();
  const cAxis = cs.getPropertyValue('--axis').trim();
  const cInk2 = cs.getPropertyValue('--ink2').trim();
  let svg = `<svg viewBox="0 0 ${W} ${H}" id="csvg">`;
  const steps=4;
  for(let i=0;i<=steps;i++){
    const yv=y0+(y1-y0)*i/steps, yy=Y(yv);
    svg += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="${cGrid}" stroke-width="1"/>
      <text x="${padL-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="${cMut}" style="font-variant-numeric:tabular-nums">${fmt(yv,1)}</text>`;
  }
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="${cAxis}" stroke-width="1"/>`;
  const nTicks = Math.min(5, arr.length);
  for(let i=0;i<nTicks;i++){
    const idx = Math.round(i*(arr.length-1)/(nTicks-1||1));
    svg += `<text x="${X(xs[idx])}" y="${H-8}" text-anchor="middle" font-size="10" fill="${cMut}">${fmtDate(arr[idx].d)}</text>`;
  }
  const path = arr.map((e,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(e.v).toFixed(1)}`).join('');
  const apath = arr.map((e,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(avg[i]).toFixed(1)}`).join('');
  svg += `<path d="${apath}" fill="none" stroke="${cMut}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
  svg += `<path d="${path}" fill="none" stroke="${cLine}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const li = arr.length-1;
  svg += `<circle cx="${X(xs[li])}" cy="${Y(ys[li])}" r="4" fill="${cLine}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(X(xs[li]), W-padR-4)}" y="${Y(ys[li])-9}" text-anchor="end" font-size="11" font-weight="600" fill="${cInk2}">${fmt(ys[li],1)} ${unit}</text>`;
  svg += `<circle id="hovpt" r="4" fill="${cLine}" stroke="var(--surface)" stroke-width="2" style="display:none"/>
    <line id="hovln" y1="${padT}" y2="${H-padB}" stroke="${cAxis}" stroke-width="1" style="display:none"/>`;
  svg += `</svg><div class="tooltip" id="ctip" style="display:none"></div>`;
  box.innerHTML = svg;
  leg.innerHTML = `<span><span class="sw" style="background:${cLine}"></span>${esc(t('chart_daily'))}</span>
    <span><span class="sw" style="background:${cMut}"></span>${esc(t('chart_avg'))}</span>`;
  const svgEl = document.getElementById('csvg');
  const tip = document.getElementById('ctip');
  const hp = document.getElementById('hovpt'), hl = document.getElementById('hovln');
  function onMove(ev){
    const r = svgEl.getBoundingClientRect();
    const px = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left;
    const relX = px / r.width * W;
    let best=0, bd=1e18;
    xs.forEach((x,i)=>{ const d=Math.abs(X(x)-relX); if(d<bd){bd=d;best=i;} });
    const bx = X(xs[best])/W*r.width, by = Y(ys[best])/H*r.height;
    hp.style.display='';hl.style.display='';
    hp.setAttribute('cx',X(xs[best])); hp.setAttribute('cy',Y(ys[best]));
    hl.setAttribute('x1',X(xs[best])); hl.setAttribute('x2',X(xs[best]));
    tip.style.display='';
    tip.innerHTML = `<b>${fmt(ys[best],1)} ${unit}</b> · ${fmtDate(arr[best].d)}<br><span style="color:var(--muted)">${esc(t('chart_avg'))}: ${fmt(avg[best],1)}</span>`;
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(r.width-tw, bx-tw/2)) + 'px';
    tip.style.top = Math.max(0, by-58) + 'px';
  }
  function onOut(){ tip.style.display='none'; hp.style.display='none'; hl.style.display='none'; }
  svgEl.addEventListener('mousemove', onMove);
  svgEl.addEventListener('touchstart', onMove, {passive:true});
  svgEl.addEventListener('touchmove', onMove, {passive:true});
  svgEl.addEventListener('mouseleave', onOut);
  svgEl.addEventListener('touchend', onOut);
}

/* sensible single-serving caps per role (g) — no 800 g skyr in one sitting */
const MEAL_CAP = {dairy:500, pbase:300, cbase:200, veg:400, fruit:250, fat:35, extra:40};
const MEAL_CAP_FOOD = {'Skyr':600,'Magerquark':600,'Hüttenkäse':400,'Griech. Joghurt 2%':350,
 'Hähnchenbrust':350,'Putenbrust':350,'Kabeljau/Seelachs':350,'Hackfleisch Rind 5% Fett':300,'Mageres Rind':300,
 'Lachs':180,'Makrele':150,'Hering':150,'Eier':200,'Proteinpulver (Whey)':40,

function mealCapFor(name, role){ return MEAL_CAP_FOOD[name] || MEAL_CAP[role] || 200; }
const MEAL_SLOTS = {3:['breakfast','lunch','dinner'], 4:['breakfast','lunch','snack','dinner'], 5:['breakfast','snack','lunch','snack','dinner']};
const SLOT_W = {breakfast:0.25, lunch:0.32, dinner:0.32, snack:0.13};
function composeMeals(R){
  const M = Math.min(5, Math.max(3, +S.calc.meals||4));
  const keys = MEAL_SLOTS[M];
  const mains = keys.filter(k=>k!=='snack');
  let warmN = (S.myday.warm===undefined || S.myday.warm===null) ? 2 : +S.myday.warm;
  warmN = Math.max(0, Math.min(warmN, mains.length));
  const warmOrder = ['dinner','lunch','breakfast'];
  const warmSet = new Set();
  for(const k of warmOrder){ if(warmSet.size<warmN && mains.includes(k)) warmSet.add(k); }
  const wSum = keys.reduce((a,k)=>a+(SLOT_W[k]||0.2),0);
  const slots = keys.map((k,i)=>({i, key:k, warm:warmSet.has(k), snack:k==='snack', items:[], kcal:0,
    target: R.T.k*(SLOT_W[k]||0.2)/wSum}));
  const list = R.foods.map((f,idx)=>({f, g:R.g[idx], role:foodRole(f.n)})).filter(x=>x.g>0);
  const warmSlots = slots.filter(s=>s.warm);
  const coldMain = slots.filter(s=>!s.warm && !s.snack);
  const snacks = slots.filter(s=>s.snack);
  const coldAll = coldMain.concat(snacks);
  const put=(s,x,g)=>{ const gr=Math.round(g/5)*5; if(gr<5) return 0;
    const ex=s.items.find(q=>q.n===x.f.n);
    if(ex){ ex.g+=gr; } else s.items.push({n:x.f.n, ic:x.f.ic, g:gr, role:x.role, k:x.f.k, p:x.f.p, c:x.f.c, f:x.f.f});
    s.kcal += gr*x.f.k/100; return gr; };
  const dist=(x, pref, cap)=>{
    pref = (pref && pref.length) ? pref : slots;
    let rest = x.g;
    const order = pref.slice().sort((a,b)=>(b.target-b.kcal)-(a.target-a.kcal));
    for(const s of order){ if(rest<5) return; rest -= put(s, x, Math.min(rest, cap)); }
    if(rest>=5) put(order[0], x, rest);
  };
  const isOil = x => /öl\b|öl$/i.test(x.f.n);
  /* 1) protein bases: ONE per warm meal where possible (a plate has one main) */
  const pb = list.filter(x=>x.role==='pbase').sort((a,b)=>b.g*b.f.k-a.g*a.f.k);
  const pbTargets = warmSlots.length? warmSlots : (coldMain.length? coldMain : slots);
  for(const x of pb){
    const s = pbTargets.slice().sort((a,b)=>{
      const pa=a.items.filter(q=>q.role==='pbase').length, pbn=b.items.filter(q=>q.role==='pbase').length;
      return pa-pbn || (b.target-b.kcal)-(a.target-a.kcal); })[0];
    put(s, x, x.g);
  }
  /* 2) dairy: cold meals only – NEVER next to a warm meat dish */
  for(const x of list.filter(x=>x.role==='dairy')) dist(x, coldAll.length?coldAll:snacks, mealCapFor(x.f.n,'dairy'));
  /* 3) fruit: to the dairy bowls, max 2 kinds and 250 g per meal */
  for(const x of list.filter(x=>x.role==='fruit')){
    const wDairy = coldAll.filter(s=>s.items.some(q=>q.role==='dairy') && s.items.filter(q=>q.role==='fruit').length<2);
    const anyCold = coldAll.filter(s=>s.items.filter(q=>q.role==='fruit').length<2);
    dist(x, wDairy.length? wDairy : (anyCold.length? anyCold : coldAll), mealCapFor(x.f.n,'fruit'));
  }
  /* 4) nuts/seeds/nut butters: bowl toppings or snack */
  for(const x of list.filter(x=>x.role==='fat' && !isOil(x))){
    const wDairy = coldAll.filter(s=>s.items.some(q=>q.role==='dairy'));
    dist(x, wDairy.length? wDairy : (snacks.length? snacks : (coldAll.length? coldAll : warmSlots)), mealCapFor(x.f.n,'fat'));
  }
  /* 5) oils: warm cooking */
  for(const x of list.filter(x=>x.role==='fat' && isOil(x))) dist(x, warmSlots.length?warmSlots:slots, mealCapFor(x.f.n,'fat'));
  /* 6) carb bases: oats to bowls, bread to cold meals, rice/potatoes to warm plates */
  for(const x of list.filter(x=>x.role==='cbase')){
    const oat = /hafer|müsli|flocken|kleie|porridge/i.test(x.f.n);
    const bread = /brot|toast|knäcke|brötchen|baguette|wrap|pumpernickel|reiswaffel|maiswaffel/i.test(x.f.n);
    if(oat){ const wDairy = coldAll.filter(s=>s.items.some(q=>q.role==='dairy')); dist(x, wDairy.length?wDairy:coldAll, mealCapFor(x.f.n,'cbase')); }
    else if(bread) dist(x, coldAll.length?coldAll:warmSlots, mealCapFor(x.f.n,'cbase'));
    else dist(x, warmSlots.length?warmSlots:coldAll, mealCapFor(x.f.n,'cbase'));
  }
  /* 7) veg: warm plates; salad veg may join cold bread/protein meals */
  for(const x of list.filter(x=>x.role==='veg')){
    const salad = /gurke|tomate|feldsalat|salat|paprika|kresse|radies|rucola/i.test(x.f.n);
    const coldSavory = coldAll.filter(s=>s.items.some(q=>q.role==='pbase' || (q.role==='cbase' && !/hafer|flocken/i.test(q.n))));
    dist(x, warmSlots.length? warmSlots : (salad && coldSavory.length? coldSavory : coldAll), mealCapFor(x.f.n,'veg'));
  }
  /* 8) extras */
  for(const x of list.filter(x=>x.role==='extra')) dist(x, slots, mealCapFor(x.f.n,'extra'));
  return slots.filter(s=>s.items.length);
}
function mealTitle(slot){
  const has = r => slot.items.some(x=>x.role===r);

  const bread = slot.items.some(x=>/brot|toast|knäcke|brötchen|baguette|wrap|pumpernickel/i.test(x.n));
  if(has('dairy') && frozen && has('fruit')) return t('meal_icecream');

  const ux = +((S.myday.maxAmt||{})[f.n])||0;
  if(ux>0){ max = ux; if(min>ux) min = ux; }
  const sc = MYDAY_SAFECAP[f.n];
  if(sc && max>sc){ max = sc; if(min>sc) min = sc; }
  const pr = (DATA.microDB && DATA.microDB[f.n])||{};
  return {min, max, v:{k:f.k/100, p:f.p/100, f:f.f/100, c:f.c/100, fi:(f.fi||0)/100, mi:micros.map(m=>(pr[MKEY[m.key]]||0)/100)}};
}
function solveMyday(sel, K, P){
  const micros = DATA.nutrition.micros, nM = micros.length;
  const sex = S.calc.gender==='m'?'m':'f';
  /* Energieabhaengige Referenzwerte (EFSA): ALA = 0,5 % der Energie, nicht fix. */
  const rda = {}; micros.forEach(m=>rda[m.key]= m.pctEnergy ? Math.round(K*m.pctEnergy/100/9*1000) : m.rda[sex]);
  /* macro TARGETS from the user's own plan (Ernaehrungsplan): protein, fat, carbs are corridors, not floors */
  const mcv = macroCalc(K);
  /* Fett: Zielwert aus dem eigenen Plan, aber physiologischer Boden statt der Faustformel Größe/3.
     Boden = max(0,6 g/kg; 20 % der Energie) — DGE/ISSN-nah statt Bodybuilding-Heuristik. */
  const KG = +S.calc.weight||80;
  const Ffloor = Math.max(Math.round(0.6*KG), Math.round(0.20*K/9.1));
  const F = Math.max(Ffloor, Math.round(mcv.f)||0);
  /* KH: Plan-Ziel, aber nie unter 100 g. Unter 130 g (Glukosebedarf Gehirn) warnen wir. */
  const C = Math.max(100, Math.round(mcv.c)||0);
  const Ftarget = 30;   /* Ballaststoff-Ziel g/Tag (DGE) */
  const Pcap=P*1.10, Fcap=F*1.15, Ccap=C*1.15;
  const pool = mydayAllFoods().filter(f=>sel[f.n]);
  const info = pool.map(f=>mydayFoodInfo(f, micros));
  const g = new Array(pool.length).fill(0);
  for(let i=0;i<pool.length;i++) if(sel[pool[i].n]===2) g[i]=info[i].min;
  /* meal coherence: a plan should eat like real food, not like a supplement stack.
     If a bowl base (dairy) is in the pool, let a fruit and a topping ride along; always keep some veg. */
  const seedOne=(pred, amt)=>{
    const idx=pool.map((f,i)=>i).filter(i=>g[i]===0 && pred(pool[i]));
    if(!idx.length) return;
    idx.sort((a,b)=>pool[a].k-pool[b].k);
    const i=idx[0];
    g[i]=Math.max(info[i].min, Math.min(amt, info[i].max));
  };
  const anyRole = r => pool.some(f=>foodRole(f.n)===r);
  if(anyRole('dairy')){
    seedOne(f=>foodRole(f.n)==='fruit', 120);
    seedOne(f=>foodRole(f.n)==='fat' && !/öl\b|öl$/i.test(f.n), 15);
  }
  seedOne(f=>foodRole(f.n)==='veg', 150);
  const totals = ()=>{ const T={k:0,p:0,f:0,c:0,fi:0,g:0,mi:new Array(nM).fill(0)};
    for(let i=0;i<g.length;i++){ if(!g[i]) continue; const v=info[i].v;
      T.k+=g[i]*v.k; T.p+=g[i]*v.p; T.f+=g[i]*v.f; T.c+=g[i]*v.c; T.fi+=g[i]*(v.fi||0); T.g+=g[i];
      for(let j=0;j<nM;j++) T.mi[j]+=g[i]*v.mi[j]; }
    return T; };
  /* headroom: how many grams fit without breaking ANY macro cap or the kcal budget */
  /* Obergrenzen (UL) der Mikronährstoffe: wer wochenlang dasselbe isst, rutscht sonst
     über die sichere Tagesdosis – z.B. Vitamin A über Karotten oder Jod über Seefisch. */
  const ULidx = micros.map((m,j)=>m.ul? {j, ul:m.ul} : null).filter(Boolean);
  const headroom=(i,T)=>{
    const v=info[i].v;
    let h = info[i].max-g[i];
    h = Math.min(h, (K-T.k+20)/Math.max(v.k,0.005));
    if(v.p>0.002) h=Math.min(h,(Pcap-T.p)/v.p);
    if(v.f>0.002) h=Math.min(h,(Fcap-T.f)/v.f);
    if(v.c>0.002) h=Math.min(h,(Ccap-T.c)/v.c);
    for(const u of ULidx){ const d=v.mi[u.j]; if(d>0) h=Math.min(h,(u.ul-T.mi[u.j])/d); }
    return h;
  };
  for(let step=0; step<90; step++){
    const t=totals(); const remK=K-t.k;
    if(remK<15) break;
    const dp=Math.max(0,P-t.p), dfat=Math.max(0,F-t.f), dc=Math.max(0,C-t.c);
    const dm=micros.map((m,j)=>Math.max(0,rda[m.key]-t.mi[j]));
    const anyNutr = dp>2 || dfat>1 || dc>2 || dm.some((d,j)=>d>0.05*rda[micros[j].key]);
    let bi=-1,bs=-1,ki=-1,ks=-1;
    for(let i=0;i<pool.length;i++){
      const h = headroom(i,t);
      const need = g[i]===0? Math.max(10,info[i].min) : 8;
      if(h<need) continue;
      const v=info[i].v;
      /* kcal-fill fallback: fill whichever macro gap is largest, within caps */
      let sk;
      if(dc>2 && v.c>0.05) sk = 3*(v.c*100)/C/Math.max(v.k,0.005);
      else if(dp>2 && v.p>0.05) sk = 2*(v.p*100)/P/Math.max(v.k,0.005);
      else if(dfat>1 && v.f>0.05) sk = 2*(v.f*100)/F/Math.max(v.k,0.005);
      else sk = pool[i].cat==='carbs'?0.5 : pool[i].cat==='protein'?0.3 : pool[i].cat==='fat'?0.25 : 0.08;
      if(g[i]>0) sk*=1.5;
      if(sk>ks){ks=sk;ki=i;}
      if(anyNutr){
        let u=0;
        if(dp>2) u += 5*(v.p*100)/P;
        if(dfat>1) u += 2*(v.f*100)/F;
        if(dc>2) u += 3*(v.c*100)/C;
        for(let j=0;j<nM;j++) if(dm[j]>0.05*rda[micros[j].key]) u += (MICRO_SUPP.has(micros[j].key)?0.35:1.2)*Math.min((v.mi[j]*100)/rda[micros[j].key],3);
        if(u<0.05) continue;
        const s=(u/Math.max(v.k,0.005))*(g[i]>0?1.35:1);
        if(s>bs){bs=s;bi=i;}
      }
    }
    if(bi<0) bi=ki;
    if(bi<0) break;
    const h2=headroom(bi,totals());
    const chunk=(pool[bi].cat==='fat'||pool[bi].cat==='basics')?10:50;
    const add = g[bi]===0? Math.max(chunk, info[bi].min) : chunk;
    g[bi]+=Math.max(0, Math.min(add, h2));
    if(g[bi]<info[bi].min) g[bi]=0;
  }
  /* corridor polish: macros are pulled TO their targets (both directions), micros only nudge within slack */
  const act=g.map((x,i)=>x>0?i:-1).filter(i=>i>=0);
  let lr=400;
  for(let it2=0; it2<1000; it2++){
    const t=totals();
    const dk=(t.k-K)/K;
    const pU=Math.max(0,(P-t.p)/P), pO=Math.max(0,(t.p-Pcap)/P);
    const fU=Math.max(0,(F-t.f)/F), fO=Math.max(0,(t.f-Fcap)/F);
    const cU=Math.max(0,(C-t.c)/C), cO=Math.max(0,(t.c-Ccap)/C);
    const dmr=micros.map((m,j)=>Math.max(0,1-t.mi[j]/rda[m.key]));
    const anyOver = pO>0 || fO>0 || cO>0;
    for(const i of act){
      const v=info[i].v;
      /* macro caps beat the calorie target: never push amounts up while a macro is over its corridor */
      let d = (anyOver && dk<0) ? 0 : 16*dk*v.k/K;
      d += (-12*pU + 45*pO)*v.p/P;
      d += (-8*fU + 35*fO)*v.f/F;
      d += (-8*cU + 30*cO)*v.c/C;
      for(let j=0;j<nM;j++) if(dmr[j]>0) d -= 2*dmr[j]*v.mi[j]/rda[micros[j].key]/nM;
      for(const u of ULidx){ const over=(t.mi[u.j]-u.ul)/u.ul; if(over>0 && v.mi[u.j]>0) d += 25*over*v.mi[u.j]/u.ul; }
      g[i]-=lr*d;
      if(g[i]<info[i].min)g[i]=info[i].min;
      if(g[i]>info[i].max)g[i]=info[i].max;
    }
    if(it2%120===119) lr*=0.75;
  }
  /* Reparatur: keine Überschreitung sicherer Tagesobergrenzen. Wir senken den größten
     Beitragszahler, aber nie unter eine vom Nutzer gesetzte Mindestmenge. */
  for(const u of ULidx){
    let guard=0;
    while(totals().mi[u.j] > u.ul && guard++ < 60){
      let bi=-1, bs=0;
      for(const i of act){ const cb=g[i]*info[i].v.mi[u.j];
        if(cb>bs && g[i]>info[i].min+0.01){ bs=cb; bi=i; } }
      if(bi<0) break;
      const excess = totals().mi[u.j]-u.ul;
      const step = Math.max(5, Math.min(g[bi]-info[bi].min, excess/Math.max(info[bi].v.mi[u.j],1e-9)));
      g[bi] = Math.max(info[bi].min, g[bi]-step);
    }
  }
  /* Nachfüllen: was durch die Obergrenzen weggefallen ist, mit unbedenklichen Quellen ersetzen */
  const ulBlocked=new Set();
  for(let it3=0; it3<120; it3++){
    const t=totals(); if(t.k >= K*0.97) break;
    let bi=-1, bs=-1;
    for(let i=0;i<pool.length;i++){
      if(ulBlocked.has(i)) continue;
      const hd=headroom(i,t); if(hd<5) continue;
      const v=info[i].v;
      let sc = (g[i]>0?1.4:0.6) * (v.k>0? 1:0);
      if(t.f < F) sc *= 1 + 2*(v.f*100)/Math.max(F,1);
      if(t.c < C) sc *= 1 + 1.5*(v.c*100)/Math.max(C,1);
      if(sc>bs){ bs=sc; bi=i; }
    }
    if(bi<0){
      /* Eine Obergrenze blockiert den ganzen Tag (z.B. Jod durch Seefisch + viel Milchprodukt).
         Dann nehmen wir den größten Verursacher zurück, statt den Plan hungern zu lassen. */
      let bind=null, bv=1e9;
      for(const u of ULidx){ const room=u.ul-t.mi[u.j]; if(room<bv){ bv=room; bind=u; } }
      if(!bind || bv>1) break;
      let ri=-1, rs=0;
      for(let i=0;i<pool.length;i++){ const cb=g[i]*info[i].v.mi[bind.j];
        if(cb>rs && g[i]>info[i].min+0.01){ rs=cb; ri=i; } }
      if(ri<0) break;
      g[ri]=Math.max(info[ri].min, g[ri]-25); ulBlocked.add(ri);
      continue;
    }
    const t2=totals();
    g[bi] += Math.max(5, Math.min(headroom(bi,t2), 25));
  }
  for(let i=0;i<g.length;i++) if(g[i]>0) g[i]=Math.round(g[i]/5)*5;
  for(const u of ULidx){                       /* Rundung darf die Grenze nicht wieder reißen */
    let guard=0;
    while(totals().mi[u.j] > u.ul && guard++ < 20){
      let bi=-1, bs=0;
      for(const i of act){ const cb=g[i]*info[i].v.mi[u.j]; if(cb>bs && g[i]>info[i].min+0.01){ bs=cb; bi=i; } }
      if(bi<0) break;
      g[bi]=Math.max(info[bi].min, g[bi]-5);
    }
  }
  const T=totals();
  const gaps=[];
  const allF = mydayAllFoods();
  /* suggestions must be realistic: judge a food by what ONE normal portion delivers,
     not by its per-100 g value (nobody eats 100 g of cinnamon), and skip condiments/sweeteners */
  const SERVING = {pbase:150, dairy:200, cbase:100, veg:200, fruit:150, fat:30, extra:10};
  const candPool = allF.filter(f=>!sel[f.n] && foodRole(f.n)!=='extra');
  const serv = f => SERVING[foodRole(f.n)] || 100;
  const topBy = (fn, roles, minPerServing) => candPool
    .filter(f=>!roles || roles.includes(foodRole(f.n)))
    .filter(f=>!/gelatine|kollagen/i.test(f.n))          /* incomplete protein – not a real fix */
    .map(f=>({n:f.n, ic:f.ic, amt:serv(f)*fn(f)/100, dens:fn(f)/((f.k||50)+20)}))
    .filter(x=>x.amt>=(minPerServing||8)).sort((a,b)=>b.dens-a.dens).slice(0,2);
  /* macro gaps (pool cannot reach plan) */
  if(T.k < K*0.92) gaps.push({key:'kcal', icon:'🔥', cov:Math.round(T.k/K*100), sugg:topBy(f=>f.k, ['cbase','fat'], 80), supp:'msupp_kcal', macro:true});
  if(T.p < P*0.92) gaps.push({key:'protein', icon:'🍗', cov:Math.round(T.p/P*100), sugg:topBy(f=>f.p, ['pbase','dairy'], 12), supp:'msupp_protein', macro:true});
  if(T.c < C*0.90) gaps.push({key:'carbs', icon:'🍞', cov:Math.round(T.c/C*100), sugg:topBy(f=>f.c, ['cbase','fruit'], 12), supp:'msupp_carbs', macro:true});
  if(T.f < F*0.90) gaps.push({key:'fat', icon:'🥑', cov:Math.round(T.f/F*100), sugg:topBy(f=>f.f, ['fat'], 5), supp:'msupp_fat', macro:true});
  if(T.fi < Ftarget*0.85) gaps.push({key:'fiber', icon:'🌾', cov:Math.round(T.fi/Ftarget*100), sugg:topBy(f=>f.fi||0, ['cbase','veg','fruit','fat'], 2), supp:'msupp_fiber', macro:true});
  /* micro gaps -> small food additions or supplements, never macro-busting amounts */
  micros.forEach((m,j)=>{
    const cov=T.mi[j]/rda[m.key];
    if(cov<0.95){
      const cands = candPool.map(f=>{
        const pr=(DATA.microDB&&DATA.microDB[f.n])||{}; const c100=pr[MKEY[m.key]]||0;
        const deliver = serv(f)*c100/100;
        return {n:f.n, ic:f.ic, pct:deliver/rda[m.key], kc:Math.max(serv(f)*(f.k||50)/100, 20)};
      }).filter(x=>x.pct>=0.15).sort((a,b)=>(b.pct/b.kc)-(a.pct/a.kc)).slice(0,2);
      gaps.push({key:m.key, icon:m.icon, cov:Math.round(cov*100), sugg:cands, supplementable:MICRO_SUPP.has(m.key)});
    }
  });
  /* --- Sicherheits- und Qualitätshinweise für einen Plan, der wochenlang gleich bleibt --- */
  const warns=[];
  micros.forEach((m,j)=>{ if(m.ul && T.mi[j] > m.ul)
    warns.push({type:'ul', key:m.key, icon:'⚠️', val:Math.round(T.mi[j]), ul:m.ul, unit:m.unit}); });
  if(C < 130) warns.push({type:'lowcarb', icon:'🧠', val:Math.round(C)});
  if(T.g < 1800) warns.push({type:'volume', icon:'🍽️', val:Math.round(T.g)});
  /* Pflanzenvielfalt: Substrat fürs Mikrobiom – bei Monotonie der erste Engpass */
  const plantRoles=new Set(['veg','fruit','cbase','fat']);
  const plantCount = pool.filter((f,i)=>g[i]>0 && plantRoles.has(foodRole(f.n)) && !/öl\b|öl$/i.test(f.n)).length;
  if(plantCount < 8) warns.push({type:'diversity', icon:'🌱', val:plantCount});
  const diversity = pool.filter((f,i)=>g[i]>0).length;
  /* Rotationshinweis: alles, was täglich in großer Menge läuft */
  const rot = pool.map((f,i)=>({n:f.n, g:g[i]})).filter(x=>x.g>=150 && MYDAY_SAFECAP[x.n]===undefined
      && ['cbase','pbase','dairy'].includes(foodRole(x.n)));
  if(rot.length) warns.push({type:'rotation', icon:'🔁', foods:rot.slice(0,3).map(x=>x.n)});
  return {foods:pool, g, T, rda, micros, Fmin:F, C, P, Ftarget, KG, gaps, warns, diversity, plantCount};
}
function calcMyday(){
  const sel=S.myday.sel;
  if(Object.keys(sel).filter(n=>sel[n]).length<4){ window._mydayRes=false; renderFood(); return; }
  window._mydayRes = solveMyday(sel, +S.myday.kcal||2200, +S.myday.prot||150);
  window._mydayAdded=false; renderFood();

}
