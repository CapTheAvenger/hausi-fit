<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hausi Fit</title>
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface2:#f0efec;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-ink:#fff; --good:#006300; --bad:#d03b3b;
  --s2:#eb6834; --s3:#1baf7a;
  --chip:#f0efec; --shadow:0 1px 3px rgba(0,0,0,.06);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#242422;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-ink:#fff; --good:#0ca30c; --bad:#e66767;
  --s2:#d95926; --s3:#199e70;
  --chip:#242422; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface2:#242422;
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-ink:#fff; --good:#0ca30c; --bad:#e66767;
    --s2:#d95926; --s3:#199e70;
    --chip:#242422; --shadow:none;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
header.app{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
header.app h1{font-size:20px; margin:0; letter-spacing:-.3px}
header.app .hsub{font-size:12px;color:var(--muted)}
.hbtns{display:flex;gap:8px}
.hbtn{border:1px solid var(--border); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:6px 10px; font-size:14px; cursor:pointer}
main{padding:12px 14px 24px; max-width:640px; margin:0 auto}
.view{display:none}
.view.active{display:block}
h2{font-size:17px;margin:18px 2px 10px}
h3{font-size:15px;margin:14px 2px 8px}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
}
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:999px; font-size:14px;
  background:var(--chip); color:var(--ink2); border:1px solid var(--border); cursor:pointer;
  white-space:nowrap;
}
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.excard{padding:12px 14px}
.exhead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.expat{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:2px}
.exname{font-size:16px; font-weight:650; color:var(--ink); border:none; background:none;
  padding:0; text-align:left; cursor:pointer; font-family:inherit; line-height:1.3}
.exname .sw{color:var(--accent); font-size:13px; font-weight:500}
.extarget{font-size:12px; color:var(--muted); margin-top:2px}
.exlast{font-size:12px; color:var(--ink2); margin-top:2px}
.exrow{display:flex; gap:8px; margin-top:10px; align-items:flex-end}
.fld{flex:1; min-width:0}
.fld label{display:block; font-size:11px; color:var(--muted); margin-bottom:3px}
.numwrap{display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden}
.numwrap input{width:100%; border:none; background:transparent; color:var(--ink); font-size:16px;
  padding:9px 2px; text-align:center; font-family:inherit; min-width:0}
.numwrap input:focus{outline:none}
.stepbtn{border:none; background:transparent; color:var(--accent); font-size:18px; font-weight:700;
  padding:8px 10px; cursor:pointer; flex:0 0 auto}
input[type=number],input[type=text],input[type=date],select{
  width:100%; border:1px solid var(--border); border-radius:10px; background:var(--surface2);
  color:var(--ink); font-size:16px; padding:9px 10px; font-family:inherit;
}
.btn{
  border:none; border-radius:12px; padding:11px 16px; font-size:15px; font-weight:600;
  background:var(--accent); color:var(--accent-ink); cursor:pointer; font-family:inherit;
}
.btn.sec{background:var(--surface2); color:var(--ink); border:1px solid var(--border)}
.btn.small{padding:8px 12px; font-size:13px; border-radius:10px}
.btn:active{transform:scale(.98)}
.savebtn{flex:0 0 auto}
.histwrap{margin-top:8px; font-size:12px; color:var(--ink2)}
.histchip{display:inline-block; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:3px 8px; margin:2px 4px 2px 0}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px}
.tile .tv{font-size:22px; font-weight:700; letter-spacing:-.3px}
.tile .tl{font-size:12px; color:var(--muted); margin-top:2px}
.tile .tu{font-size:13px; color:var(--ink2); font-weight:500}
.tile.big{grid-column:1/-1}
.tile.hl{border-color:var(--accent)}
table.mini{width:100%; border-collapse:collapse; font-size:14px}
table.mini th{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
  text-align:left; padding:6px 6px; border-bottom:1px solid var(--grid); font-weight:600}
table.mini td{padding:7px 6px; border-bottom:1px solid var(--grid)}
table.mini tr:last-child td{border-bottom:none}
table.mini td.num, table.mini th.num{text-align:right; font-variant-numeric:tabular-nums}
.rowflex{display:flex; gap:10px}
.rowflex>*{flex:1}
.subtabs{display:flex; gap:6px; background:var(--surface2); border-radius:12px; padding:4px; margin-bottom:12px}
.subtab{flex:1; text-align:center; padding:8px 4px; border-radius:9px; font-size:13px;
  color:var(--ink2); cursor:pointer; border:none; background:transparent; font-family:inherit; white-space:nowrap}
.subtab.on{background:var(--surface); color:var(--ink); font-weight:650; box-shadow:var(--shadow); border:1px solid var(--border)}
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabbar button{
  flex:1; min-width:0; border:none; background:none; color:var(--muted); font-size:9.5px;
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  padding:4px 0; font-family:inherit; white-space:nowrap; overflow:hidden;
}
nav.tabbar button.on{color:var(--accent); font-weight:650}
nav.tabbar .ico{font-size:21px; line-height:1}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none}
.modal-bg.open{display:block}
.modal{
  position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:82vh; overflow:auto;
  background:var(--surface); border-radius:20px 20px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  display:none; max-width:640px; margin:0 auto;
}
.modal.open{display:block}
.modal h3{margin-top:2px}
.pickitem{display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:11px 8px; border-bottom:1px solid var(--grid); cursor:pointer; border-radius:8px}
.pickitem:active{background:var(--surface2)}
.pickitem.on{color:var(--accent); font-weight:650}
.pickitem .pw{font-size:12px; color:var(--muted); flex:0 0 auto; font-variant-numeric:tabular-nums}
.searchrow{display:flex; gap:8px; margin-bottom:10px}
.list-item{display:flex; justify-content:space-between; gap:8px; padding:10px 4px; border-bottom:1px solid var(--grid); align-items:center}
.list-item:last-child{border-bottom:none}
.foodgrid{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.foodchip{background:var(--surface2); border:1px solid var(--border); border-radius:999px; padding:5px 11px; font-size:13px; color:var(--ink2)}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
@media(max-width:380px){.fgrid{grid-template-columns:1fr}}
.fcard{display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:8px 10px; min-width:0}
.fic{font-size:24px; flex:0 0 auto; line-height:1}
.fbody{min-width:0}
.fname{font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.fval{font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; margin-top:1px}
.fval b{color:var(--ink)}
.fmuted{color:var(--muted)}
.fnote{font-size:10.5px; color:var(--accent); margin-top:2px}
details.acc summary span:first-child{display:flex; align-items:center; gap:8px}
.checkrow{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--grid); font-size:15px}
.checkrow:last-child{border-bottom:none}
.checkrow input{width:20px; height:20px; accent-color:var(--accent); flex:0 0 auto}
.checkrow.done span{text-decoration:line-through; color:var(--muted)}
.recipecard{cursor:pointer}
.recipecard .rc-body{display:none; margin-top:10px; font-size:14px; color:var(--ink2)}
.recipecard.open .rc-body{display:block}
.rc-cat{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent); font-weight:650}
.rc-name{font-size:16px; font-weight:650; margin-top:2px}
.rc-instr{white-space:pre-wrap; margin-top:8px; border-top:1px solid var(--grid); padding-top:8px}
.chartbox{margin-top:6px}
.chartbox svg{display:block; width:100%; height:auto; touch-action:pan-y}
.legend{display:flex; gap:14px; font-size:12px; color:var(--ink2); margin:4px 2px}
.legend .sw{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px}
.tooltip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:6px 9px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.18); z-index:5; white-space:nowrap}
.toast{
  position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); border-radius:999px; padding:9px 18px; font-size:14px; font-weight:600;
  z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;
}
.toast.show{opacity:1}
.note{font-size:12.5px; color:var(--muted)}
.divider{height:1px; background:var(--grid); margin:12px 0}
.sldrow{display:flex; align-items:center; gap:10px; margin:8px 0}
.sldrow label{flex:0 0 135px; font-size:13.5px; color:var(--ink2)}
.sldrow input[type=range]{flex:1; accent-color:var(--accent); height:26px; min-width:0}
.sldrow .sv{flex:0 0 56px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; font-size:14px}
.sldnum{flex:0 0 74px; padding:0 2px}
.sldnum input{padding:7px 2px; font-weight:600; text-align:center}
.numunit{font-size:12px; color:var(--muted); padding-right:8px}
.bfimg{width:100%; border-radius:12px; display:block; border:1px solid var(--border)}
.planstep{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--grid)}
.plannum{flex:0 0 26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center}
.planst{font-size:14px; font-weight:600; color:var(--ink)}
.planval{flex:0 0 auto; font-size:14px; font-variant-numeric:tabular-nums; color:var(--ink2)}
.planval b{color:var(--ink); font-size:15px}
.artlist{margin:2px 0 0; padding-left:18px}
.artlist li{margin-bottom:8px; font-size:14px; color:var(--ink2); line-height:1.45}
.suplbl{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:650; margin-right:4px}
.seg{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden}
.seg button{flex:1; border:none; background:var(--surface2); color:var(--ink2); padding:9px 6px; font-size:14px; cursor:pointer; font-family:inherit}
.seg button.on{background:var(--accent); color:var(--accent-ink); font-weight:650}
.del{color:var(--bad); background:none; border:none; font-size:16px; cursor:pointer; padding:4px 8px}
details.acc{border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--surface)}
details.acc summary{padding:12px 14px; font-weight:650; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.acc summary::after{content:"›"; transform:rotate(90deg); color:var(--muted); font-size:18px}
details.acc[open] summary::after{transform:rotate(-90deg)}
details.acc .accbody{padding:0 14px 12px}
.statline{display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px solid var(--grid)}
.statline:last-child{border-bottom:none}
.statline .sl{color:var(--ink2)}
.statline .sv{font-weight:650; font-variant-numeric:tabular-nums}
/* Login */
#login{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:none; align-items:center; justify-content:center; padding:20px;
}
#login.open{display:flex}
.loginbox{width:100%; max-width:380px}
.loginbox h1{font-size:26px; text-align:center; margin:0 0 4px}
.loginbox .sub{text-align:center; color:var(--muted); font-size:14px; margin-bottom:22px}
.loginbox .fld{margin-bottom:10px}
.lbtn{width:100%; margin-top:4px}
.gbtn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--surface); color:var(--ink); border:1px solid var(--border);
  border-radius:12px; padding:11px 16px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
}
.orsep{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:14px 0}
.orsep::before,.orsep::after{content:""; flex:1; height:1px; background:var(--grid)}
.loginerr{color:var(--bad); font-size:13px; margin-top:8px; min-height:18px; text-align:center}
.loginlink{background:none;border:none;color:var(--accent);font-size:13.5px;cursor:pointer;font-family:inherit;padding:6px}
.logincenter{text-align:center;margin-top:8px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.syncdot.ok{background:var(--good)} .syncdot.err{background:var(--s2)}
.star{background:none;border:none;font-size:16px;cursor:pointer;padding:0 0 0 6px;line-height:1}
.cartbtn{background:none;border:none;padding:0 2px;font-size:14px;cursor:pointer;filter:grayscale(1);opacity:.4;vertical-align:middle}
.cartbtn.on{filter:none;opacity:1}
.amtin{width:52px;min-width:52px;padding:4px 4px;font-size:13px;text-align:right;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);-moz-appearance:textfield}
.amtin::-webkit-outer-spin-button,.amtin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.covrow{display:flex;align-items:center;gap:8px;margin:3px 0}
.covrow .cl{flex:0 0 96px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.covrow .cb{flex:1;height:8px;border-radius:4px;background:var(--line,#8883);overflow:hidden}
.covrow .cb>div{height:100%}
.covrow .cv{flex:0 0 44px;font-size:12px;font-weight:650;text-align:right}
.pickchip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;margin:3px 3px 0 0;cursor:pointer;color:var(--ink)}
.pickchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pickchip.must{background:#b8860b;border-color:#e2a400;color:#fff}
.mdetrow td{background:var(--surface2);font-size:12px;padding:8px 10px}
</style>
</head>
<body>
<header class="app">
  <div>
    <h1>🏋️ Hausi Fit</h1>
    <div class="hsub" id="hsub"></div>
  </div>
  <div class="hbtns">
    <button class="hbtn" id="langbtn">DE</button>
    <button class="hbtn" id="themebtn">◑</button>
  </div>
</header>
<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-calc"></section>
  <section class="view" id="v-meas"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-more"></section>
</main>
<nav class="tabbar" id="tabbar"></nav>
<div class="modal-bg" id="modalbg" onclick="closeModal()"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<div id="login">
  <div class="loginbox">
    <h1>🏋️ Hausi Fit</h1>
    <div class="sub" id="loginSub"></div>
    <button class="gbtn" id="googleBtn" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
      <span id="googleBtnTxt"></span>
    </button>
    <div class="orsep" id="orsep"></div>
    <div class="fld"><label id="lblEmail"></label><input type="email" id="liEmail" autocomplete="email" inputmode="email"></div>
    <div class="fld"><label id="lblPw"></label><input type="password" id="liPw" autocomplete="current-password"></div>
    <button class="btn lbtn" id="loginBtn" onclick="doEmailAuth()"></button>
    <div class="loginerr" id="loginErr"></div>
    <div class="logincenter"><button class="loginlink" id="modeToggle" onclick="toggleAuthMode()"></button></div>
    <div class="logincenter"><button class="loginlink" id="pwReset" onclick="doReset()"></button></div>
  </div>
</div>

o","Leche baja en grasa","Aceite de oliva","Huevo entero","Arándanos","Fresa"],"sp":["Sal","Canela","Levadura","Jengibre molido","Esencia de vainilla"],"txt":"1.\tPrecalentar el horno a 170ºC y preparar un molde. Podemos engrasarlo ligeramente con aceite para facilitar el desmoldado posterior.\n2.\tCombinar en un recipiente los copos de avena con la levadura, las especias, la sal y las almendras. También podemos combinar copos de avena de diferentes tamaños para darle otra textura a la miga.\n3.\tBatir con unas varillas manuales en otro cuenco la leche con el plátano machacado, la vainilla, el huevo y el aceite. Echar a los ingredientes secos y combinar bien, añadiendo los arándanos.\n4.\tVerter en el molde, procurando que quede distribuido de forma homogénea, y coronar con fresas lavadas y cortadas al gusto\n5.Hornear durante unos 35-40 minutos, hasta que esté bien dorado por arriba. Servir y disfrutar"},{"cat":"breakfast","name":"Avenita caliente con banano, fresas y huevo duro","ing":["Avena","Banano","Fresa","Leche baja en grasa","Huevo entero"],"sp":[],"txt":"1.\tColocar la avena en una olla y llenarla con agua de tal manera que la cubra por completo\n2.\tLa cocinamos a fuego medio\n3.\tAgregar la mitad del banano machacado y dejar la otra mitad para decorar\n4.\tCuando la avena tiene la textura deseada sacar del fuego\n5.\tServir y decorar con tus toppings"},{"cat":"breakfast","name":"Bowl choco/banano","ing":["Banano","Yogur griego","Chia","Linaza","Almendras","Chocolate 80% cacao"],"sp":[],"txt":"1.\tBatir la mitad del banano junto con el yogurt y verter la mezcla en un bowl.\n2.\tCortar la otra mitad en rodajas y repartirlo al gusto en el bowl.\n3.\tAñadimos las semillas, las almendras y el chocolate\n4.\tDisfrutar"},{"cat":"breakfast","name":"Quark con arandanos","ing":["Magerquark","Heidelbeeren, gefroren","Chiasamen","Leinsamen","Paranuss","Mandeln","Haferflocken"],"sp":[],"txt":null},{"cat":"breakfast","name":"Huevos mexicanos","ing":["Mantequilla","Huevo entero","Cebolla","Tomate","Pan integral"],"sp":["Siracha","Cilantro"],"txt":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo, sal y pimienta al gusto\n4.\tCoges los panes y los pones a tostar, después sobre ellos pones el huevo\n5.\tDecorar con cilantro y siracha al gusto"},{"cat":"breakfast","name":"Huevos pericos con galletas de arroz","ing":["Mantequilla","Huevo entero","Cebolla","Tomate","Galletas de arroz","Mermelada"],"sp":[],"txt":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada"},{"cat":"breakfast","name":"Huevos pericos con mazorca y galletas de arroz","ing":["Mantequilla","Huevo entero","Cebolla","Tomate","Maíz en lata","Galletas de arroz","Mermelada"],"sp":[],"txt":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo y el maíz de lata, mezclamos bien. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada"},{"cat":"breakfast","name":"Huevos revueltos","ing":["Mantequilla","Cebolla","Tomate","Huevos","Pan integral"],"sp":[],"txt":"1. En un sartén agregar la mantequilla\n2. Cortar el tomate y la cebolla y agregarlos al sartén\n3.Cuando la cebolla esté traslúcida agregar los huevos y revolver.\n4.Cocinar hasta el punto que te guste.\n5. Servir con pan integral\nDisfrutar"},{"cat":"breakfast","name":"Pancackes tipo Matilda","ing":["Avena","Chia","Linaza","Leche baja en grasa","Queso cottage 0% grasa","Huevo entero","Banano","Fresa","Miel","Almendras"],"sp":[],"txt":"1.En tu licuadora pon la avena para hacerla harina, luego agregar la chia, linaza, huevo, queso cottage, banano y leche.\n2. Batir hasta tener una mezcla homogénea.\n3. Engrasar el sartén con mantequilla.\n4. Con una cuchara coger un poco de la mezcla y arma tus tortitas.\n5. Dorar por lado y lado\n6. Decorar con topings."},{"cat":"breakfast","name":"Rühreei","ing":["Ei","Butter"],"sp":[],"txt":null},{"cat":"breakfast","name":"Rühreei mit Zwiebeln","ing":["Ei","Butter","Zwiebeln"],"sp":[],"txt":null},{"cat":"breakfast","name":"Tiramisú al desayuno","ing":["Yogur griego","Huevo entero","Leche baja en grasa","Avena","Miel","Aceite de oliva"],"sp":["Esencia de vainilla","Canela","Cacao en polvo"],"txt":"1.\tLo primero que haremos será el bizcocho y para ello haremos un mug cake (un bizcocho en una taza). Mezclaremos muy bien en una taza, el huevo, la leche, la harina de avena (la haces simplemente moliendo la avena), la levadura, la miel (o pasta de dátiles si tienes) y la canela. Engrasamos una taza pintándola con un poco de aceite de oliva y echamos la mezcla del bizcocho. La metemos al microondas 3 minutos.\n2.\tUna vez pasado ese tiempo sacamos el bizcocho de la taza, lo dejamos atemperar y lo desmigajamos bien. Le echamos el café por encima y lo removemos bien para que el café empape bien todo el bizcocho.\n3.\tAhora haremos la crema. Mezclamos el yogurt, la vainilla y la miel. Mezclamos muy bien hasta que quede una crema uniforme.\n4.\tCogemos un vasito y empezamos a montar el tiramisú de la siguiente forma: ponemos una capa de bizcocho, luego una capa de crema de queso, otra capa de bizcocho, otra capa de crema de queso… y así hasta que lleguemos al final del vaso donde culminaremos con una capa de queso y cacao espolvoreado. Para esto yo uso un colador, pongo un poco de cacao en el colador y le doy unos toques laterales y queda perfectamente espolvoreado."},{"cat":"breakfast","name":"Tostada con tomates asados y aguacate triturado","ing":["Pan integral","Huevo entero","Aguacate","Aceite de oliva","Tomates cherry"],"sp":["Sal","Pimienta"],"txt":"1.\tAjuste el horno a 350°F / 180°C / Gas 4.\n2.\tMezcla las mitades de tomate en aceite de oliva y condimento. Transfiere a una bandeja para hornear en una capa uniforme y hornea durante 20-25 minutos, hasta que esté suave y fragante.\n3.\tMientras tanto, hierve agua en una olla, agrega suavemente los huevos y cocina durante 6 minutos para obtener huevos cocidos blandos. Retira y sumerge en agua helada para evitar que se cocinen más. Luego pelar.\n4.\tTostar el pan integral. Cubre con aguacate, jugosos tomates asados, huevos duros y una pizca generosa de sal y pimienta.\n5.\tPara preparar la comida, recomiendo calentar los tomates y tostar el pan justo antes de armarlo. Dependiendo de cuánto tiempo tengas en las mañanas, incluso puedes hervir los huevos con anticipación y guardarlos en el refrigerador."},{"cat":"breakfast","name":"Tostadas francesas","ing":["Huevo entero","Pan integral","Miel","Mantequilla","Leche baja en grasa"],"sp":[],"txt":"1.\tEn un bowl colocar el huevo, la leche y la canela\n2.\tCoger un sartén y agregar la mantequilla\n3.\tPasas por la mezcla las rebanadas de pan, procura que se impregnen super bien\n4.\tDorar las rebanadas en el sartén\n5.\tDecorar con miel y fresas"},{"cat":"breakfast","name":"Parfait de fruits","ing":["Chia","linaza","Leche baja en grasa","miel","fresa","kiwi"],"sp":[],"txt":"1.\tEn un vaso colocar las semillas de chia y de linaza\n2.\tAgregar la leche y la miel\n3.\tDejar durante toda la noche en la nevera \n4.\tAl siguiente día obtendrás un pudding ya que la chia ha absorvido gran parte de los líquidos \n5.\tDecorar con tus toppings\n6.\tServir y disfrutar"},{"cat":"breakfast","name":"Avocado toast con huevos pericos","ing":["Mantequilla","Cebolla","Tomate","Huevo entero","Pan integral","Aguacate"],"sp":[],"txt":"1)\tCortar la cebolla y el tomate en cuadrados pequeños\n2)\tEn un sartén pones a derretir la mantequilla\n3)\tCuando la mantequilla ya esté caliente agregas la cebolla y el tomate\n4)\tMientras la cebolla se pone transparente y el tomate saca sus jugos pon el pan a tostar\n5)\tAgregar el huevo al fuego, dejas que se cocine \n6)\tCoges el aguacate y haces una crema suave para poner sobre el pan previamente tostado\n7)\tCuando el huevo esté en el punto que te guste, sácalo del fuego \n8)\tEmplatamos: Coges el plan, lo untamos de la crema de aguacate, agregas el huevo perico\n9)\tDisfruta"},{"cat":"breakfast","name":"Avenita caliente con banano y huevo duro","ing":["Chia","Linaza","Leche baja en grasa","Avena","Banano","Huevo entero"],"sp":[],"txt":"1)\tColocar la avena en una olla\n2)\tAgregar la leche y la canela\n3)\tCalentar hasta encontrar la consistencia que más te guste.\n4)\tDecorar con el banano, las semillas de chía y de linaza.\n5)\tAcompañar con huevo(s) duros(s) *Depende de tu plan"},{"cat":"lunch","name":"Bowl oriental","ing":["Aceite de oliva","Cebolla","Ajo","Zanahoria","Dátiles","Pasta de tomate","Arverjas","Carne Molida baja en grasa","Ensalada de lechuga, tomate y pepino"],"sp":[],"txt":"1.Hacer el arroz según las instrucciones del empaque y reservar\n2.En un sartén agregar el aceite, la cebolla, el ajo. Espera a que la cebolla se ponga transparente y agrega la carne molida.\n3.Añada las zanahorias, los dátiles, la pasta de tomate, 100g de agua, 1 cucharadita de sal, la pimienta, el comino, la canela y el curry.\n4.Después agregar las arvejas y cocinar durante 40 minutos.\n5.Emplatar y servir con una ensalada de lechuga, tomate y pepino del tamaño de tu mano"},{"cat":"lunch","name":"Croquetas de atún","ing":["Atún en agua","Linaza","Huevo","Zumo de limón","Aceite de oliva","Arroz","Aguacate","Leche baja en grasa"],"sp":["Ajo en polvo","Pimienta","Sal","Perejil picado"],"txt":"1. Vaciamos las latas de atún sobre un colador fino y exprimimos lo más que se pueda, para que el atún nos quede con la menor cantidad de líquido posible.\n2. Lavamos el perejil y lo picamos finito.\n3. En un bowl grande, agregamos el atún, la linaza, el perejil, el huevo, el jugo de limón, el ajo en polvo y salpimentamos. Mezclamos hasta integrar perfectamente.\n4. Colocamos un sartén grande a fuego medio y agregamos el aceite. Con ayuda de una servilleta, lo esparcimos sobre toda la superficie y retiramos el exceso.\n5. Comenzamos a formar las tortitas de atún, una a una, con nuestras manos. Tomamos un poco de la mezcla, formamos una bola y después la aplanamos apretando bien para que no se desbarate al cocinarla. Con ayuda de nuestras manos, redondeamos las orillas para que nos queden bonitas y no con forma de amiba. =)\n6. Colocamos en el sartén cada tortita que vayamos formando. Cocinamos alrededor de 5 minutos por cada lado, o hasta que éste se vea doradito. Al voltear, apretamos un poquito más con una pala de cocina, para terminar de sacar líquido y que la croqueta quede bien compacta.\n7. Conforme vayan saliendo, colocamos las tortitas sobre una servilleta de cocina para absorber el excedente de grasa."},{"cat":"lunch","name":"Ensalada de quinua con gambas y aguacate","ing":["Camarones","Quinua","Tomate","Mango","Aguacate","Pimentón rojo","Cebolla","Zumo de Naranja","Zumo de Limón","Salsa tabasco","Ajo","Aceite de oliva"],"sp":["Sal y pimienta"],"txt":"Prepara el cuscús perlado según las instrucciones del paquete. Escúrrelo y resérvalo.\n2. Sazona las gambas en un bol para mezclar.\n3. Pon una sartén de acero al carbono a fuego alto, rocíala con un poco de aceite y añade las gambas. Cocínalas, unos 6 - 8 minutos. Una vez terminada la cocción, corta las gambas en trozos.\n4. Prepara todos los ingredientes.\n5. Mezcla los ingredientes en una taza para la salsa.\n6. Combina las gambas y los ingredientes de la ensalada en un bowl grande. Vierte la salsa y mezcla todo suavemente.\n7. Sazona al gusto con sal marina y pimienta, y utiliza zumo de lima o naranja para ajustar el sabor según sea necesario."},{"cat":"lunch","name":"Hausi Mittag","ing":["Reis","Hähnchen","Brokkoli","Erbsen","Mais","Kidneybohnen"],"sp":[],"txt":null},{"cat":"lunch","name":"Pasta de atún","ing":["Atún en agua","Cebolla","Tomate","Aguacate","Mayonesa","Pasta"],"sp":[],"txt":"1.\tPicas la cebolla y el tomate en cuadritos pequeños\n2.\tCoges el aguacate, lo machacas, le agregas sal y pimienta al gusto\n3.\tAgregas la mayonesa al aguacate y mezclas bien\n4.\tColocar la cebolla y el tomate a la preparación anterior\n5.\tEscurres el atún y lo agregas a la mezcla\n6.\tHaces la pasta como indica en el empaque\n7.\tJuntas todo y a disfrutar"},{"cat":"lunch","name":"Pollo al limón y aceitunas verdes","ing":["Aceite de oliva","Cebolla","Pechuga de pollo","Zumo de Limón","Aceitunas verdes","Arroz"],"sp":[],"txt":"1.\tEn un sartén colocar el aceite de oliva, y las rodajas de un limón. Esperar hasta que las rodajas estén doradas y hagan sacado su jugo.\n2.\tSacar las rodajas del fuego y ahí mismo colocamos la pechuga de pollo cortada en cubos.\n3.\tDoramos por ambos lados y reservamos el pollo fuera del fuego.\n4.\tEn el mismo sartén agregamos cebolla cortada en cuadritos pequeños.\n5.\tAgregamos condimento como sal, pimienta, jengibre, cúrcuma, ajo en polvo y esperamos hasta que la cebolla se vaya poniendo tierna y transparente.\n6.\tDespués agregamos media taza de agua y colocamos de nuevo el pollo en el sartén.\n7.\tAgregamos el jugo de un limón, las aceitunas verdes cortadas en cubos y las rodajas de limón que utilizamos al principio de la preparación.\n8.\tCubrimos por unos minutos y dejamos cocinar a fuego medio para que todos lo sabores se combinen perfectamente\n9.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz"},{"cat":"lunch","name":"Pollo con coliflor","ing":["Aceite de oliva","Cebolla","Ajo","Pechuga de pollo","Quinua","Frijoles en lata","Coliflor","Ensalada","Lechuga","Tomate","Pepino","Aceite de oliva","Miel","Yogur griego"],"sp":[],"txt":"1.\tHacer la quinua según el empaque. (Puedes agregar al agua un poco de sal y un ajo sin cáscara para darle mejor sabor)\n2.\tCuando la quinua esté hecha agregar los fríjoles de lata y revolver bien. Agregar un chorrito de limón para darle un sabor refrescante\n3.\tEn una bandeja para horno colocar la coliflor en pequeños pedazos, condimentarla completamente con páprika, sal y pimienta.\n4.\tHacer lo mismo con tu pechuga de pollo\n5.\tLlevar al horno y cocinar hasta que el pollo esté completamente hecho\n6.\tLuego vamos a hacer un aliño para la ensalada. Mezclamos yogur griego, aceite balsámico, aceite de oliva, miel, sal y pimienta.\n7.\tPor último vamos a servir nuestra quinoa con fríjoles, el pollo y la ensalada con nuestro aderezo."},{"cat":"lunch","name":"Pollo Guisado","ing":["Pechuga de pollo","Pasta de tomate","Arroz","Aceite de oliva","Azúcar de coco","Agua","Pimentón verde","Pimentón rojo","Cebolla"],"sp":["Sal","Pimienta","orégano"],"txt":"1. En un bowl añade el pollo, el sofrito y los condimentos. Frótalo por todo el pollo y déjalo marinar 20 minutos (a temperatura ambiente) o durante varias horas, hasta toda la noche, en la nevera.\n2. Pon una olla con tapa a fuego medio-alto. Una vez caliente, añade el aceite y espolvorea el azúcar. Una vez que vea que el azúcar empieza a caramelizarse, aproximadamente 1 minuto, añada el pollo marinado (conserva el recipiente). Dora el pollo por un lado durante 3 - 5 minutos, o hasta que aparezcan marcas de cocción profundas, y luego da la vuelta al pollo.\n3. Reduce el fuego a medio, vierte ¼ de taza de agua y cubre el pollo con el pimiento y las rodajas de cebolla. Cubre y cocina durante unos 5 minutos hasta que las verduras se hayan ablandado, PERO sigan estando tiernamente crujientes. Si es necesario, añade cucharadas de agua para evitar que se quemen.\n4. Vierte el agua restante en el recipiente que utilizaste para marinar el pollo y agítalo para quitar el resto de los condimentos y el sofrito de los lados. Luego viértelo en la olla junto con la salsa de tomate. Mézclalo rápidamente, luego tápalo y cocina durante 15 - 20 minutos hasta que se forme una rica salsa.\n5. Reduce el fuego, sazona al gusto con sal marina y pimienta, y adorna con cilantro fresco.\n6. Servir con arroz blanco."},{"cat":"lunch","name":"Pollo miel mostaza","ing":["Aceite de oliva","Pechuga de pollo","Mostaza","Miel","Arroz"],"sp":[],"txt":"1. En un sartén agregar el aceite de oliva\n2. Cuando el aceite esté caliente agregar la cebolla cortada en julianas\n3.Esperar a que la cebolla esté transparente y agregar el pollo\n4.Cocinar por ambos lados hasta que esté tierno y jugoso. Sal y pimienta al gusto\n5. Sacar del fuego.\n6. En un recipiente mezclar la miel y la mostaza\n7. Bañar el pollo con la salsa que hiciste\n8. Servir con arroz\nDisfrutar"},{"cat":"lunch","name":"Pollo miel mostaza con aguacate","ing":["Aceite de oliva","Cebolla","Pechuga de pollo","Mostaza","Miel","Arroz","Aguacate"],"sp":[],"txt":"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tEn una taza mezclar de forma homogénea la mostaza y la miel\n4.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz y aguacate"},{"cat":"lunch","name":"Pollo teriyaki","ing":["Ensalda","Lechuga","Tomate","Pepino","Zanahoria","Pollo teriyaki","Aceite de oliva","Pechuga de pollo","Salsa de soja","Miel"],"sp":[],"txt":"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tAgregar la salsa de soja y miel. Cocinar por unos cuantos minutos más y sacar del fuego\n4.\tServir el pollo junto con la ensalada\n5.\tDisfrutar"},{"cat":"lunch","name":"Tilapia con pico de gallo","ing":["Aguacate","Cebolla","Tomate","Zumo de limón","Tilapia","Papa sabanera"],"sp":["Cilantro"],"txt":"1.\tPicar la cebolla, el tomate y el aguacate en cubos pequeños.\n2.\tAgregar todo en un bowl y mezclar bien, agregar el jugo del limón, sal y pimienta al gusto.\n3.\tEn un sartén hacer tu filete hasta que este cocinado por ambos lados\n4.\tMientras tanto hacer tus papas hervidas hasta que estén suaves \n5.\tServir todo y disfrutar"},{"cat":"lunch","name":"Arroz frito con curry de pollo","ing":["Pechuga de pollo","Zanahoria","Salsa de soja","Aceite de oliva","Huevo entero","Pimentón rojo","Arroz","Aguacate"],"sp":[],"txt":"1. Hacer el arroz según las instrucciones del paquete.\n2. Pon en un wok (o sartén) antiadherente grande a fuego ALTO. Una vez caliente, rocíe un poco de aceite y agregar el pollo. Deja que se dore durante unos 4 o 5 minutos (sin tocarlo) y luego remueva y espolvoree el polvo de curry. Mezcle en el wok y continúe la cocción durante 2 minutos más. Retirar y reservar.\n3. Reduce el fuego de la sartén a medio (y asegúrate de que la sartén se ha enfriado, esto es importante), luego añada el aceite, las cebollas y el ajo. Ralla el jengibre fresco. Cocina durante 2 o 3 minutos para aromatizar el aceite, luego has un hueco en el sartén y añade el huevo. Revuelve rápidamente los huevos y pícalos continuamente.\n4. Aumenta el fuego a medio-alto o ALTO. Incorpora el arroz y mezcla bien. Espolvorea el resto del curry en polvo y dobla continuamente, asegurándote de que cada grano de arroz esté cubierto de curry. Añade la ralladura de lima para avivar los sabores y mezcla.\n5. Añade los pimientos y el pollo y sigue mezclando. Incorpora los guisantes y las zanahorias congeladas o frescas y mezcla todo. Retira el wok del fuego y añada las hojas de albahaca arrancadas (si tienes)\n6. Sazona al gusto con soja baja en sodio y zumo de limón fresco.\n7. Disfruta"},{"cat":"lunch","name":"Pasta con salsa de tomate y pollo","ing":["Pasta","Pechuga de pollo","Pasta de tomate","Aceite de oliva","Cebolla","Ajo"],"sp":[],"txt":"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla ya esté transparente agregar el pollo en cubos \n3)\tDorar por todos los lados el pollo \n4)\tAgregar la pasta de tomate \n5)\tHacer la pasta según indica el paquete\n6)\tCombinar la pasta junto con la salsa de tomate y el pollo\n7)\tDisfrutar"},{"cat":"lunch","name":"Salmón a la naranja y ensalada","ing":["Salmón","Zumo de naranja","Salsa de soja","Miel","Arroz","Ajo","Lechuga","Pepino","Maíz en lata","Aceite de oliva","Zumo de limón"],"sp":["Sal y pimienta"],"txt":"1.\tColocar el salmón en un sartén caliente\n2.\tDejar dorar por lado y lado por unos 10 minutos\n3.\tAgregar el sumo de una naranja, la salsa de soja, el ajo picado y la miel\n4.\tDejar por otros 10 minutos\n5.\tParalelamente hacer el arroz integral/ quinoa según indica el paquete\n6.\tHacer la ensalada\n7.\tEmplatar todo junto"},{"cat":"lunch","name":"Arroz con pollo","ing":["Arroz","Salsa de tomate","arverjas","Zanahoria","Aceite de oliva","Aguacate","Pechuga de pollo"],"sp":[],"txt":"1.\tPoner a hacer el arroz según las instrucciones del empaque\n2.\tEn un sartén aparte colocar el aceite y la pechuga\n3.\tCuando la pechuga esté lista agregar la zanahoria y la arveja\n4.\tDejar cocinar un rato y agregar el arroz\n5.\tCuando todo esta incorporado darle sabor con sal, pimienta y la salsa de tomate\n6.\tServir con aguacate"},{"cat":"lunch","name":"Salteado de garbanzos con pollo y verduras","ing":["Garbanzos de lata","Pechuga de pollo","Brocoli","Zucchini","Zanahoria","Cebolla","Ajo","Aceite de oliva"],"sp":["Sal","Pimienta"],"txt":"1)\tEmpezamos con el pollo. Lo cortamos en tiras (sin piel ni huesos) y lo ponemos con un diente de ajo picado y el aceite.\n2)\tPreparamos las verduras. La zanahoria la limpiamos, \"pelamos\" y cortamos en bastones finos, el brócoli lo separamos en arbolitos y el calabacín (Zucchini) lo limpiamos y cortamos con piel en dados, además la cebolla la pelamos y cortaremos en juliana.\n3)\tEn una sartén salteamos el pollo hasta dorarlo, lo reservamos. Añadimos en la misma sartén la cebolla, dos minutos después el resto de verduras y salteamos un par de minutos más\n4)\tAñadimos el pollo y los garbanzos y removemos, mezclando y salteando a la vez durante otros dos o tres minutos."},{"cat":"lunch","name":"Cheesburguer soup","ing":["Pasta de tomate","Pepinillos","Queso Mozarrella rallado","Cebolla","Queso crema","Crema de leche","Carne molida baja en grasa","Aceite de oliva"],"sp":[],"txt":"1)\tCortar la cebolla en cubos y sofreírla en un sartén\n2)\tAgregar la carne molida y la pasta de tomate (Puedes agregar un par de tomares en cubos si quieres para darle más consistencia)\n3)\tSal pimentar al gusto\n4)\tAgregar el resto de ingredientes\n5)\tServir y agregar el queso gratinado"},{"cat":"dinner","name":"Zucchini relleno","ing":["Atún en agua","Cebolla","Tomate","Zucchini","Aceite de oliva","Apio","Mozzarella","Papa Sabanera"],"sp":[],"txt":"1.\tLo primero que hay que hacer es cortar el zucchini por la mitad y vaciarlos con la ayuda de una cuchara. Después unta cada una de las mitades con un poco de aceite de oliva y hornéalas durante 15-20 minutos. Recuerda precalentar el horno previamente a 200º.\n2.\tCorta las papas en laminas y colócalas también en el horno junto al Zucchini\n3.\tMientras tanto, mezcla todos los ingredientes en un bowl grande: atún escurrido, un tallo de apio picado, media cebolla picada, dos cucharadas de zumo de limón y una de aceite de oliva, sal y pimientas al gusto.\n4.\tHecho esto rellena cada mitad de calabacín con la mezcla de atún y verduras, y cúbrelas con queso rallado.\n5.\tPara acabar, vuelve a hornear los calabacines durante 3-5 minutos hasta que el queso quede derretido. Sácalos del horno, emplata y ¡a comer!"},{"cat":"dinner","name":"Arepa con jamón","ing":["Arepa blanca","Jamón de pavo","Mantequilla","Mozzarella"],"sp":[],"txt":null},{"cat":"dinner","name":"Arepita con pollo BBq","ing":["Arepa blanca","Pechuga de pollo","Cebolla","Salsa bbq","Aguacate"],"sp":[],"txt":"1.\tColocar tu arepa en el sartén y esperar a que dore\n2.\tEn una olla agregar la pechuga de pollo, la cebolla y agua con sal\n3.\tHervir hasta que el pollo esté cocinado perfectamente\n4.\tSacar el pollo del agua y desmechar. Después mezclar con la salsa bbq\n5.\tColocar una capa de aguacate y encima el pollo bbq\n6.\tDisfrutar"},{"cat":"dinner","name":"Crema de espinaca con pollo","ing":["Papa sabanera","Pechuga de pollo","Espinaca","Aceite de oliva","Cebolla","Ajo"],"sp":[],"txt":"1.Lo primero que vamos a hacer es colocara hervir la pechuga de pollo en agua.\n2. Cuando esté completamente cocinada sacamos la pechuga y reservamos el consomé.\n3. En otra olla colocamos un poco de aceite de oliva, un diente de ajo y la cebolla.\n4. Cuando la cebolla esté transparente colocamos la espinaca y dejamos cocinar por unos segundos.\n5. Agregamos las papas y un poco del consomé que teníamos guardado.\n6. Cuando las papas estén blandas sacar del fuego.\n7. Agregar todo a la licuadora (no agregues todo el líquido de la olla de una vez sino que ve mirando poco a poco hasta tener la textura deseada)\n8. Servir con el pollo desmechado por encima."},{"cat":"dinner","name":"Hausi Abend","ing":["Rote Linsen","Zucchini","Feta light","Hackfleisch 5%"],"sp":[],"txt":null},{"cat":"dinner","name":"Pasta cremosa de pollo y broccoli","ing":["Pasta","Mantequilla","Harina","Ajo","Brocoli","Pechuga de pollo","Crema de leche","Leche baja en grasa"],"sp":[],"txt":"1.\tEn una olla grande con agua hirviendo con sal, cocina la pasta según las instrucciones del paquete; escurrir bien.\n2.\tDerrita la mantequilla en una sartén grande a fuego medio alto. Agregue el ajo, y cocine, revolviendo con frecuencia, hasta que estén fragantes, aproximadamente 2 minutos\n3.\tBatir la harina hasta que esté ligeramente dorada, aproximadamente 1 minuto. Agregue gradualmente la leche, y la crema de leche hasta que espese un poco, aproximadamente 3-4 minutos. Si la mezcla es demasiado espesa, agregue más leche según sea necesario; sazone con sal y pimienta, al gusto.\n4.\tAgregue la pasta, el brócoli y el pollo previamente cocinado hasta que estén bien combinados, unos 3-4 minutos.\n5.\tServir inmediatamente."},{"cat":"dinner","name":"Pizza casera","ing":["Wrap integral","Queso Mozarrella","Salsa de tomate","Pechuga de pollo","Piña"],"sp":[],"txt":"1.\tCoger la tortilla y agregar por encima la salsa de tomate, la pechuga de pollo previamente cocinada en agua, la piña y el queso\n2.\tMeter al horno hasta que el queso se derrita\n3.\tDisfrutar"},{"cat":"dinner","name":"Quinua cocida","ing":["Quinua","Aceite de oliva","Zanahoria","Judías verdes","Arverjas","Ajo","Salsa de soja","Huevo entero"],"sp":[],"txt":"1.\tEn una olla mediana hervir la quinoa y 2 tazas de agua. Reducir el fuego y hervir hasta que el agua sea totalmente absorbida, aproximadamente unos 15 a 20 minutos. \n2.\tSazonar con sal y remover con un tenedor para separar la quinoa. \n3.\tEn una sartén a fuego medio calentar el aceite de oliva. Agregar la cebolla, zanahoria y arvejas. Cocinar hasta que estén suaves. \n4.\tAgregar el ajo junto con la salsa de soya y cocinar por un par de minutos más. \n5.\tEn un bowl pequeño batir ligeramente el huevo y cocinarlos en una sartén que está previamente engrasada. \n6.\tFormar una tortilla, cocinando por ambos lados. Transferir a un plato y cortar cubitos.\n7.\tAgregar el huevo cocido a la mezcla de quinoa junto con la cebolla china. Servir."},{"cat":"dinner","name":"Salchi papas","ing":["Papa sabanera","Salchicha de pavo","Maíz en lata","Queso Mozarrella","Salsa de tomate","Mayonesa","Aceite de oliva"],"sp":[],"txt":"1.Cortar las papas en julianas.\n2. Agregar en un bowl sal, pimienta, páprika y aceite de oliva. Luego pasar todas tus papas por esta mezcla\n3.En una bandeja colocas papel refinado y pones tus papas previamente condimentadas.\n4.Hornear a 180 grados hasta que estén doradas y crujientes\n5.Picar las salchichas y agregar en un bowl junto con tus papas crocantes. Agregar maíz, queso y salsas"},{"cat":"dinner","name":"Sanduche de atún","ing":["Atún en agua","Cebolla","Mayonesa","Pan integral","Aguacate"],"sp":["Sal","Pimienta"],"txt":"1.En un bowl agregar el atún, la cebolla en cubos, la mayonesa, sal y pimienta.\n2. Mezclar muy bien,\n3.Armar tu sanduche.\n4.puedes agregar una rodaja de tomate si así lo deseas"},{"cat":"dinner","name":"Sanduchito bien jalado","ing":["Pan integral","Pechuga de pollo","Salsa bbq","Queso Mozarrella","Lechuga","Tomate","Mantequilla"],"sp":[],"txt":"1.\tColocar el pollo en una olla con agua a fuego medio.\n2.\tEsperar hasta que esté cocinado perfectamente y reservar\n3.\tCoger tu pan de molde, untar mantequilla a ambas partes, agregar la lechuga, tomate, salsa bbq y el pollo\n4.\tDisfrutar"},{"cat":"dinner","name":"Wrap mexicano","ing":["Wrap integral","Maíz en lata","Aguacate","Mozzarella","Frijoles en lata","Cebolla","Tomate"],"sp":[],"txt":"1. Usar una tortilla integral\n2. Agregar los fríjoles en lata, el maís, la cebolla, el tomate, el queso y el aguacate\n3. Decorar con salsa bbq\n4. Puedes comerlo caliente si así lo prefieres, para esto cerrar bien y llevarlo a una sartén.\nDisfrutar"},{"cat":"dinner","name":"Wrap mexicano con carne","ing":["Wrap integral","Frijoles en lata","Maíz en lata","Carne molida baja en grasa","Tomate","Cebolla","Aceite de oliva"],"sp":[],"txt":"1.\tColocas el aceite en un sartén junto con la cebolla\n2.\tCuando la cebolla esté transparente agregas la carne molida\n3.\tEsperas a que esté bien cocinada y la sacas del fuego\n4.\tArmar tu wrap con todos los ingredientes"},{"cat":"dinner","name":"Wrap bbq","ing":["Wrap integral","Pechuga de pollo","Salsa bbq","Cebolla","Aceite de oliva","Queso Mozarrella"],"sp":[],"txt":"1.\tColocas el aceite en un sartén junto con la cebolla y el pollo \n2.\tCuando el pollo esté en su punto agregas la salsa bbq\n3.\tSacas todo del sartén y lo colocas sobre el Wrap\n4.\tAgregar el queso\n5.\tDisfrutar"},{"cat":"dinner","name":"Rollitos de atún","ing":["Atún en agua","Zucchini","Aguacate","Mayonesa","Zumo de limón"],"sp":["Sal y pimienta"],"txt":"1)\tHacer tiras largas y finas con el zucchini\n2)\tColocar vinipel en la mesa para que sea más fácil hacer los rollos\n3)\tEn un bowl agregar el atún, la mayonesa y el aguacate machacado\n4)\tAgregar chorrito de limón, sal y pimienta al gusto\n5)\tColocar las tiras de zucchini en el vinipel una tras de otra hasta formar una fila\n6)\tAgregar la mezcla de atún sobre la capa de zucchini\n7)\tCon ayuda del vinipel empezar a enrollar \n8)\tDejar tu rollo de atún por 1h en la nevera\n9)\tSacar de la nevera y con un chuchillo cortar tus rollitos del grosor que desees\nTIP: no los hagas muy delgados para que no se te salga todo el relleno"},{"cat":"dinner","name":"Wrap de pollo","ing":["Wrap Integral","Pechuga de pollo","Cebolla","Aceite de oliva","Maíz en lata","Queso Mozarrella"],"sp":["Sal y pimienta"],"txt":"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla esté transparente agregar el pollo en cubitos \n3)\tDejar dorar el pollo por todos sus lados\n4)\tSacar del fuego y empezar a emplatar tu wrap\n5)\tCoger el wrap, agregar los fríjoles en lata, el maís, el pollo con la cebolla\n6)\tAgregar el queso \n7)\tDisfrutar"},{"cat":"dinner","name":"Crema de broccoli con pollo","ing":["Broccoli","Cebolla","Aceite de oliva","Zanahoria","Pechuga de pollo","Papa sabanera"],"sp":["Sal y pimienta"],"txt":"1.\tPones a hervir la pechuga de pollo \n2.\tEn una olla agregar el aceite y la cebolla\n3.\tCuando la cebolla se blanquea incorporas la zanahoria, la papa y el broccoli \n4.\tDejas cocinar hasta que el pollo esté en su punto, lo sacas del agua y lo empiezas a desmechar\n5.\tAgregas el caldo donde hiciste el pollo a las verduras (no todo para que no te quede tan líquido) (reserva para después por si te queda muy espesa la crema)\n6.\tLicuas, agrega sal y pimienta al gusto\n7.\tEmplatamos primero la crema y por encima el pollo desmechado (Puedes agregarle un chorrito de crema de leche…poquito)"},{"cat":"dinner","name":"Típico colombiano","ing":["Aguacate","Carne molida baja en grasa","Cebolla","Arroz","Frijoles en lata"],"sp":[],"txt":"1.\tAgregas la carne en un sartén antiadherente junto con la cebolla y los dejas cocinar\n2.\tHaces el arroz según las instrucciones del empaque\n3.\tEmplatamos el arroz, la carne, los frijoles en lata y el aguacate"},{"cat":"dinner","name":"Sanduchito bbq","ing":["Pan integral","Lechuga","Tomate","Queso Mozarrella","Jamon de pavo","Salsa bbq"],"sp":[],"txt":null},{"cat":"dinner","name":"Arepa reina pepiada","ing":["Queso Mozarrella","pechuga de pollo","cebolla","Mayonesa","Aguacate","Harina P.A.N","Mantequilla"],"sp":[],"txt":"1.\tPoner a hervir la pechuga hasta que este cocinada\n2.\tParalelamente ve haciendo las arepas\n3.\tColocar la harina en un bowl, junto con un poco del queso, sal y agua\n4.\tArmas las arepas\n5.\tEn un sartén colocas la mantequilla y pones a cocinar las arepas\n6.\tDesmechar la pechuga de pollo\n7.\tEn otro bowl mezclar el aguacate, la mayonesa, la cebolla, y la pechuga de pollo desmechada, salpimentar al gusto\n8.\tCuando las arepas estén doradas y listas partir por la mitad, rellenarlas y disfrutar 😊"},{"cat":"dinner","name":"Zucchini noodles con carne","ing":["Zucchini","Queso Parmesano","Carne molida baja en grasa","Pasta de tomate","Aceite de oliva"],"sp":[],"txt":"1)\tEn un sartén agregas el aceite de oliva y esperas hasta que se caliente\n2)\tAgregamos la carne molida baja en grasa, condimentar a tu gusto\n3)\tMientras la carne se hace hacer tiras con el Zucchini tipo pasta\n4)\tCuando la carne esté totalmente cocinada pero jugosa agregamos nuestros zoodles y esperamos a que saquen un poco de agua\n5)\tDejar pasar unos 10 minutos y agregar la pasta de tomate\n6)\tSacar del fuego, emplatar y decorar con el queso parmesano\n7)\tDisfrutar"},{"cat":"dinner","name":"Pollo Hawaiano","ing":["Pechuga de pollo","Aceite de oliva","Arroz","Piña"],"sp":[],"txt":"1)\tEn un sartén agregamos el aceite de oliva y lo dejamos calentar por unos minutos\n2)\tAgregamos nuestra pechuga de pollo\n3)\tDejamos dorar por AHn1BegvyBWf8ATNf9hn7EPyBWf9M1/wBhn7EAefUF6C/IFZ/0zX/YZ+xD8gVn/TNf9hn7EAefV6F/ybv9mrp/TR/dtSPyBWf9M1/2GfsW54B4LpuCqCpo6SrmqWzzdqXStaCDpAxt7kAahBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAAQQQQAEEEEABBBBAH//2Q=="},"supps":[{"ic":"💪","key":"kreatin","name":"Kreatin Monohydrat","tag":"top","dose":"3–5 g täglich, dauerhaft (kein Laden nötig)","why":"Am besten erforschtes Supplement überhaupt. Steigert Kraft, Trainingsleistung und Muskelaufbau messbar; unterstützt zusätzlich Regeneration und Gehirnfunktion. Tageszeit egal."},{"ic":"🥤","key":"protein","name":"Proteinpulver (Whey/vegan)","tag":"top","dose":"Nach Bedarf, um die tägliche Eiweißmenge zu erreichen (z.B. 25–30 g pro Shake)","why":"Kein Zaubermittel, sondern ein praktisches Lebensmittel: hilft, den Proteinbedarf (2–2,2 g/kg im Defizit) bequem zu decken. Wichtig für Muskelerhalt beim Abnehmen."},{"ic":"🐟","key":"omega3","name":"Omega-3 (EPA/DHA)","tag":"top","dose":"1–2 g EPA+DHA täglich (Fischöl oder veganes Algenöl)","why":"Die meisten nehmen zu wenig Omega-3. Wirkt entzündungshemmend, unterstützt Herz, Gehirn und Regeneration. Sinnvoll, wenn wenig fetter Seefisch gegessen wird."},{"ic":"☀️","key":"vitd","name":"Vitamin D3","tag":"top","dose":"1.000–2.000 IE täglich, v.a. Oktober–März (idealerweise nach Bluttest)","why":"Über die Ernährung kaum zu decken, im Winter bildet die Haut kaum welches. Wichtig für Knochen, Immunsystem und Hormonhaushalt (u.a. Testosteron)."},{"ic":"🧲","key":"magnesium","name":"Magnesium","tag":"situativ","dose":"200–250 mg täglich (z.B. abends), bei Bedarf","why":"Häufig knapp in der Ernährung. Unterstützt Muskel- und Nervenfunktion, Schlaf und Regeneration. Sinnvoll bei viel Sport oder Krämpfen. Obergrenze: EFSA/SCF nennen 250 mg pro Tag ZUSÄTZLICH aus Supplementen (Magnesium aus Lebensmitteln zählt nicht mit) – mehr wirkt abführend."},{"ic":"☕","key":"koffein","name":"Koffein","tag":"situativ","dose":"3 mg pro kg Körpergewicht, max. 200 mg pro Einzeldosis, ~30–60 Min vor dem Training","why":"Stärkstes legales Trainings-Boostersupplement: mehr Fokus, Kraft und Ausdauer, dämpft den Appetit. EFSA-Richtwerte: bis 200 mg pro Einzeldosis und bis 400 mg pro Tag gelten für gesunde Erwachsene als unbedenklich. Nicht zu spät am Tag (Schlaf!)."}],"articles":[{"ic":"🔥","key":"pyramide","title":"Fettverlust-Pyramide & Energiebilanz","points":["Nicht alles ist gleich wichtig. Die Reihenfolge der Hebel: 1. Energiebilanz, 2. Proteinzufuhr, 3. der Rest (KH/Fett-Verhältnis, Timing …).","Energiebilanz = aufgenommene Kalorien gegen verbrauchte Kalorien. Defizit → Fett runter, Überschuss → Aufbau. Das ist der mit Abstand größte Hebel.","Der Gesamtverbrauch (TDEE) besteht aus: Grundumsatz (~60 %), Alltagsbewegung/NEAT, Sport und der thermischen Wirkung der Nahrung (TEF).","„You can't outrun a bad diet.“ Sport verbrennt weniger als die meisten denken – die Ernährung entscheidet.","Bestes Defizit: ca. 300–500 kcal bzw. 15–25 % unter dem Verbrauch. Über dem Grundumsatz, unter dem Leistungsumsatz – das „goldene Fenster“.","Zu aggressiv abnehmen führt zu Heißhunger, Muskelabbau, Müdigkeit und schwächerem Immunsystem.","Studien zeigen: Menschen unterschätzen ihre Kalorienaufnahme im Schnitt um ~47 %. Ehrliches Tracking schlägt Bauchgefühl."]},{"ic":"🍗","key":"protein","title":"Warum Protein so wichtig ist","points":["Protein ist der zweitwichtigste Hebel nach der Energiebilanz – gerade im Defizit schützt es die Muskulatur.","Richtwert: ca. 1,6–2,2 g pro kg Körpergewicht; im Kaloriendefizit eher am oberen Ende (2–2,4 g/kg).","Proteinqualität zählt: tierische Quellen (Fleisch, Fisch, Ei, Milch) sind besser verwertbar als pflanzliche. Ausnahme: gutes Sojaprotein.","Vegan? Quellen kombinieren (Getreide + Hülsenfrüchte) und ~20 % mehr Protein einplanen, um Mängel auszugleichen.","Protein sättigt am stärksten und hat die höchste thermische Wirkung (20–30 % der Energie verpuffen bei der Verdauung) – doppelt hilfreich beim Abnehmen.","1 g Protein liefert ~4,1 kcal."]},{"ic":"🥑","key":"fettkh","title":"Fette & Kohlenhydrate flexibel einsetzen","points":["Nachdem Kalorien und Protein stehen, teilst du den Rest auf Fett und Kohlenhydrate auf.","Fett-Minimum für den Hormonhaushalt: etwa Körpergröße in cm ÷ 3 = Gramm Fett/Tag (bei 180 cm ≈ 60 g). Diesen Wert nicht dauerhaft unterschreiten.","Angestrebte Fettzufuhr: ~25–35 % der Gesamtkalorien. 1 g Fett = 9,1 kcal.","Kohlenhydrate füllen den Rest der Kalorien. Sie sind die bevorzugte Energiequelle fürs Krafttraining und fördern so indirekt den Muskelaufbau. 1 g KH = 4,1 kcal.","Das genaue KH-zu-Fett-Verhältnis ist – solange Minimums erfüllt sind – zweitrangig. Nimm, was dir schmeckt und satt macht."]},{"ic":"🍽️","key":"mahlzeiten","title":"Mahlzeitenfrequenz & Lebensmittelwahl","points":["Wie viele Mahlzeiten pro Tag ist Geschmackssache – 3 bis 5 funktionieren alle. Entscheidend ist die Tagesbilanz, nicht die Verteilung.","Wähle die Frequenz, mit der du am besten satt bleibst und deinen Plan durchhältst.","80/20-Regel: ~80 % nährstoffreiche, sättigende Lebensmittel (Eiweißquellen, Gemüse, Obst, Vollkorn), ~20 % Genuss – so bleibt der Plan langfristig durchhaltbar.","Iss überwiegend Dinge, die dir schmecken. Ein perfekter Plan, den du hasst, funktioniert nicht.","Ballaststoffe (Gemüse, Obst, Vollkorn, Hülsenfrüchte) sättigen, fördern die Verdauung – Richtwert ~30 g/Tag."]},{"ic":"🏋️","key":"training","title":"Trainingsprinzipien fürs Krafttraining","points":["Krafttraining ist im Defizit der Reiz, der der Muskulatur sagt: „werde behalten“. Ohne ihn verlierst du mit dem Fett auch Muskeln.","Progressive Überlastung ist der Schlüssel: mit der Zeit mehr Gewicht, mehr Wiederholungen oder mehr Sätze – kleine, stetige Steigerungen. (Genau dafür trackt die App deine Werte.)","Trainiere nah ans Muskelversagen (RPE 8–10, also 0–2 Wiederholungen „im Tank“) für einen ausreichenden Reiz.","Technik vor Ego: saubere, kontrollierte Ausführung über den vollen Bewegungsumfang schlägt schwereres Gewicht mit Schwung.","Kurz aufwärmen: 5–10 Min lockeres Warmmachen + ein paar Aufwärmsätze mit leichterem Gewicht senken das Verletzungsrisiko.","Regeneration ist Teil des Trainings: Muskeln wachsen in der Pause. Genug Schlaf und Proteinzufuhr sind Pflicht."]},{"ic":"🏃","key":"cardio","title":"Cardio richtig einsetzen","points":["Cardio ist ein Werkzeug, um den Verbrauch zu erhöhen – kein Muss für Fettverlust. Das Defizit entsteht in erster Linie über die Ernährung.","Alltagsbewegung (NEAT: Schritte, Treppen, Spazieren) bringt oft mehr als eine einzelne Cardio-Einheit und ist leichter durchzuhalten.","Richtwert: 8.000–10.000 Schritte/Tag sind ein starker, unterschätzter Hebel.","Wenn Cardio, dann so dosiert, dass es die Regeneration fürs Krafttraining nicht auffrisst. Lockeres Ausdauertraining (Zone 2) ist gelenkschonend.","Kraft geht vor Cardio: Priorität hat der Muskelerhalt. Cardio ergänzt, ersetzt aber nie das Krafttraining."]}],"microDB":{"Hähnchenbrust":{"mg":28,"zn":0.68,"fe":0.37,"ca":5,"k2":334,"vd":0.1,"b12":0.21,"o3":20,"iod":3.0,"sel":15.0,"fol":5.0,"vita":9.0,"b1":0.09,"cu":0.05,"vitc":0.0,"vitk":2.0,"ala":20.0},"Putenbrust":{"mg":28,"zn":1.2,"fe":0.7,"ca":6,"k2":293,"vd":0.1,"b12":0.6,"o3":10,"iod":3.0,"sel":20.0,"fol":8.0,"vita":5.0,"b1":0.06,"cu":0.04,"vitc":0.0,"vitk":1.0,"ala":15.0},"Mageres Rind":{"mg":22,"zn":4.0,"fe":2.2,"ca":6,"k2":330,"vd":0.1,"b12":2.2,"o3":10,"iod":3.0,"sel":12.0,"fol":8.0,"vita":3.0,"b1":0.09,"cu":0.09,"vitc":0.0,"vitk":1.5,"ala":25.0},"Kabeljau/Seelachs":{"mg":30,"zn":0.45,"fe":0.4,"ca":15,"k2":400,"vd":1.0,"b12":2.0,"o3":250,"iod":170.0,"sel":30.0,"fol":8.0,"vita":10.0,"b1":0.07,"cu":0.03,"vitc":1.0,"vitk":0.1,"ala":5.0},"Lachs":{"mg":27,"zn":0.36,"fe":0.34,"ca":9,"k2":363,"vd":9.0,"b12":3.2,"o3":2000,"iod":34.0,"sel":25.0,"fol":26.0,"vita":13. agregar un par de tomares en cubos si quieres para darle más consistencia)\n3)\tSal pimentar al gusto\n4)\tAgregar el resto de ingredientes\n5)\tServir y agregar el queso gratinado"},"1)\tCortar la cebolla y el tomate en cuadrados pequeños\n2)\tEn un sartén pones a derretir la mantequilla\n3)\tCuando la mantequilla ya esté caliente agregas la cebolla y el tomate\n4)\tMientras la cebolla se pone transparente y el tomate saca sus jugos pon el pan a tostar\n5)\tAgregar el huevo al fuego, dejas que se cocine \n6)\tCoges el aguacate y haces una crema suave para poner sobre el pan previamente tostado\n7)\tCuando el huevo esté en el punto que te guste, sácalo del fuego \n8)\tEmplatamos: Coges el plan, lo untamos de la crema de aguacate, agregas el huevo perico\n9)\tDisfruta":{"de":"1)\tDie Zwiebel und die Tomate in kleine Würfel schneiden\n2)\tIn einer Pfanne die Butter schmelzen\n3)\tWenn die Butter heiß ist, die Zwiebel und die Tomate hinzufügen\n4)\tWährend die Zwiebel glasig wird und die Tomate ihren Saft abgibt, das Brot toasten\n5)\tDas Ei in die Pfanne geben und garen lassen \n6)\tDie Avocado nehmen und eine geschmeidige Creme zum Bestreichen des zuvor gerösteten Brotes zubereiten\n7)\tWenn das Ei den gewünschten Punkt erreicht hat, von der Hitze nehmen \n8)\tAnrichten: das Brot nehmen, mit der Avocadocreme bestreichen, das Rührei darauf geben\n9)\tGenießen","en":"1)\tCut the onion and the tomato into small squares\n2)\tIn a pan, melt the butter\n3)\tWhen the butter is hot, add the onion and the tomato\n4)\tWhile the onion turns translucent and the tomato releases its juices, put the bread to toast\n5)\tAdd the egg to the heat and let it cook \n6)\tTake the avocado and make a smooth cream to spread over the previously toasted bread\n7)\tWhen the egg is at the point you like, take it off the heat \n8)\tPlate up: take the bread, spread it with the avocado cream, add the scrambled egg\n9)\tEnjoy","es":"1)\tCortar la cebolla y el tomate en cuadrados pequeños\n2)\tEn un  chopped garlic clove and the oil.\n2)\tPrepare the vegetables. Clean, \"peel\" and cut the carrot into thin sticks, separate the broccoli into little florets and clean the zucchini and cut it with the skin into cubes; also peel the onion and cut it into julienne.\n3)\tIn a pan, sauté the chicken until golden, then set it aside. Add the onion to the same pan, two minutes later add the rest of the vegetables and sauté for a couple more minutes\n4)\tAdd the chicken and the chickpeas and stir, mixing and sautéing at the same time for another two or three minutes.","es":"1)\tEmpezamos con el pollo. Lo cortamos en tiras (sin piel ni huesos) y lo ponemos con un diente de ajo picado y el aceite.\n2)\tPreparamos las verduras. La zanahoria la limpiamos, \"pelamos\" y cortamos en bastones finos, el brócoli lo separamos en arbolitos y el calabacín (Zucchini) lo limpiamos y cortamos con piel en dados, además la cebolla la pelamos y cortaremos en juliana.\n3)\tEn una sartén salteamos el pollo hasta dorarlo, lo reservamos. Añadimos en la misma sartén la cebolla, dos minutos después el resto de verduras y salteamos un par de minutos más\n4)\tAñadimos el pollo y los garbanzos y removemos, mezclando y salteando a la vez durante otros dos o tres minutos."},"1)\tEn un sartén agregamos el aceite de oliva y lo dejamos calentar por unos minutos\n2)\tAgregamos nuestra pechuga de pollo\n3)\tDejamos dorar por lado y lado\n4)\tMientras nuestra pechuga de pollo se hace cortar la piña en rebanadas y poner igualmente en el sartén hasta que se dore y saque sus jugos \n5)\tEmplatamos y acompañamos nuestra deliciosa pechuga con arroz.":{"de":"1)\tIn eine Pfanne das Olivenöl geben und einige Minuten erhitzen lassen\n2)\tUnsere Hähnchenbrust hinzufügen\n3)\tVon beiden Seiten anbraten lassen\n4)\tWährend die Hähnchenbrust gart, die Ananas in Scheiben schneiden und ebenfalls in die Pfanne geben, bis sie bräunt und ihren Saft abgibt \n5)\tAnrichten und unsere köstliche Brust mit Reis servieren.","en":"1)\tIn a pan, add the olive oil and let it heat for a few minutes\n2)\tAdd our chicken breast\n3)\tLet it brown on both sides\n4)\tWhile our chicken breast is cooking, cut the pineapple into slices and put it likewise in the pan until it browns and releases its juices \n5)\tPlate up and serve our delicious breast with rice.","es":"1)\tEn un sartén agregamos el aceite de oliva y lo dejamos calentar por unos minutos\n2)\tAgregamos nuestra pechuga de pollo\n3)\tDejamos dorar por lado y lado\n4)\tMientras nuestra pechuga de pollo se hace cortar la piña en rebanadas y poner igualmente en el sartén hasta que se dore y saque sus jugos \n5)\tEmplatamos y acompañamos nuestra deliciosa pechuga con arroz."},"1)\tEn un sartén agregas el aceite de oliva y esperas hasta que se caliente\n2)\tAgregamos la carne molida baja en grasa, condimentar a tu gusto\n3)\tMientras la carne se hace hacer tiras con el Zucchini tipo pasta\n4)\tCuando la carne esté totalmente cocinada pero jugosa agregamos nuestros zoodles y esperamos a que saquen un poco de agua\n5)\tDejar pasar unos 10 minutos y agregar la pasta de tomate\n6)\tSacar del fuego, emplatar y decorar con el queso parmesano\n7)\tDisfrutar":{"de":"1)\tIn eine Pfanne das Olivenöl geben und warten, bis es heiß ist\n2)\tDas fettarme Hackfleisch hinzufügen und nach Geschmack würzen\n3)\tWährend das Fleisch gart, aus der Zucchini nudelartige Streifen schneiden\n4)\tWenn das Fleisch ganz durch, aber saftig ist, unsere Zoodles hinzufügen und warten, bis sie etwas Wasser abgeben\n5)\tEtwa 10 Minuten vergehen lassen und das Tomatenmark hinzufügen\n6)\tVon der Hitze nehmen, anrichten und mit dem Parmesan garnieren\n7)\tGenießen","en":"1)\tIn a pan, add the olive oil and wait until it is hot\n2)\tAdd the low-fat ground beef and season to taste\n3)\tWhile the meat cooks, make pasta-like strips with the zucchini\n4)\tWhen the meat is fully cooked but juicy, add our zoodles and wait for them to release a little water\n5)\tLet about 10 minutes pass and add the tomato paste\n6)\tTake off the heat, plate up and decorate with the parmesan cheese\n7)\tEnjoy","es":"1)\tEn un sartén agregas el aceite de oliva y esperas hasta que se caliente\n2)\tAgregamos la carne molida baja en grasa, condimentar a tu gusto\n3)\tMientras la carne se hace hacer tiras con el Zucchini tipo pasta\n4)\tCuando la carne esté totalmente cocinada pero jugosa agregamos nuestros zoodles y esperamos a que saquen un poco de agua\n5)\tDejar pasar unos 10 minutos y agregar la pasta de tomate\n6)\tSacar del fuego, emplatar y decorar con el queso parmesano\n7)\tDisfrutar"},"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla esté transparente agregar el pollo en cubitos \n3)\tDejar dorar el pollo por todos sus lados\n4)\tSacar del fuego y empezar a emplatar tu wrap\n5)\tCoger el wrap, agregar los fríjoles en lata, el maís, el pollo con la cebolla\n6)\tAgregar el queso \n7)\tDisfrutar":{"de":"1)\tIn eine heiße Pfanne das Olivenöl und die Zwiebel geben\n2)\tWenn die Zwiebel glasig ist, das gewürfelte Hähnchen hinzufügen \n3)\tDas Hähnchen von allen Seiten anbraten lassen\n4)\tVon der Hitze nehmen und deinen Wrap anrichten\n5)\tDen Wrap nehmen, die Bohnen aus der Dose, den Mais, das Hähnchen mit der Zwiebel hinzufügen\n6)\tDen Käse hinzufügen \n7)\tGenießen","en":"1)\tIn a hot pan, add the olive oil and the onion\n2)\tWhen the onion is translucent, add the diced chicken \n3)\tLet the chicken brown on all sides\n4)\tTake off the heat and start plating your wrap\n5)\tTake the wrap, add the canned beans, the corn, the chicken with the onion\n6)\tAdd the cheese \n7)\tEnjoy","es":"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla esté transparente agregar el pollo en cubitos \n3)\tDejar dorar el pollo por todos sus lados\n4)\tSacar del fuego y empezar a emplatar tu wrap\n5)\tCoger el wrap, agregar los fríjoles en lata, el maís, el pollo con la cebolla\n6)\tAgregar el queso \n7)\tDisfrutar"},"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla ya esté transparente agregar el pollo en cubos \n3)\tDorar por todos los lados el pollo \n4)\tAgregar la pasta de tomate \n5)\tHacer la pasta según indica el paquete\n6)\tCombinar la pasta junto con la salsa de tomate y el pollo\n7)\tDisfrutar":{"de":"1)\tIn eine heiße Pfanne das Olivenöl und die Zwiebel geben\n2)\tWenn die Zwiebel bereits glasig ist, das gewürfelte Hähnchen hinzufügen \n3)\tDas Hähnchen von allen Seiten anbraten \n4)\tDas Tomatenmark hinzufügen \n5)\tDie Pasta nach Packungsanweisung kochen\n6)\tDie Pasta mit der Tomatensauce und dem Hähnchen vermengen\n7)\tGenießen","en":"1)\tIn a hot pan, add the olive oil and the onion\n2)\tWhen the onion is already translucent, add the diced chicken \n3)\tBrown the chicken on all sides \n4)\tAdd the tomato paste \n5)\tCook the pasta as the package indicates\n6)\tCombine the pasta with the tomato sauce and the chicken\n7)\tEnjoy","es":"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla ya esté transparente agregar el pollo en cubos \n3)\tDorar por todos los lados el pollo \n4)\tAgregar la pasta de tomate \n5)\tHacer la pasta según indica el paquete\n6)\tCombinar la pasta junto con la salsa de tomate y el pollo\n7)\tDisfrutar"},"1)\tHacer tiras largas y finas con el zucchini\n2)\tColocar vinipel en la mesa para que sea más fácil hacer los rollos\n3)\tEn un bowl agregar el atún, la mayonesa y el aguacate machacado\n4)\tAgregar chorrito de limón, sal y pimienta al gusto\n5)\tColocar las tiras de zucchini en el vinipel una tras de otra hasta formar una fila\n6)\tAgregar la mezcla de atún sobre la capa de zucchini\n7)\tCon ayuda del vinipel empezar a enrollar \n8)\tDejar tu rollo de atún por 1h en la nevera\n9)\tSacar de la nevera y con un chuchillo cortar tus rollitos del grosor que desees\nTIP: no los hagas muy delgados para que no se te salga todo el relleno":{"de":"1)\tAus der Zucchini lange, dünne Streifen schneiden\n2)\tFrischhaltefolie auf den Tisch legen, damit sich die Röllchen leichter formen lassen\n3)\tIn eine Schüssel den Thunfisch, die Mayonnaise und die zerdrückte Avocado geben\n4)\tEinen Spritzer Zitrone, Salz und Pfeffer nach Geschmack hinzufügen\n5)\tDie Zucchinistreifen einen nach dem anderen auf die Folie legen, bis eine Reihe entsteht\n6)\tDie Thunfischmischung auf die Zucchinischicht geben\n7)\tMithilfe der Folie aufrollen \n8)\tDeine Thunfischrolle 1 Std. in den Kühlschrank legen\n9)\tAus dem Kühlschrank nehmen und mit einem Messer deine Röllchen in der gewünschten Dicke schneiden\nTIP: mache sie nicht zu dünn, damit die Füllung nicht herausfällt","en":"1)\tMake long, thin strips with the zucchini\n2)\tPlace plastic wrap on the table to make it easier to form the rolls\n3)\tIn a bowl, add the tuna, the mayonnaise and the mashed avocado\n4)\tAdd a splash of lemon, salt and pepper to taste\n5)\tPlace the zucchini strips on the plastic wrap one after another until they form a row\n6)\tAdd the tuna mixture over the zucchini layer\n7)\tUsing the plastic wrap, start rolling \n8)\tLeave your tuna roll in the fridge for 1h\n9)\tTake it out of the fridge and, with a knife, cut your little rolls to the thickness you want\nTIP: don't make them too thin so the filling doesn't all fall out","es":"1)\tHacer tiras largas y finas con el zucchini\n2)\tColocar vinipel en la mesa para que sea más fácil hacer los rollos\n3)\tEn un bowl agregar el atún, la mayonesa y el aguacate machacado\n4)\tAgregar chorrito de limón, sal y pimienta al gusto\n5)\tColocar las tiras de zucchini en el vinipel una tras de otra hasta formar una fila\n6)\tAgregar la mezcla de atún sobre la capa de zucchini\n7)\tCon ayuda del vinipel empezar a enrollar \n8)\tDejar tu rollo de atún por 1h en la nevera\n9)\tSacar de la nevera y con un chuchillo cortar tus rollitos del grosor que desees\nTIP: no los hagas muy delgados para que no se te salga todo el relleno"},"1.\tAgregas la carne en un sartén antiadherente junto con la cebolla y los dejas cocinar\n2.\tHaces el arroz según las instrucciones del empaque\n3.\tEmplatamos el arroz, la carne, los frijoles en lata y el aguacate":{"de":"1.\tDas Fleisch zusammen mit der Zwiebel in eine beschichtete Pfanne geben und garen lassen\n2.\tDen Reis nach Packungsanweisung kochen\n3.\tDen Reis, das Fleisch, die Bohnen aus der Dose und die Avocado anrichten","en":"1.\tAdd the meat to a non-stick pan together with the onion and let them cook\n2.\tCook the rice according to the package instructions\n3.\tPlate up the rice, the meat, the canned beans and the avocado","es":"1.\tAgregas la carne en un sartén antiadherente junto con la cebolla y los dejas cocinar\n2.\tHaces el arroz según las instrucciones del empaque\n3.\tEmplatamos el arroz, la carne, los frijoles en lata y el aguacate"},"1.\tAjuste el horno a 350°F / 180°C / Gas 4.\n2.\tMezcla las mitades de tomate en aceite de oliva y condimento. Transfiere a una bandeja para hornear en una capa uniforme y hornea durante 20-25 minutos, hasta que esté suave y fragante.\n3.\tMientras tanto, hierve agua en una olla, agrega suavemente los huevos y cocina durante 6 minutos para obtener huevos cocidos blandos. Retira y sumerge en agua helada para evitar que se cocinen más. Luego pelar.\n4.\tTostar el pan integral. Cubre con aguacate, jugosos tomates asados, huevos duros y una pizca generosa de sal y pimienta.\n5.\tPara preparar la comida, recomiendo calentar los tomates y tostar el pan justo antes de armarlo. Dependiendo de cuánto tiempo tengas en las mañanas, incluso puedes hervir los huevos con anticipación y guardarlos en el refrigerador.":{"de":"1.\tDen Ofen auf 350°F / 180°C / Gas 4 einstellen.\n2.\tDie Tomatenhälften mit Olivenöl und Gewürz vermengen. In einer gleichmäßigen Schicht auf ein Backblech geben und 20-25 Minuten backen, bis sie weich und aromatisch sind.\n3.\tIn der Zwischenzeit Wasser in einem Topf zum Kochen bringen, die Eier vorsichtig hineingeben und 6 Minuten für weich gekochte Eier garen. Herausnehmen und in Eiswasser tauchen, damit sie nicht weitergaren. Anschließend schälen.\n4.\tDas Vollkornbrot toasten. Mit Avocado, saftigen gerösteten Tomaten, gekochten Eiern und einer großzügigen Prise Salz und Pfeffer belegen.\n5.\tZum Vorbereiten empfehle ich, die Tomaten aufzuwärmen und das Brot erst kurz vor dem Zusammenstellen zu toasten. Je nachdem, wie viel Zeit du morgens hast, kannst du die Eier sogar im Voraus kochen und im Kühlschrank aufbewahren.","en":"1.\tSet the oven to 350°F / 180°C / Gas 4.\n2.\tToss the tomato halves in olive oil and seasoning. Transfer to a baking tray in an even layer and bake for 20-25 minutes, until soft and fragrant.\n3.\tMeanwhile, boil water in a pot, gently add the eggs and cook for 6 minutes for soft-boiled eggs. Remove and plunge into iced water to stop them from cooking further. Then peel.\n4.\tToast the whole-grain bread. Top with avocado, juicy roasted tomatoes, boiled eggs and a generous pinch of salt and pepper.\n5.\tTo meal prep, I recommend heating the tomatoes and toasting the bread just before assembling. Depending on how much time you have in the mornings, you can even boil the eggs ahead of time and keep them in the refrigerator.","es":"1.\tAjuste el horno a 350°F / 180°C / Gas 4.\n2.\tMezcla las mitades de tomate en aceite de oliva y condimento. Transfiere a una bandeja para hornear en una capa uniforme y hornea durante 20-25 minutos, hasta que esté suave y fragante.\n3.\tMientras tanto, hierve agua en una olla, agrega suavemente los huevos y cocina durante 6 minutos para obtener huevos cocidos blandos. Retira y sumerge en agua helada para evitar que se cocinen más. Luego pelar.\n4.\tTostar el pan integral. Cubre con aguacate, jugosos tomates asados, huevos duros y una pizca generosa de sal y pimienta.\n5.\tPara preparar la comida, recomiendo calentar los tomates y tostar el pan justo antes de armarlo. Dependiendo de cuánto tiempo tengas en las mañanas, incluso puedes hervir los huevos con anticipación y guardarlos en el refrigerador."},"1.\tBatir la mitad del banano junto con el yogurt y verter la mezcla en un bowl.\n2.\tCortar la otra mitad en rodajas y repartirlo al gusto en el bowl.\n3.\tAñadimos las semillas, las almendras y el chocolate\n4.\tDisfrutar":{"de":"1.\tDie Hälfte der Banane zusammen mit dem Joghurt pürieren und die Mischung in eine Schüssel gießen.\n2.\tDie andere Hälfte in Scheiben schneiden und nach Belieben in der Schüssel verteilen.\n3.\tDie Samen, die Mandeln und die Schokolade hinzufügen\n4.\tGenießen","en":"1.\tBlend half the banana together with the yogurt and pour the mixture into a bowl.\n2.\tCut the other half into slices and spread it in the bowl as you like.\n3.\tAdd the seeds, the almonds and the chocolate\n4.\tEnjoy","es":"1.\tBatir la mitad del banano junto con el yogurt y verter la mezcla en un bowl.\n2.\tCortar la otra mitad en rodajas y repartirlo al gusto en el bowl.\n3.\tAñadimos las semillas, las almendras y el chocolate\n4.\tDisfrutar"},"1.\tCoger la tortilla y agregar por encima la salsa de tomate, la pechuga de pollo previamente cocinada en agua, la piña y el queso\n2.\tMeter al horno hasta que el queso se derrita\n3.\tDisfrutar":{"de":"1.\tDie Tortilla nehmen und darauf die Tomatensauce, die zuvor in Wasser gegarte Hähnchenbrust, die Ananas und den Käse geben\n2.\tIn den Ofen geben, bis der Käse schmilzt\n3.\tGenießen","en":"1.\tTake the tortilla and add on top the tomato sauce, the chicken breast previously cooked in water, the pineapple and the cheese\n2.\tPut it in the oven until the cheese melts\n3.\tEnjoy","es":"1.\tCoger la tortilla y agregar por encima la salsa de tomate, la pechuga de pollo previamente cocinada en agua, la piña y el queso\n2.\tMeter al horno hasta que el queso se derrita\n3.\tDisfrutar"},"1.\tColocar el pollo en una olla con agua a fuego medio.\n2.\tEsperar hasta que esté cocinado perfectamente y reservar\n3.\tCoger tu pan de molde, untar ma
