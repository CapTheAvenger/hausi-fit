<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hausi Fit</title>
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface2:#f0efec;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-ink:#fff; --good:#006300; --bad:#d03b3b;
  --s2:#eb6834; --s3:#1baf7a;
  --chip:#f0efec; --shadow:0 1px 3px rgba(0,0,0,.06);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#242422;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-ink:#fff; --good:#0ca30c; --bad:#e66767;
  --s2:#d95926; --s3:#199e70;
  --chip:#242422; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface2:#242422;
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-ink:#fff; --good:#0ca30c; --bad:#e66767;
    --s2:#d95926; --s3:#199e70;
    --chip:#242422; --shadow:none;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
header.app{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
header.app h1{font-size:20px; margin:0; letter-spacing:-.3px}
header.app .hsub{font-size:12px;color:var(--muted)}
.hbtns{display:flex;gap:8px}
.hbtn{border:1px solid var(--border); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:6px 10px; font-size:14px; cursor:pointer}
main{padding:12px 14px 24px; max-width:640px; margin:0 auto}
.view{display:none}
.view.active{display:block}
h2{font-size:17px;margin:18px 2px 10px}
h3{font-size:15px;margin:14px 2px 8px}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
}
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:999px; font-size:14px;
  background:var(--chip); color:var(--ink2); border:1px solid var(--border); cursor:pointer;
  white-space:nowrap;
}
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.excard{padding:12px 14px}
.exhead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.expat{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:2px}
.exname{font-size:16px; font-weight:650; color:var(--ink); border:none; background:none;
  padding:0; text-align:left; cursor:pointer; font-family:inherit; line-height:1.3}
.exname .sw{color:var(--accent); font-size:13px; font-weight:500}
.extarget{font-size:12px; color:var(--muted); margin-top:2px}
.exlast{font-size:12px; color:var(--ink2); margin-top:2px}
.exrow{display:flex; gap:8px; margin-top:10px; align-items:flex-end}
.fld{flex:1; min-width:0}
.fld label{display:block; font-size:11px; color:var(--muted); margin-bottom:3px}
.numwrap{display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden}
.numwrap input{width:100%; border:none; background:transparent; color:var(--ink); font-size:16px;
  padding:9px 2px; text-align:center; font-family:inherit; min-width:0}
.numwrap input:focus{outline:none}
.stepbtn{border:none; background:transparent; color:var(--accent); font-size:18px; font-weight:700;
  padding:8px 10px; cursor:pointer; flex:0 0 auto}
input[type=number],input[type=text],input[type=date],select{
  width:100%; border:1px solid var(--border); border-radius:10px; background:var(--surface2);
  color:var(--ink); font-size:16px; padding:9px 10px; font-family:inherit;
}
.btn{
  border:none; border-radius:12px; padding:11px 16px; font-size:15px; font-weight:600;
  background:var(--accent); color:var(--accent-ink); cursor:pointer; font-family:inherit;
}
.btn.sec{background:var(--surface2); color:var(--ink); border:1px solid var(--border)}
.btn.small{padding:8px 12px; font-size:13px; border-radius:10px}
.btn:active{transform:scale(.98)}
.savebtn{flex:0 0 auto}
.histwrap{margin-top:8px; font-size:12px; color:var(--ink2)}
.histchip{display:inline-block; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:3px 8px; margin:2px 4px 2px 0}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px}
.tile .tv{font-size:22px; font-weight:700; letter-spacing:-.3px}
.tile .tl{font-size:12px; color:var(--muted); margin-top:2px}
.tile .tu{font-size:13px; color:var(--ink2); font-weight:500}
.tile.big{grid-column:1/-1}
.tile.hl{border-color:var(--accent)}
table.mini{width:100%; border-collapse:collapse; font-size:14px}
table.mini th{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
  text-align:left; padding:6px 6px; border-bottom:1px solid var(--grid); font-weight:600}
table.mini td{padding:7px 6px; border-bottom:1px solid var(--grid)}
table.mini tr:last-child td{border-bottom:none}
table.mini td.num, table.mini th.num{text-align:right; font-variant-numeric:tabular-nums}
.rowflex{display:flex; gap:10px}
.rowflex>*{flex:1}
.subtabs{display:flex; gap:6px; background:var(--surface2); border-radius:12px; padding:4px; margin-bottom:12px}
.subtab{flex:1; text-align:center; padding:8px 4px; border-radius:9px; font-size:13px;
  color:var(--ink2); cursor:pointer; border:none; background:transparent; font-family:inherit; white-space:nowrap}
.subtab.on{background:var(--surface); color:var(--ink); font-weight:650; box-shadow:var(--shadow); border:1px solid var(--border)}
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabbar button{
  flex:1; border:none; background:none; color:var(--muted); font-size:10.5px;
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  padding:4px 0; font-family:inherit;
}
nav.tabbar button.on{color:var(--accent); font-weight:650}
nav.tabbar .ico{font-size:21px; line-height:1}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none}
.modal-bg.open{display:block}
.modal{
  position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:82vh; overflow:auto;
  background:var(--surface); border-radius:20px 20px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  display:none; max-width:640px; margin:0 auto;
}
.modal.open{display:block}
.modal h3{margin-top:2px}
.pickitem{display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:11px 8px; border-bottom:1px solid var(--grid); cursor:pointer; border-radius:8px}
.pickitem:active{background:var(--surface2)}
.pickitem.on{color:var(--accent); font-weight:650}
.pickitem .pw{font-size:12px; color:var(--muted); flex:0 0 auto; font-variant-numeric:tabular-nums}
.searchrow{display:flex; gap:8px; margin-bottom:10px}
.list-item{display:flex; justify-content:space-between; gap:8px; padding:10px 4px; border-bottom:1px solid var(--grid); align-items:center}
.list-item:last-child{border-bottom:none}
.foodgrid{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.foodchip{background:var(--surface2); border:1px solid var(--border); border-radius:999px; padding:5px 11px; font-size:13px; color:var(--ink2)}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
@media(max-width:380px){.fgrid{grid-template-columns:1fr}}
.fcard{display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:8px 10px; min-width:0}
.fic{font-size:24px; flex:0 0 auto; line-height:1}
.fbody{min-width:0}
.fname{font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.fval{font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; margin-top:1px}
.fval b{color:var(--ink)}
.fmuted{color:var(--muted)}
.fnote{font-size:10.5px; color:var(--accent); margin-top:2px}
details.acc summary span:first-child{display:flex; align-items:center; gap:8px}
.checkrow{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--grid); font-size:15px}
.checkrow:last-child{border-bottom:none}
.checkrow input{width:20px; height:20px; accent-color:var(--accent); flex:0 0 auto}
.checkrow.done span{text-decoration:line-through; color:var(--muted)}
.recipecard{cursor:pointer}
.recipecard .rc-body{display:none; margin-top:10px; font-size:14px; color:var(--ink2)}
.recipecard.open .rc-body{display:block}
.rc-cat{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent); font-weight:650}
.rc-name{font-size:16px; font-weight:650; margin-top:2px}
.rc-instr{white-space:pre-wrap; margin-top:8px; border-top:1px solid var(--grid); padding-top:8px}
.chartbox{margin-top:6px}
.chartbox svg{display:block; width:100%; height:auto; touch-action:pan-y}
.legend{display:flex; gap:14px; font-size:12px; color:var(--ink2); margin:4px 2px}
.legend .sw{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px}
.tooltip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:6px 9px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.18); z-index:5; white-space:nowrap}
.toast{
  position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); border-radius:999px; padding:9px 18px; font-size:14px; font-weight:600;
  z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;
}
.toast.show{opacity:1}
.note{font-size:12.5px; color:var(--muted)}
.divider{height:1px; background:var(--grid); margin:12px 0}
.sldrow{display:flex; align-items:center; gap:10px; margin:6px 0}
.sldrow label{flex:0 0 150px; font-size:13.5px; color:var(--ink2)}
.sldrow input[type=range]{flex:1; accent-color:var(--accent)}
.sldrow .sv{flex:0 0 56px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; font-size:14px}
.seg{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden}
.seg button{flex:1; border:none; background:var(--surface2); color:var(--ink2); padding:9px 6px; font-size:14px; cursor:pointer; font-family:inherit}
.seg button.on{background:var(--accent); color:var(--accent-ink); font-weight:650}
.del{color:var(--bad); background:none; border:none; font-size:16px; cursor:pointer; padding:4px 8px}
details.acc{border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--surface)}
details.acc summary{padding:12px 14px; font-weight:650; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.acc summary::after{content:"›"; transform:rotate(90deg); color:var(--muted); font-size:18px}
details.acc[open] summary::after{transform:rotate(-90deg)}
details.acc .accbody{padding:0 14px 12px}
.statline{display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px solid var(--grid)}
.statline:last-child{border-bottom:none}
.statline .sl{color:var(--ink2)}
.statline .sv{font-weight:650; font-variant-numeric:tabular-nums}
/* Login */
#login{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:none; align-items:center; justify-content:center; padding:20px;
}
#login.open{display:flex}
.loginbox{width:100%; max-width:380px}
.loginbox h1{font-size:26px; text-align:center; margin:0 0 4px}
.loginbox .sub{text-align:center; color:var(--muted); font-size:14px; margin-bottom:22px}
.loginbox .fld{margin-bottom:10px}
.lbtn{width:100%; margin-top:4px}
.gbtn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--surface); color:var(--ink); border:1px solid var(--border);
  border-radius:12px; padding:11px 16px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
}
.orsep{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:14px 0}
.orsep::before,.orsep::after{content:""; flex:1; height:1px; background:var(--grid)}
.loginerr{color:var(--bad); font-size:13px; margin-top:8px; min-height:18px; text-align:center}
.loginlink{background:none;border:none;color:var(--accent);font-size:13.5px;cursor:pointer;font-family:inherit;padding:6px}
.logincenter{text-align:center;margin-top:8px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.syncdot.ok{background:var(--good)} .syncdot.err{background:var(--s2)}
.star{background:none;border:none;font-size:16px;cursor:pointer;padding:0 0 0 6px;line-height:1}
</style>
</head>
<body>
<header class="app">
  <div>
    <h1>🏋️ Hausi Fit</h1>
    <div class="hsub" id="hsub"></div>
  </div>
  <div class="hbtns">
    <button class="hbtn" id="langbtn">DE</button>
    <button class="hbtn" id="themebtn">◑</button>
  </div>
</header>
<main>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-calc"></section>
  <section class="view" id="v-meas"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-more"></section>
</main>
<nav class="tabbar" id="tabbar"></nav>
<div class="modal-bg" id="modalbg" onclick="closeModal()"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<div id="login">
  <div class="loginbox">
    <h1>🏋️ Hausi Fit</h1>
    <div class="sub" id="loginSub"></div>
    <button class="gbtn" id="googleBtn" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
      <span id="googleBtnTxt"></span>
    </button>
    <div class="orsep" id="orsep"></div>
    <div class="fld"><label id="lblEmail"></label><input type="email" id="liEmail" autocomplete="email" inputmode="email"></div>
    <div class="fld"><label id="lblPw"></label><input type="password" id="liPw" autocomplete="current-password"></div>
    <button class="btn lbtn" id="loginBtn" onclick="doEmailAuth()"></button>
    <div class="loginerr" id="loginErr"></div>
    <div class="logincenter"><button class="loginlink" id="modeToggle" onclick="toggleAuthMode()"></button></div>
    <div class="logincenter"><button class="loginlink" id="pwReset" onclick="doReset()"></button></div>
  </div>
</div>

ar durante unos 35-40 minutos, hasta que esté bien dorado por arriba. Servir y disfrutar"},{"cat":"breakfast","name":"Avenita caliente con banano, fresas y huevo duro","ing":["Avena","Banano","Fresa","Leche baja en grasa","Huevo entero"],"sp":[],"txt":"1.\tColocar la avena en una olla y llenarla con agua de tal manera que la cubra por completo\n2.\tLa cocinamos a fuego medio\n3.\tAgregar la mitad del banano machacado y dejar la otra mitad para decorar\n4.\tCuando la avena tiene la textura deseada sacar del fuego\n5.\tServir y decorar con tus toppings"},{"cat":"breakfast","name":"Bowl choco/banano","ing":["Banano","Yogur griego","Chia","Linaza","Almendras","Chocolate 80% cacao"],"sp":[],"txt":"1.\tBatir la mitad del banano junto con el yogurt y verter la mezcla en un bowl.\n2.\tCortar la otra mitad en rodajas y repartirlo al gusto en el bowl.\n3.\tAñadimos las semillas, las almendras y el chocolate\n4.\tDisfrutar"},{"cat":"breakfast","name":"Quark con arandanos","ing":["Magerquark","Heidelbeeren, gefroren","Chiasamen","Leinsamen","Paranuss","Mandeln","Haferflocken"],"sp":[],"txt":null},{"cat":"breakfast","name":"Huevos mexicanos","ing":["Mantequilla","Huevo entero","Cebolla","Tomate","Pan integral"],"sp":["Siracha","Cilantro"],"txt":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo, sal y pimienta al gusto\n4.\tCoges los panes y los pones a tostar, después sobre ellos pones el huevo\n5.\tDecorar con cilantro y siracha al gusto"},{"cat":"breakfast","name":"Huevos pericos con galletas de arroz","ing":["Mantequilla","Huevo entero","Cebolla","Tomate","Galletas de arroz","Mermelada"],"sp":[],"txt":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada"},{"cat":"breakfast","name":"Huevos pericos con mazorca y galletas de arroz","ing":["Mantequilla","Huevo entero","Cebolla","Tomate","Maíz en lata","Galletas de arroz","Mermelada"],"sp":[],"txt":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo y el maíz de lata, mezclamos bien. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada"},{"cat":"breakfast","name":"Huevos revueltos","ing":["Mantequilla","Cebolla","Tomate","Huevos","Pan integral"],"sp":[],"txt":"1. En un sartén agregar la mantequilla\n2. Cortar el tomate y la cebolla y agregarlos al sartén\n3.Cuando la cebolla esté traslúcida agregar los huevos y revolver.\n4.Cocinar hasta el punto que te guste.\n5. Servir con pan integral\nDisfrutar"},{"cat":"breakfast","name":"Pancackes tipo Matilda","ing":["Avena","Chia","Linaza","Leche baja en grasa","Queso cottage 0% grasa","Huevo entero","Banano","Fresa","Miel","Almendras"],"sp":[],"txt":"1.En tu licuadora pon la avena para hacerla harina, luego agregar la chia, linaza, huevo, queso cottage, banano y leche.\n2. Batir hasta tener una mezcla homogénea.\n3. Engrasar el sartén con mantequilla.\n4. Con una cuchara coger un poco de la mezcla y arma tus tortitas.\n5. Dorar por lado y lado\n6. Decorar con topings."},{"cat":"breakfast","name":"Rühreei","ing":["Ei","Butter"],"sp":[],"txt":null},{"cat":"breakfast","name":"Rühreei mit Zwiebeln","ing":["Ei","Butter","Zwiebeln"],"sp":[],"txt":null},{"cat":"breakfast","name":"Tiramisú al desayuno","ing":["Yogur griego","Huevo entero","Leche baja en grasa","Avena","Miel","Aceite de oliva"],"sp":["Esencia de vainilla","Canela","Cacao en polvo"],"txt":"1.\tLo primero que haremos será el bizcocho y para ello haremos un mug cake (un bizcocho en una taza). Mezclaremos muy bien en una taza, el huevo, la leche, la harina de avena (la haces simplemente moliendo la avena), la levadura, la miel (o pasta de dátiles si tienes) y la canela. Engrasamos una taza pintándola con un poco de aceite de oliva y echamos la mezcla del bizcocho. La metemos al microondas 3 minutos.\n2.\tUna vez pasado ese tiempo sacamos el bizcocho de la taza, lo dejamos atemperar y lo desmigajamos bien. Le echamos el café por encima y lo removemos bien para que el café empape bien todo el bizcocho.\n3.\tAhora haremos la crema. Mezclamos el yogurt, la vainilla y la miel. Mezclamos muy bien hasta que quede una crema uniforme.\n4.\tCogemos un vasito y empezamos a montar el tiramisú de la siguiente forma: ponemos una capa de bizcocho, luego una capa de crema de queso, otra capa de bizcocho, otra capa de crema de queso… y así hasta que lleguemos al final del vaso donde culminaremos con una capa de queso y cacao espolvoreado. Para esto yo uso un colador, pongo un poco de cacao en el colador y le doy unos toques laterales y queda perfectamente espolvoreado."},{"cat":"breakfast","name":"Tostada con tomates asados y aguacate triturado","ing":["Pan integral","Huevo entero","Aguacate","Aceite de oliva","Tomates cherry"],"sp":["Sal","Pimienta"],"txt":"1.\tAjuste el horno a 350°F / 180°C / Gas 4.\n2.\tMezcla las mitades de tomate en aceite de oliva y condimento. Transfiere a una bandeja para hornear en una capa uniforme y hornea durante 20-25 minutos, hasta que esté suave y fragante.\n3.\tMientras tanto, hierve agua en una olla, agrega suavemente los huevos y cocina durante 6 minutos para obtener huevos cocidos blandos. Retira y sumerge en agua helada para evitar que se cocinen más. Luego pelar.\n4.\tTostar el pan integral. Cubre con aguacate, jugosos tomates asados, huevos duros y una pizca generosa de sal y pimienta.\n5.\tPara preparar la comida, recomiendo calentar los tomates y tostar el pan justo antes de armarlo. Dependiendo de cuánto tiempo tengas en las mañanas, incluso puedes hervir los huevos con anticipación y guardarlos en el refrigerador."},{"cat":"breakfast","name":"Tostadas francesas","ing":["Huevo entero","Pan integral","Miel","Mantequilla","Leche baja en grasa"],"sp":[],"txt":"1.\tEn un bowl colocar el huevo, la leche y la canela\n2.\tCoger un sartén y agregar la mantequilla\n3.\tPasas por la mezcla las rebanadas de pan, procura que se impregnen super bien\n4.\tDorar las rebanadas en el sartén\n5.\tDecorar con miel y fresas"},{"cat":"breakfast","name":"Parfait de fruits","ing":["Chia","linaza","Leche baja en grasa","miel","fresa","kiwi"],"sp":[],"txt":"1.\tEn un vaso colocar las semillas de chia y de linaza\n2.\tAgregar la leche y la miel\n3.\tDejar durante toda la noche en la nevera \n4.\tAl siguiente día obtendrás un pudding ya que la chia ha absorvido gran parte de los líquidos \n5.\tDecorar con tus toppings\n6.\tServir y disfrutar"},{"cat":"breakfast","name":"Avocado toast con huevos pericos","ing":["Mantequilla","Cebolla","Tomate","Huevo entero","Pan integral","Aguacate"],"sp":[],"txt":"1)\tCortar la cebolla y el tomate en cuadrados pequeños\n2)\tEn un sartén pones a derretir la mantequilla\n3)\tCuando la mantequilla ya esté caliente agregas la cebolla y el tomate\n4)\tMientras la cebolla se pone transparente y el tomate saca sus jugos pon el pan a tostar\n5)\tAgregar el huevo al fuego, dejas que se cocine \n6)\tCoges el aguacate y haces una crema suave para poner sobre el pan previamente tostado\n7)\tCuando el huevo esté en el punto que te guste, sácalo del fuego \n8)\tEmplatamos: Coges el plan, lo untamos de la crema de aguacate, agregas el huevo perico\n9)\tDisfruta"},{"cat":"breakfast","name":"Avenita caliente con banano y huevo duro","ing":["Chia","Linaza","Leche baja en grasa","Avena","Banano","Huevo entero"],"sp":[],"txt":"1)\tColocar la avena en una olla\n2)\tAgregar la leche y la canela\n3)\tCalentar hasta encontrar la consistencia que más te guste.\n4)\tDecorar con el banano, las semillas de chía y de linaza.\n5)\tAcompañar con huevo(s) duros(s) *Depende de tu plan"},{"cat":"lunch","name":"Bowl oriental","ing":["Aceite de oliva","Cebolla","Ajo","Zanahoria","Dátiles","Pasta de tomate","Arverjas","Carne Molida baja en grasa","Ensalada de lechuga, tomate y pepino"],"sp":[],"txt":"1.Hacer el arroz según las instrucciones del empaque y reservar\n2.En un sartén agregar el aceite, la cebolla, el ajo. Espera a que la cebolla se ponga transparente y agrega la carne molida.\n3.Añada las zanahorias, los dátiles, la pasta de tomate, 100g de agua, 1 cucharadita de sal, la pimienta, el comino, la canela y el curry.\n4.Después agregar las arvejas y cocinar durante 40 minutos.\n5.Emplatar y servir con una ensalada de lechuga, tomate y pepino del tamaño de tu mano"},{"cat":"lunch","name":"Croquetas de atún","ing":["Atún en agua","Linaza","Huevo","Zumo de limón","Aceite de oliva","Arroz","Aguacate","Leche baja en grasa"],"sp":["Ajo en polvo","Pimienta","Sal","Perejil picado"],"txt":"1. Vaciamos las latas de atún sobre un colador fino y exprimimos lo más que se pueda, para que el atún nos quede con la menor cantidad de líquido posible.\n2. Lavamos el perejil y lo picamos finito.\n3. En un bowl grande, agregamos el atún, la linaza, el perejil, el huevo, el jugo de limón, el ajo en polvo y salpimentamos. Mezclamos hasta integrar perfectamente.\n4. Colocamos un sartén grande a fuego medio y agregamos el aceite. Con ayuda de una servilleta, lo esparcimos sobre toda la superficie y retiramos el exceso.\n5. Comenzamos a formar las tortitas de atún, una a una, con nuestras manos. Tomamos un poco de la mezcla, formamos una bola y después la aplanamos apretando bien para que no se desbarate al cocinarla. Con ayuda de nuestras manos, redondeamos las orillas para que nos queden bonitas y no con forma de amiba. =)\n6. Colocamos en el sartén cada tortita que vayamos formando. Cocinamos alrededor de 5 minutos por cada lado, o hasta que éste se vea doradito. Al voltear, apretamos un poquito más con una pala de cocina, para terminar de sacar líquido y que la croqueta quede bien compacta.\n7. Conforme vayan saliendo, colocamos las tortitas sobre una servilleta de cocina para absorber el excedente de grasa."},{"cat":"lunch","name":"Ensalada de quinua con gambas y aguacate","ing":["Camarones","Quinua","Tomate","Mango","Aguacate","Pimentón rojo","Cebolla","Zumo de Naranja","Zumo de Limón","Salsa tabasco","Ajo","Aceite de oliva"],"sp":["Sal y pimienta"],"txt":"Prepara el cuscús perlado según las instrucciones del paquete. Escúrrelo y resérvalo.\n2. Sazona las gambas en un bol para mezclar.\n3. Pon una sartén de acero al carbono a fuego alto, rocíala con un poco de aceite y añade las gambas. Cocínalas, unos 6 - 8 minutos. Una vez terminada la cocción, corta las gambas en trozos.\n4. Prepara todos los ingredientes.\n5. Mezcla los ingredientes en una taza para la salsa.\n6. Combina las gambas y los ingredientes de la ensalada en un bowl grande. Vierte la salsa y mezcla todo suavemente.\n7. Sazona al gusto con sal marina y pimienta, y utiliza zumo de lima o naranja para ajustar el sabor según sea necesario."},{"cat":"lunch","name":"Hausi Mittag","ing":["Reis","Hähnchen","Brokkoli","Erbsen","Mais","Kidneybohnen"],"sp":[],"txt":null},{"cat":"lunch","name":"Pasta de atún","ing":["Atún en agua","Cebolla","Tomate","Aguacate","Mayonesa","Pasta"],"sp":[],"txt":"1.\tPicas la cebolla y el tomate en cuadritos pequeños\n2.\tCoges el aguacate, lo machacas, le agregas sal y pimienta al gusto\n3.\tAgregas la mayonesa al aguacate y mezclas bien\n4.\tColocar la cebolla y el tomate a la preparación anterior\n5.\tEscurres el atún y lo agregas a la mezcla\n6.\tHaces la pasta como indica en el empaque\n7.\tJuntas todo y a disfrutar"},{"cat":"lunch","name":"Pollo al limón y aceitunas verdes","ing":["Aceite de oliva","Cebolla","Pechuga de pollo","Zumo de Limón","Aceitunas verdes","Arroz"],"sp":[],"txt":"1.\tEn un sartén colocar el aceite de oliva, y las rodajas de un limón. Esperar hasta que las rodajas estén doradas y hagan sacado su jugo.\n2.\tSacar las rodajas del fuego y ahí mismo colocamos la pechuga de pollo cortada en cubos.\n3.\tDoramos por ambos lados y reservamos el pollo fuera del fuego.\n4.\tEn el mismo sartén agregamos cebolla cortada en cuadritos pequeños.\n5.\tAgregamos condimento como sal, pimienta, jengibre, cúrcuma, ajo en polvo y esperamos hasta que la cebolla se vaya poniendo tierna y transparente.\n6.\tDespués agregamos media taza de agua y colocamos de nuevo el pollo en el sartén.\n7.\tAgregamos el jugo de un limón, las aceitunas verdes cortadas en cubos y las rodajas de limón que utilizamos al principio de la preparación.\n8.\tCubrimos por unos minutos y dejamos cocinar a fuego medio para que todos lo sabores se combinen perfectamente\n9.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz"},{"cat":"lunch","name":"Pollo con coliflor","ing":["Aceite de oliva","Cebolla","Ajo","Pechuga de pollo","Quinua","Frijoles en lata","Coliflor","Ensalada","Lechuga","Tomate","Pepino","Aceite de oliva","Miel","Yogur griego"],"sp":[],"txt":"1.\tHacer la quinua según el empaque. (Puedes agregar al agua un poco de sal y un ajo sin cáscara para darle mejor sabor)\n2.\tCuando la quinua esté hecha agregar los fríjoles de lata y revolver bien. Agregar un chorrito de limón para darle un sabor refrescante\n3.\tEn una bandeja para horno colocar la coliflor en pequeños pedazos, condimentarla completamente con páprika, sal y pimienta.\n4.\tHacer lo mismo con tu pechuga de pollo\n5.\tLlevar al horno y cocinar hasta que el pollo esté completamente hecho\n6.\tLuego vamos a hacer un aliño para la ensalada. Mezclamos yogur griego, aceite balsámico, aceite de oliva, miel, sal y pimienta.\n7.\tPor último vamos a servir nuestra quinoa con fríjoles, el pollo y la ensalada con nuestro aderezo."},{"cat":"lunch","name":"Pollo Guisado","ing":["Pechuga de pollo","Pasta de tomate","Arroz","Aceite de oliva","Azúcar de coco","Agua","Pimentón verde","Pimentón rojo","Cebolla"],"sp":["Sal","Pimienta","orégano"],"txt":"1. En un bowl añade el pollo, el sofrito y los condimentos. Frótalo por todo el pollo y déjalo marinar 20 minutos (a temperatura ambiente) o durante varias horas, hasta toda la noche, en la nevera.\n2. Pon una olla con tapa a fuego medio-alto. Una vez caliente, añade el aceite y espolvorea el azúcar. Una vez que vea que el azúcar empieza a caramelizarse, aproximadamente 1 minuto, añada el pollo marinado (conserva el recipiente). Dora el pollo por un lado durante 3 - 5 minutos, o hasta que aparezcan marcas de cocción profundas, y luego da la vuelta al pollo.\n3. Reduce el fuego a medio, vierte ¼ de taza de agua y cubre el pollo con el pimiento y las rodajas de cebolla. Cubre y cocina durante unos 5 minutos hasta que las verduras se hayan ablandado, PERO sigan estando tiernamente crujientes. Si es necesario, añade cucharadas de agua para evitar que se quemen.\n4. Vierte el agua restante en el recipiente que utilizaste para marinar el pollo y agítalo para quitar el resto de los condimentos y el sofrito de los lados. Luego viértelo en la olla junto con la salsa de tomate. Mézclalo rápidamente, luego tápalo y cocina durante 15 - 20 minutos hasta que se forme una rica salsa.\n5. Reduce el fuego, sazona al gusto con sal marina y pimienta, y adorna con cilantro fresco.\n6. Servir con arroz blanco."},{"cat":"lunch","name":"Pollo miel mostaza","ing":["Aceite de oliva","Pechuga de pollo","Mostaza","Miel","Arroz"],"sp":[],"txt":"1. En un sartén agregar el aceite de oliva\n2. Cuando el aceite esté caliente agregar la cebolla cortada en julianas\n3.Esperar a que la cebolla esté transparente y agregar el pollo\n4.Cocinar por ambos lados hasta que esté tierno y jugoso. Sal y pimienta al gusto\n5. Sacar del fuego.\n6. En un recipiente mezclar la miel y la mostaza\n7. Bañar el pollo con la salsa que hiciste\n8. Servir con arroz\nDisfrutar"},{"cat":"lunch","name":"Pollo miel mostaza con aguacate","ing":["Aceite de oliva","Cebolla","Pechuga de pollo","Mostaza","Miel","Arroz","Aguacate"],"sp":[],"txt":"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tEn una taza mezclar de forma homogénea la mostaza y la miel\n4.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz y aguacate"},{"cat":"lunch","name":"Pollo teriyaki","ing":["Ensalda","Lechuga","Tomate","Pepino","Zanahoria","Pollo teriyaki","Aceite de oliva","Pechuga de pollo","Salsa de soja","Miel"],"sp":[],"txt":"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tAgregar la salsa de soja y miel. Cocinar por unos cuantos minutos más y sacar del fuego\n4.\tServir el pollo junto con la ensalada\n5.\tDisfrutar"},{"cat":"lunch","name":"Tilapia con pico de gallo","ing":["Aguacate","Cebolla","Tomate","Zumo de limón","Tilapia","Papa sabanera"],"sp":["Cilantro"],"txt":"1.\tPicar la cebolla, el tomate y el aguacate en cubos pequeños.\n2.\tAgregar todo en un bowl y mezclar bien, agregar el jugo del limón, sal y pimienta al gusto.\n3.\tEn un sartén hacer tu filete hasta que este cocinado por ambos lados\n4.\tMientras tanto hacer tus papas hervidas hasta que estén suaves \n5.\tServir todo y disfrutar"},{"cat":"lunch","name":"Arroz frito con curry de pollo","ing":["Pechuga de pollo","Zanahoria","Salsa de soja","Aceite de oliva","Huevo entero","Pimentón rojo","Arroz","Aguacate"],"sp":[],"txt":"1. Hacer el arroz según las instrucciones del paquete.\n2. Pon en un wok (o sartén) antiadherente grande a fuego ALTO. Una vez caliente, rocíe un poco de aceite y agregar el pollo. Deja que se dore durante unos 4 o 5 minutos (sin tocarlo) y luego remueva y espolvoree el polvo de curry. Mezcle en el wok y continúe la cocción durante 2 minutos más. Retirar y reservar.\n3. Reduce el fuego de la sartén a medio (y asegúrate de que la sartén se ha enfriado, esto es importante), luego añada el aceite, las cebollas y el ajo. Ralla el jengibre fresco. Cocina durante 2 o 3 minutos para aromatizar el aceite, luego has un hueco en el sartén y añade el huevo. Revuelve rápidamente los huevos y pícalos continuamente.\n4. Aumenta el fuego a medio-alto o ALTO. Incorpora el arroz y mezcla bien. Espolvorea el resto del curry en polvo y dobla continuamente, asegurándote de que cada grano de arroz esté cubierto de curry. Añade la ralladura de lima para avivar los sabores y mezcla.\n5. Añade los pimientos y el pollo y sigue mezclando. Incorpora los guisantes y las zanahorias congeladas o frescas y mezcla todo. Retira el wok del fuego y añada las hojas de albahaca arrancadas (si tienes)\n6. Sazona al gusto con soja baja en sodio y zumo de limón fresco.\n7. Disfruta"},{"cat":"lunch","name":"Pasta con salsa de tomate y pollo","ing":["Pasta","Pechuga de pollo","Pasta de tomate","Aceite de oliva","Cebolla","Ajo"],"sp":[],"txt":"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla ya esté transparente agregar el pollo en cubos \n3)\tDorar por todos los lados el pollo \n4)\tAgregar la pasta de tomate \n5)\tHacer la pasta según indica el paquete\n6)\tCombinar la pasta junto con la salsa de tomate y el pollo\n7)\tDisfrutar"},{"cat":"lunch","name":"Salmón a la naranja y ensalada","ing":["Salmón","Zumo de naranja","Salsa de soja","Miel","Arroz","Ajo","Lechuga","Pepino","Maíz en lata","Aceite de oliva","Zumo de limón"],"sp":["Sal y pimienta"],"txt":"1.\tColocar el salmón en un sartén caliente\n2.\tDejar dorar por lado y lado por unos 10 minutos\n3.\tAgregar el sumo de una naranja, la salsa de soja, el ajo picado y la miel\n4.\tDejar por otros 10 minutos\n5.\tParalelamente hacer el arroz integral/ quinoa según indica el paquete\n6.\tHacer la ensalada\n7.\tEmplatar todo junto"},{"cat":"lunch","name":"Arroz con pollo","ing":["Arroz","Salsa de tomate","arverjas","Zanahoria","Aceite de oliva","Aguacate","Pechuga de pollo"],"sp":[],"txt":"1.\tPoner a hacer el arroz según las instrucciones del empaque\n2.\tEn un sartén aparte colocar el aceite y la pechuga\n3.\tCuando la pechuga esté lista agregar la zanahoria y la arveja\n4.\tDejar cocinar un rato y agregar el arroz\n5.\tCuando todo esta incorporado darle sabor con sal, pimienta y la salsa de tomate\n6.\tServir con aguacate"},{"cat":"lunch","name":"Salteado de garbanzos con pollo y verduras","ing":["Garbanzos de lata","Pechuga de pollo","Brocoli","Zucchini","Zanahoria","Cebolla","Ajo","Aceite de oliva"],"sp":["Sal","Pimienta"],"txt":"1)\tEmpezamos con el pollo. Lo cortamos en tiras (sin piel ni huesos) y lo ponemos con un diente de ajo picado y el aceite.\n2)\tPreparamos las verduras. La zanahoria la limpiamos, \"pelamos\" y cortamos en bastones finos, el brócoli lo separamos en arbolitos y el calabacín (Zucchini) lo limpiamos y cortamos con piel en dados, además la cebolla la pelamos y cortaremos en juliana.\n3)\tEn una sartén salteamos el pollo hasta dorarlo, lo reservamos. Añadimos en la misma sartén la cebolla, dos minutos después el resto de verduras y salteamos un par de minutos más\n4)\tAñadimos el pollo y los garbanzos y removemos, mezclando y salteando a la vez durante otros dos o tres minutos."},{"cat":"lunch","name":"Cheesburguer soup","ing":["Pasta de tomate","Pepinillos","Queso Mozarrella rallado","Cebolla","Queso crema","Crema de leche","Carne molida baja en grasa","Aceite de oliva"],"sp":[],"txt":"1)\tCortar la cebolla en cubos y sofreírla en un sartén\n2)\tAgregar la carne molida y la pasta de tomate (Puedes agregar un par de tomares en cubos si quieres para darle más consistencia)\n3)\tSal pimentar al gusto\n4)\tAgregar el resto de ingredientes\n5)\tServir y agregar el queso gratinado"},{"cat":"dinner","name":"Zucchini relleno","ing":["Atún en agua","Cebolla","Tomate","Zucchini","Aceite de oliva","Apio","Mozzarella","Papa Sabanera"],"sp":[],"txt":"1.\tLo primero que hay que hacer es cortar el zucchini por la mitad y vaciarlos con la ayuda de una cuchara. Después unta cada una de las mitades con un poco de aceite de oliva y hornéalas durante 15-20 minutos. Recuerda precalentar el horno previamente a 200º.\n2.\tCorta las papas en laminas y colócalas también en el horno junto al Zucchini\n3.\tMientras tanto, mezcla todos los ingredientes en un bowl grande: atún escurrido, un tallo de apio picado, media cebolla picada, dos cucharadas de zumo de limón y una de aceite de oliva, sal y pimientas al gusto.\n4.\tHecho esto rellena cada mitad de calabacín con la mezcla de atún y verduras, y cúbrelas con queso rallado.\n5.\tPara acabar, vuelve a hornear los calabacines durante 3-5 minutos hasta que el queso quede derretido. Sácalos del horno, emplata y ¡a comer!"},{"cat":"dinner","name":"Arepa con jamón","ing":["Arepa blanca","Jamón de pavo","Mantequilla","Mozzarella"],"sp":[],"txt":null},{"cat":"dinner","name":"Arepita con pollo BBq","ing":["Arepa blanca","Pechuga de pollo","Cebolla","Salsa bbq","Aguacate"],"sp":[],"txt":"1.\tColocar tu arepa en el sartén y esperar a que dore\n2.\tEn una olla agregar la pechuga de pollo, la cebolla y agua con sal\n3.\tHervir hasta que el pollo esté cocinado perfectamente\n4.\tSacar el pollo del agua y desmechar. Después mezclar con la salsa bbq\n5.\tColocar una capa de aguacate y encima el pollo bbq\n6.\tDisfrutar"},{"cat":"dinner","name":"Crema de espinaca con pollo","ing":["Papa sabanera","Pechuga de pollo","Espinaca","Aceite de oliva","Cebolla","Ajo"],"sp":[],"txt":"1.Lo primero que vamos a hacer es colocara hervir la pechuga de pollo en agua.\n2. Cuando esté completamente cocinada sacamos la pechuga y reservamos el consomé.\n3. En otra olla colocamos un poco de aceite de oliva, un diente de ajo y la cebolla.\n4. Cuando la cebolla esté transparente colocamos la espinaca y dejamos cocinar por unos segundos.\n5. Agregamos las papas y un poco del consomé que teníamos guardado.\n6. Cuando las papas estén blandas sacar del fuego.\n7. Agregar todo a la licuadora (no agregues todo el líquido de la olla de una vez sino que ve mirando poco a poco hasta tener la textura deseada)\n8. Servir con el pollo desmechado por encima."},{"cat":"dinner","name":"Hausi Abend","ing":["Rote Linsen","Zucchini","Feta light","Hackfleisch 5%"],"sp":[],"txt":null},{"cat":"dinner","name":"Pasta cremosa de pollo y broccoli","ing":["Pasta","Mantequilla","Harina","Ajo","Brocoli","Pechuga de pollo","Crema de leche","Leche baja en grasa"],"sp":[],"txt":"1.\tEn una olla grande con agua hirviendo con sal, cocina la pasta según las instrucciones del paquete; escurrir bien.\n2.\tDerrita la mantequilla en una sartén grande a fuego medio alto. Agregue el ajo, y cocine, revolviendo con frecuencia, hasta que estén fragantes, aproximadamente 2 minutos\n3.\tBatir la harina hasta que esté ligeramente dorada, aproximadamente 1 minuto. Agregue gradualmente la leche, y la crema de leche hasta que espese un poco, aproximadamente 3-4 minutos. Si la mezcla es demasiado espesa, agregue más leche según sea necesario; sazone con sal y pimienta, al gusto.\n4.\tAgregue la pasta, el brócoli y el pollo previamente cocinado hasta que estén bien combinados, unos 3-4 minutos.\n5.\tServir inmediatamente."},{"cat":"dinner","name":"Pizza casera","ing":["Wrap integral","Queso Mozarrella","Salsa de tomate","Pechuga de pollo","Piña"],"sp":[],"txt":"1.\tCoger la tortilla y agregar por encima la salsa de tomate, la pechuga de pollo previamente cocinada en agua, la piña y el queso\n2.\tMeter al horno hasta que el queso se derrita\n3.\tDisfrutar"},{"cat":"dinner","name":"Quinua cocida","ing":["Quinua","Aceite de oliva","Zanahoria","Judías verdes","Arverjas","Ajo","Salsa de soja","Huevo entero"],"sp":[],"txt":"1.\tEn una olla mediana hervir la quinoa y 2 tazas de agua. Reducir el fuego y hervir hasta que el agua sea totalmente absorbida, aproximadamente unos 15 a 20 minutos. \n2.\tSazonar con sal y remover con un tenedor para separar la quinoa. \n3.\tEn una sartén a fuego medio calentar el aceite de oliva. Agregar la cebolla, zanahoria y arvejas. Cocinar hasta que estén suaves. \n4.\tAgregar el ajo junto con la salsa de soya y cocinar por un par de minutos más. \n5.\tEn un bowl pequeño batir ligeramente el huevo y cocinarlos en una sartén que está previamente engrasada. \n6.\tFormar una tortilla, cocinando por ambos lados. Transferir a un plato y cortar cubitos.\n7.\tAgregar el huevo cocido a la mezcla de quinoa junto con la cebolla china. Servir."},{"cat":"dinner","name":"Salchi papas","ing":["Papa sabanera","Salchicha de pavo","Maíz en lata","Queso Mozarrella","Salsa de tomate","Mayonesa","Aceite de oliva"],"sp":[],"txt":"1.Cortar las papas en julianas.\n2. Agregar en un bowl sal, pimienta, páprika y aceite de oliva. Luego pasar todas tus papas por esta mezcla\n3.En una bandeja colocas papel refinado y pones tus papas previamente condimentadas.\n4.Hornear a 180 grados hasta que estén doradas y crujientes\n5.Picar las salchichas y agregar en un bowl junto con tus papas crocantes. Agregar maíz, queso y salsas"},{"cat":"dinner","name":"Sanduche de atún","ing":["Atún en agua","Cebolla","Mayonesa","Pan integral","Aguacate"],"sp":["Sal","Pimienta"],"txt":"1.En un bowl agregar el atún, la cebolla en cubos, la mayonesa, sal y pimienta.\n2. Mezclar muy bien,\n3.Armar tu sanduche.\n4.puedes agregar una rodaja de tomate si así lo deseas"},{"cat":"dinner","name":"Sanduchito bien jalado","ing":["Pan integral","Pechuga de pollo","Salsa bbq","Queso Mozarrella","Lechuga","Tomate","Mantequilla"],"sp":[],"txt":"1.\tColocar el pollo en una olla con agua a fuego medio.\n2.\tEsperar hasta que esté cocinado perfectamente y reservar\n3.\tCoger tu pan de molde, untar mantequilla a ambas partes, agregar la lechuga, tomate, salsa bbq y el pollo\n4.\tDisfrutar"},{"cat":"dinner","name":"Wrap mexicano","ing":["Wrap integral","Maíz en lata","Aguacate","Mozzarella","Frijoles en lata","Cebolla","Tomate"],"sp":[],"txt":"1. Usar una tortilla integral\n2. Agregar los fríjoles en lata, el maís, la cebolla, el tomate, el queso y el aguacate\n3. Decorar con salsa bbq\n4. Puedes comerlo caliente si así lo prefieres, para esto cerrar bien y llevarlo a una sartén.\nDisfrutar"},{"cat":"dinner","name":"Wrap mexicano con carne","ing":["Wrap integral","Frijoles en lata","Maíz en lata","Carne molida baja en grasa","Tomate","Cebolla","Aceite de oliva"],"sp":[],"txt":"1.\tColocas el aceite en un sartén junto con la cebolla\n2.\tCuando la cebolla esté transparente agregas la carne molida\n3.\tEsperas a que esté bien cocinada y la sacas del fuego\n4.\tArmar tu wrap con todos los ingredientes"},{"cat":"dinner","name":"Wrap bbq","ing":["Wrap integral","Pechuga de pollo","Salsa bbq","Cebolla","Aceite de oliva","Queso Mozarrella"],"sp":[],"txt":"1.\tColocas el aceite en un sartén junto con la cebolla y el pollo \n2.\tCuando el pollo esté en su punto agregas la salsa bbq\n3.\tSacas todo del sartén y lo colocas sobre el Wrap\n4.\tAgregar el queso\n5.\tDisfrutar"},{"cat":"dinner","name":"Rollitos de atún","ing":["Atún en agua","Zucchini","Aguacate","Mayonesa","Zumo de limón"],"sp":["Sal y pimienta"],"txt":"1)\tHacer tiras largas y finas con el zucchini\n2)\tColocar vinipel en la mesa para que sea más fácil hacer los rollos\n3)\tEn un bowl agregar el atún, la mayonesa y el aguacate machacado\n4)\tAgregar chorrito de limón, sal y pimienta al gusto\n5)\tColocar las tiras de zucchini en el vinipel una tras de otra hasta formar una fila\n6)\tAgregar la mezcla de atún sobre la capa de zucchini\n7)\tCon ayuda del vinipel empezar a enrollar \n8)\tDejar tu rollo de atún por 1h en la nevera\n9)\tSacar de la nevera y con un chuchillo cortar tus rollitos del grosor que desees\nTIP: no los hagas muy delgados para que no se te salga todo el relleno"},{"cat":"dinner","name":"Wrap de pollo","ing":["Wrap Integral","Pechuga de pollo","Cebolla","Aceite de oliva","Maíz en lata","Queso Mozarrella"],"sp":["Sal y pimienta"],"txt":"1)\tEn un sartén caliente agregar el aceite de oliva y la cebolla\n2)\tCuando la cebolla esté transparente agregar el pollo en cubitos \n3)\tDejar dorar el pollo por todos sus lados\n4)\tSacar del fuego y empezar a emplatar tu wrap\n5)\tCoger el wrap, agregar los fríjoles en lata, el maís, el pollo con la cebolla\n6)\tAgregar el queso \n7)\tDisfrutar"},{"cat":"dinner","name":"Crema de broccoli con pollo","ing":["Broccoli","Cebolla","Aceite de oliva","Zanahoria","Pechuga de pollo","Papa sabanera"],"sp":["Sal y pimienta"],"txt":"1.\tPones a hervir la pechuga de pollo \n2.\tEn una olla agregar el aceite y la cebolla\n3.\tCuando la cebolla se blanquea incorporas la zanahoria, la papa y el broccoli \n4.\tDejas cocinar hasta que el pollo esté en su punto, lo sacas del agua y lo empiezas a desmechar\n5.\tAgregas el caldo donde hiciste el pollo a las verduras (no todo para que no te quede tan líquido) (reserva para después por si te queda muy espesa la crema)\n6.\tLicuas, agrega sal y pimienta al gusto\n7.\tEmplatamos primero la crema y por encima el pollo desmechado (Puedes agregarle un chorrito de crema de leche…poquito)"},{"cat":"dinner","name":"Típico colombiano","ing":["Aguacate","Carne molida baja en grasa","Cebolla","Arroz","Frijoles en lata"],"sp":[],"txt":"1.\tAgregas la carne en un sartén antiadherente junto con la cebolla y los dejas cocinar\n2.\tHaces el arroz según las instrucciones del empaque\n3.\tEmplatamos el arroz, la carne, los frijoles en lata y el aguacate"},{"cat":"dinner","name":"Sanduchito bbq","ing":["Pan integral","Lechuga","Tomate","Queso Mozarrella","Jamon de pavo","Salsa bbq"],"sp":[],"txt":null},{"cat":"dinner","name":"Arepa reina pepiada","ing":["Queso Mozarrella","pechuga de pollo","cebolla","Mayonesa","Aguacate","Harina P.A.N","Mantequilla"],"sp":[],"txt":"1.\tPoner a hervir la pechuga hasta que este cocinada\n2.\tParalelamente ve haciendo las arepas\n3.\tColocar la harina en un bowl, junto con un poco del queso, sal y agua\n4.\tArmas las arepas\n5.\tEn un sartén colocas la mantequilla y pones a cocinar las arepas\n6.\tDesmechar la pechuga de pollo\n7.\tEn otro bowl mezclar el aguacate, la mayonesa, la cebolla, y la pechuga de pollo desmechada, salpimentar al gusto\n8.\tCuando las arepas estén doradas y listas partir por la mitad, rellenarlas y disfrutar 😊"},{"cat":"dinner","name":"Zucchini noodles con carne","ing":["Zucchini","Queso Parmesano","Carne molida baja en grasa","Pasta de tomate","Aceite de oliva"],"sp":[],"txt":"1)\tEn un sartén agregas el aceite de oliva y esperas hasta que se caliente\n2)\tAgregamos la carne molida baja en grasa, condimentar a tu gusto\n3)\tMientras la carne se hace hacer tiras con el Zucchini tipo pasta\n4)\tCuando la carne esté totalmente cocinada pero jugosa agregamos nuestros zoodles y esperamos a que saquen un poco de agua\n5)\tDejar pasar unos 10 minutos y agregar la pasta de tomate\n6)\tSacar del fuego, emplatar y decorar con el queso parmesano\n7)\tDisfrutar"},{"cat":"dinner","name":"Pollo Hawaiano","ing":["Pechuga de pollo","Aceite de oliva","Arroz","Piña"],"sp":[],"txt":"1)\tEn un sartén agregamos el aceite de oliva y lo dejamos calentar por unos minutos\n2)\tAgregamos nuestra pechuga de pollo\n3)\tDejamos dorar por lado y lado\n4)\tMientras nuestra pechuga de pollo se hace cortar la piña en rebanadas y poner igualmente en el sartén hasta que se dore y saque sus jugos \n5)\tEmplatamos y acompañamos nuestra deliciosa pechuga con arroz."},{"cat":"lunch","name":"Tilapia y ensalada","ing":["Lechuga","Tomate","Pepino","Maíz en lata","Aceite balsámico","Tilapia","Papa sabanera","Mayonesa"],"sp":[],"txt":null}],"einkaufsliste":{"Eiweißquelle":["Hähnchenbrust","Putenbrust","Mageres Rind","Fisch (Kabeljau, Seelachs, Lachs in Maßen)","Eier","Magerquark","Skyr","Griechischer Joghurt 2 %","Hüttenkäse","Harzer Käse","Proteinpulver (neutral oder Vanille)"],"Kohlenhydrate":["Haferflocken (fein/grob)","Süßkartoffeln","Kartoffeln","Vollkornreis","Quinoa","Couscous","Vollkornnudeln","Buchweizen","Hirse","TK-Gemüse (Brokkoli, Blumenkohl, Spinat)"] /* ================= State ================= */
const LS_KEY = 'hausifit_v1';
let S = null;
function defaultState(){
  const ex = {};
  for(const [id,v] of Object.entries(DATA.seed)){
    ex[id] = {w:v.weight??null, r:(typeof v.reps==='string'?v.reps:String(v.reps??'')), s:v.sets??null, hist:[]};
  }
  return {
    lang:'de', theme:'auto', split:'split4', dayIdx:0, fav:null, ts:0,
    sel:{}, ex, custom:{},
    meas:{ gewicht: DATA.weightSeed.map(e=>({d:e.date,v:e.value})),
           bauch: (DATA.bodySeed.bauch||[]).map(e=>({d:e.date,v:e.value})) },
    measType:'gewicht',
    shop:{},
    foodTab:'top', recipeCat:'all', zSort:'name', zQuery:'',
    calc:{gender:'m', height:180, age:39, weight:92.6, goal:86, deficit:20, bf:30,
          palH:[8,2,2,8,3,1], jogS:3, jogK:600, macroMode:'auto', ppk:2, fpk:1, mp:30, mf:30, mc:40},
  };
}
function save(){
  S.ts = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  cloudSave();
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ S = Object.assign(defaultState(), JSON.parse(raw)); return; }
  }catch(e){}
  S = defaultState();
}
load();
if(S.fav && DATA.splits.some(s=>s.id===S.fav)) S.split = S.fav;

/* ================= Cloud sync (Firebase) ================= */
var FB = null;            // set by the module script when Firebase is ready (var => window.FB)
const DEMO = new URLSearchParams(location.search).get('demo')==='1';
let cloudUser = null;
let cloudTimer = null;
let syncState = 'off';    // off | ok | err
function setSync(st){
  syncState = st;
  const el = document.getElementById('syncdot');
  if(el) el.className = 'syncdot ' + (st==='ok'?'ok':(st==='err'?'err':''));
}
function cloudSave(){
  if(!FB || !cloudUser) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async ()=>{
    try{
      await FB.saveState(cloudUser.uid, JSON.stringify(S), S.ts);
      setSync('ok');
    }catch(e){ setSync('err'); }

async function onAuth(user){
  if(DEMO){ document.getElementById('login').classList.remove('open'); return; }
  cloudUser = user;
  if(!user){
    document.getElementById('login').classList.add('open');
    setSync('off');
    renderLogin();
    return;
  }
  document.getElementById('login').classList.remove('open');
  try{
    const remote = await FB.loadState(user.uid);
    if(remote && remote.json){
      const rts = remote.ts || 0;
      if(rts >= (S.ts||0)){
        try{
          const obj = JSON.parse(remote.json);
          S = Object.assign(defaultState(), obj);
          try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
          if(S.fav && DATA.splits.some(s=>s.id===S.fav)) S.split = S.fav;
          setTheme(S.theme);
        }catch(e){}
      }else{
        await FB.saveState(user.uid, JSON.stringify(S), S.ts);
      }
    }else{
      await FB.saveState(user.uid, JSON.stringify(S), S.ts||Date.now());
    }
    setSync('ok');
  }catch(e){ setSync('err'); }
  renderAll();
}
/* pull fresh data when returning to the app */
document.addEventListener('visibilitychange', async ()=>{

function fmt(n, dec=0){
  if(n===null||n===undefined||isNaN(n)) return '–';
  return Number(n).toLocaleString(S.lang==='de'?'de-DE':(S.lang==='es'?'es-ES':'en-US'),{minimumFractionDigits:dec, maximumFractionDigits:dec});

function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }

function getSplit(){ return DATA.splits.find(s=>s.id===S.split) || DATA.splits[0]; }
function slotExercise(splitId, dayIdx, slotIdx){
  const ov = S.sel?.[splitId]?.[dayIdx]?.[slotIdx];
  if(ov && EXALL()[ov]) return ov;
  return getSplitById(splitId).days[dayIdx].slots[slotIdx].exercise;
}
function getSplitById(id){ return DATA.splits.find(s=>s.id===id); }
function setSlotExercise(splitId, dayIdx, slotIdx, exId){
  S.sel[splitId] = S.sel[splitId]||{};
  S.sel[splitId][dayIdx] = S.sel[splitId][dayIdx]||{};
  S.sel[splitId][dayIdx][slotIdx] = exId;
  save();
}
function lastLog(eid){
  const e = S.ex[eid]; if(!e) return null;
  if(e.hist && e.hist.length) return e.hist[e.hist.length-1];
  if(e.w!==null&&e.w!==undefined) return {d:null,w:e.w,r:e.r,s:e.s};
  return null;
}

  S.fav = (S.fav===id) ? null : id;
  save(); renderTrain();

}
function ensureEx(eid){ S.ex[eid] = S.ex[eid]||{w:null,r:'',s:null,hist:[]}; if(!S.ex[eid].hist) S.ex[eid].hist=[]; return S.ex[eid]; }
function stepW(eid, d){
  const e = ensureEx(eid);
  e.w = Math.max(0, Math.round(((+e.w||0)+d)*10)/10);
  save(); renderTrain();
}
function inpW(eid, v){ const e=ensureEx(eid); e.w = v===''?null:+v; save(); }
function logSet(eid, si){
  const e = ensureEx(eid);
  const wEl = document.getElementById(`w_${eid}_${si}`);
  const rEl = document.getElementById(`r_${eid}_${si}`);
  const sEl = document.getElementById(`s_${eid}_${si}`);
  if(wEl && wEl.value!=='') e.w = +wEl.value;
  if(rEl) e.r = rEl.value;
  if(sEl && sEl.value!=='') e.s = +sEl.value;
  const d = todayISO();
  const entry = {d, w:e.w, r:e.r, s:e.s};
  if(e.hist.length && e.hist[e.hist.length-1].d === d) e.hist[e.hist.length-1] = entry;
  else e.hist.push(entry);
  if(e.hist.length>60) e.hist = e.hist.slice(-60);
  save(); toast(t('saved')); renderTrain();
}

/* ================= Calculator ================= */
const PAL_ROWS = [
  {k:'pal_sleep', v:0.95}, {k:'pal_lying', v:1.2}, {k:'pal_sitting', v:1.3},
  {k:'pal_sitstand', v:1.6}, {k:'pal_standing', v:1.8}, {k:'pal_hard', v:2.0},
];
const REFEED = [
  {bf:'>30', m:'1', f:'1', lo:30, hi:200},
  {bf:'25–30', m:'1', f:'1–2', lo:25, hi:30},
  {bf:'22–24', m:'1', f:'2', lo:22, hi:25},
  {bf:'18–21', m:'1', f:'2–3', lo:18, hi:22},
  {bf:'15–17', m:'2', f:'3', lo:15, hi:18},
  {bf:'12–14', m:'2–3', f:'–', lo:12, hi:15},
  {bf:'<12', m:'3', f:'–', lo:0, hi:12},
];
function calcAll(){
  const c = S.calc;
  const w=+c.weight, hgt=+c.height, a=+c.age, goal=+c.goal;
  const bmrH = c.gender==='m' ? 66.5+13.7*w+5*hgt-6.8*a : 655+9.6*w+1.8*hgt-4.7*a;
  const bmrS = c.gender==='m' ? 24*w : 22*w;
  const bmrMean = (bmrH+bmrS)/2;
  const hours = c.palH.reduce((x,y)=>x+(+y||0),0);
  const pal = hours>0 ? c.palH.reduce((acc,hh,i)=>acc+(+hh||0)*PAL_ROWS[i].v,0)/hours : 1.4;
  const tdee = bmrH*pal;
  const goalBurn = (30+pal)*goal;
  const maint = (tdee+goalBurn)/2;
  const intake = maint*(1-(+c.deficit||0)/100);
  const defDay = maint-intake;
  const jogWeek = (+c.jogS||0)*(+c.jogK||0);
  const weekDef = defDay*7;
  return {bmrH,bmrS,bmrMean,hours,pal,tdee,goalBurn,maint,intake,defDay,weekDef,
    lossWeek:weekDef/7000, lossWeekJog:(weekDef+jogWeek)/7000, weekKcal:intake*7, jogWeek};
}
function macroCalc(kcal){
  const c=S.calc, w=+c.weight;
  if(c.macroMode==='auto'){
    const pg = c.ppk*w, fg = c.fpk*w;
    const pk = pg*4.1, fk = fg*9.1;
    const cg = Math.max(0,(kcal-pk-fk)/4.1);
    return {p:pg,f:fg,c:cg,pk,fk,ck:cg*4.1};
  }else{
    const pk=kcal*c.mp/100, fk=kcal*c.mf/100, ck=kcal*c.mc/100;
    return {p:pk/4.1,f:fk/9.1,c:ck/4.1,pk,fk,ck};
  }
}

  const rf = REFEED.find(r=> +c.bf>=r.lo && +c.bf<r.hi) || REFEED[0];

      <input type="range" min="0" max="16" step="0.5" value="${c.palH[i]}" oninput="S.calc.palH[${i}]=+this.value;save();renderCalc()">

const MEAS_TYPES = ['gewicht','bauch','brust','taille','huefte','po','hals','oberarm_links','oberarm_rechts','oberschenkel_links','oberschenkel_rechts','wade_links','wade_rechts'];
function renderMeas(){
  const type = S.measType;
  const arr = (S.meas[type]||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  const unit = type==='gewicht'?t('kg'):t('cm');
  let h = `<h2>${esc(t('meas_title'))}</h2><div class="chips">`;
  for(const mt of MEAS_TYPES){
    const n = (S.meas[mt]||[]).length;
    h += `<button class="chip ${mt===type?'on':''}" onclick="S.measType='${mt}';save();renderMeas()">${esc(t('m_'+mt))}${n?` (${n})`:''}</button>`;
  }
  h += `</div>
  <div class="card"><div class="exrow" style="margin-top:0">
    <div class="fld" style="flex:1.3"><label>${esc(t('date'))}</label><input type="date" id="measDate" value="${todayISO()}"></div>
    <div class="fld"><label>${esc(t('value'))} (${unit})</label><input type="number" inputmode="decimal" step="0.1" id="measVal" placeholder="0,0"></div>
    <button class="btn savebtn" onclick="addMeas()">✓</button>
  </div></div>`;
  if(arr.length>=2){
    const delta = arr[arr.length-1].v - arr[0].v;
    h += `<div class="tiles" style="margin-bottom:12px">
      <div class="tile"><div class="tv">${fmt(arr[arr.length-1].v, 1)} <span class="tu">${unit}</span></div><div class="tl">${esc(t('last'))} · ${fmtDate(arr[arr.length-1].d)}</div></div>
      <div class="tile"><div class="tv" style="color:${delta<=0?'var(--good)':'var(--bad)'}">${delta>0?'+':''}${fmt(delta,1)} <span class="tu">${unit}</span></div><div class="tl">${esc(t('since_start'))}</div></div>
    </div>`;
  }
  h += `<div class="card"><div class="legend" id="legend"></div><div class="chartbox" id="chart" style="position:relative"></div></div>`;
  if(arr.length){
    h += `<div class="card"><h3 style="margin-top:0">${esc(t('entries'))}</h3>`;
    const recent = arr.slice().reverse().slice(0,15);
    for(const e of recent){
      const idx = (S.meas[type]||[]).findIndex(x=>x.d===e.d && x.v===e.v);
      h += `<div class="list-item"><span>${fmtDate(e.d)}</span><span style="font-weight:650;font-variant-numeric:tabular-nums">${fmt(e.v,1)} ${unit}</span><button class="del" onclick="delMeas(${idx})">✕</button></div>`;
    }
    h += `</div>`;
  }
  document.getElementById('v-meas').innerHTML = h;
  drawChart(arr, unit);
}
function addMeas(){
  const d = document.getElementById('measDate').value;
  const v = parseFloat(document.getElementById('measVal').value);
  if(!d || isNaN(v)) return;
  S.meas[S.measType] = S.meas[S.measType]||[];
  const arr = S.meas[S.measType];
  const ex = arr.findIndex(x=>x.d===d);
  if(ex>=0) arr[ex].v = v; else arr.push({d,v});
  save(); toast(t('saved')); renderMeas();
}
function delMeas(idx){
  if(idx<0) return;
  S.meas[S.measType].splice(idx,1);
  save(); renderMeas();
}
function drawChart(arr, unit){
  const box = document.getElementById('chart');
  const leg = document.getElementById('legend');
  if(!box) return;
  if(arr.length<2){ box.innerHTML = `<div class="note" style="padding:20px 0;text-align:center">${esc(t('no_data'))}</div>`; leg.innerHTML=''; return; }
  const W = Math.max(300, box.clientWidth||340), H = 220;
  const padL=38, padR=12, padT=14, padB=26;
  const xs = arr.map(e=>new Date(e.d+'T12:00:00').getTime());
  const ys = arr.map(e=>e.v);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=(y1-y0)*0.15||1; y0-=pad; y1+=pad;
  const X=v=>padL+(v-x0)/(x1-x0||1)*(W-padL-padR);
  const Y=v=>padT+(1-(v-y0)/(y1-y0||1))*(H-padT-padB);
  // 7-day rolling average
  const avg = arr.map((e,i)=>{
    const t0 = xs[i]-6.5*86400000;
    const win = arr.filter((_,j)=>xs[j]>=t0 && xs[j]<=xs[i]);
    return win.reduce((a,b)=>a+b.v,0)/win.length;
  });
  const cs = getComputedStyle(document.documentElement);
  const cLine = cs.getPropertyValue('--accent').trim();
  const cMut = cs.getPropertyValue('--muted').trim();
  const cGrid = cs.getPropertyValue('--grid').trim();
  const cAxis = cs.getPropertyValue('--axis').trim();
  const cInk2 = cs.getPropertyValue('--ink2').trim();
  let svg = `<svg viewBox="0 0 ${W} ${H}" id="csvg">`;
  const steps=4;
  for(let i=0;i<=steps;i++){
    const yv=y0+(y1-y0)*i/steps, yy=Y(yv);
    svg += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="${cGrid}" stroke-width="1"/>
      <text x="${padL-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="${cMut}" style="font-variant-numeric:tabular-nums">${fmt(yv,1)}</text>`;
  }
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="${cAxis}" stroke-width="1"/>`;
  const nTicks = Math.min(5, arr.length);
  for(let i=0;i<nTicks;i++){
    const idx = Math.round(i*(arr.length-1)/(nTicks-1||1));
    svg += `<text x="${X(xs[idx])}" y="${H-8}" text-anchor="middle" font-size="10" fill="${cMut}">${fmtDate(arr[idx].d)}</text>`;
  }
  const path = arr.map((e,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(e.v).toFixed(1)}`).join('');
  const apath = arr.map((e,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(avg[i]).toFixed(1)}`).join('');
  svg += `<path d="${apath}" fill="none" stroke="${cMut}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
  svg += `<path d="${path}" fill="none" stroke="${cLine}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const li = arr.length-1;
  svg += `<circle cx="${X(xs[li])}" cy="${Y(ys[li])}" r="4" fill="${cLine}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(X(xs[li]), W-padR-4)}" y="${Y(ys[li])-9}" text-anchor="end" font-size="11" font-weight="600" fill="${cInk2}">${fmt(ys[li],1)} ${unit}</text>`;
  svg += `<circle id="hovpt" r="4" fill="${cLine}" stroke="var(--surface)" stroke-width="2" style="display:none"/>
    <line id="hovln" y1="${padT}" y2="${H-padB}" stroke="${cAxis}" stroke-width="1" style="display:none"/>`;
  svg += `</svg><div class="tooltip" id="ctip" style="display:none"></div>`;
  box.innerHTML = svg;
  leg.innerHTML = `<span><span class="sw" style="background:${cLine}"></span>${esc(t('chart_daily'))}</span>
    <span><span class="sw" style="background:${cMut}"></span>${esc(t('chart_avg'))}</span>`;
  const svgEl = document.getElementById('csvg');
  const tip = document.getElementById('ctip');
  const hp = document.getElementById('hovpt'), hl = document.getElementById('hovln');
  function onMove(ev){
    const r = svgEl.getBoundingClientRect();
    const px = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left;
    const relX = px / r.width * W;
    let best=0, bd=1e18;
    xs.forEach((x,i)=>{ const d=Math.abs(X(x)-relX); if(d<bd){bd=d;best=i;} });
    const bx = X(xs[best])/W*r.width, by = Y(ys[best])/H*r.height;
    hp.style.display='';hl.style.display='';
    hp.setAttribute('cx',X(xs[best])); hp.setAttribute('cy',Y(ys[best]));
    hl.setAttribute('x1',X(xs[best])); hl.setAttribute('x2',X(xs[best]));
    tip.style.display='';
    tip.innerHTML = `<b>${fmt(ys[best],1)} ${unit}</b> · ${fmtDate(arr[best].d)}<br><span style="color:var(--muted)">${esc(t('chart_avg'))}: ${fmt(avg[best],1)}</span>`;
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(r.width-tw, bx-tw/2)) + 'px';
    tip.style.top = Math.max(0, by-58) + 'px';
  }
  function onOut(){ tip.style.display='none'; hp.style.display='none'; hl.style.display='none'; }
  svgEl.addEventListener('mousemove', onMove);
  svgEl.addEventListener('touchstart', onMove, {passive:true});
  svgEl.addEventListener('touchmove', onMove, {passive:true});
  svgEl.addEventListener('mouseleave', onOut);
  svgEl.addEventListener('touchend', onOut);
}

function renderFood(){
  let h = `<div class="subtabs">
    ${['top','db','recipes','shop'].map(k=>`<button class="subtab ${S.foodTab===k?'on':''}" onclick="S.foodTab='${k}';save();renderFood()">${esc(t('food_'+(k==='db'?'db':k)))}</button>`).join('')}
  </div>`;
  if(S.foodTab==='top'){
    const N = DATA.nutrition;
    const macroVal = (fc, it) => {
      if(fc.key==='protein') return {v:it.p, u:t('g_protein')};
      if(fc.key==='carbs') return {v:it.c, u:t('g_carbs')};
      if(fc.key==='fat') return {v:it.f, u:t('g_fat')};
      return null;
    };
    const foodCard = (it, fc) => {
      const mv = macroVal(fc, it);
      const val = mv ? `<b>${fmt(mv.v, mv.v%1?1:0)}</b> ${mv.u}` : `<b>${fmt(it.k)}</b> ${t('kcal')}`;
      const nn = it.note ? `<div class="fnote">${esc(t('fnote_'+it.note))}</div>` : '';
      return `<div class="fcard">
        <div class="fic">${it.ic}</div>
        <div class="fbody"><div class="fname">${esc(it.n)}</div>
          <div class="fval">${val} <span class="fmuted">· ${esc(t('per100'))}</span></div>${nn}</div>
      </div>`;
    };
    // Makronährstoffe
    h += `<h2 style="margin-top:4px">${esc(t('sec_macros'))}</h2>`;
    for(const fc of N.macroCats){
      h += `<div class="card"><h3 style="margin-top:0">${esc(t('fcat_'+fc.key))}</h3><div class="fgrid">${fc.items.map(it=>foodCard(it,fc)).join('')}</div></div>`;
    }
    // Gemüse, Obst, Basics
    h += `<h2>${esc(t('sec_other'))}</h2>`;
    for(const fc of N.otherCats){
      h += `<div class="card"><h3 style="margin-top:0">${esc(t('fcat_'+fc.key))}</h3><div class="fgrid">${fc.items.map(it=>foodCard(it,fc)).join('')}</div></div>`;
    }
    // Mikronährstoffe
    const sex = S.calc.gender==='m' ? 'm' : 'f';
    h += `<h2>${esc(t('sec_micros'))}</h2><div class="note" style="margin:0 2px 10px">${esc(t('micro_intro'))}</div>`;
    for(const mi of N.micros){
      const rda = mi.rda[sex];
      h += `<details class="acc"><summary><span>${mi.icon} ${esc(t('micro_'+mi.key))}</span>
        <span class="note" style="font-weight:400">${fmt(rda)} ${mi.unit}/${t('today')}</span></summary><div class="accbody">
        <div class="statline"><span class="sl">${esc(t('micro_need'))} (${esc(t('mann_frau'))})</span>
          <span class="sv">${fmt(mi.rda.m)} / ${fmt(mi.rda.f)} ${mi.unit}</span></div>
        <table class="mini" style="margin-top:8px"><thead><tr><th></th><th class="num">${esc(t('per100'))}</th><th class="num">${esc(t('micro_for100'))}</th></tr></thead><tbody>`;
      for(const s of mi.sources){
        const grams = rda / s.v * 100;
        const gTxt = grams >= 1000 ? fmt(grams/1000,2)+' kg' : (grams>=100? fmt(grams):fmt(grams, grams<10?1:0))+' g';
        h += `<tr><td>${s.ic} ${esc(s.n)}</td><td class="num">${fmt(s.v, s.v%1?1:0)} ${mi.unit}</td><td class="num" style="font-weight:650;color:var(--accent)">${gTxt}</td></tr>`;
      }
      h += `</tbody></table>`;
      if(mi.tip) h += `<div class="note" style="margin-top:8px">💡 ${esc(t('tip_'+mi.tip))}</div>`;
      h += `</div></details>`;
    }
  }
  else if(S.foodTab==='db'){
    h += `<div class="note" style="margin:2px 2px 8px">${esc(t('db_hint'))}</div>
    <div class="searchrow">
      <input type="text" placeholder="${esc(t('search'))}" value="${esc(S.zQuery)}" oninput="S.zQuery=this.value;renderFood();this===document.activeElement||0" id="zq">
      <select style="flex:0 0 118px" onchange="S.zSort=this.value;save();renderFood()">
        ${['name','kcal','p','c','f'].map(k=>`<option value="${k}" ${S.zSort===k?'selected':''}>${esc(t('sort_'+(k==='name'?'name':(k==='kcal'?'kcal':k))))}</option>`).join('')}
      </select>
    </div><div class="card" style="padding:6px 12px">`;
    let list = DATA.zutaten.filter(z=>z.n.toLowerCase().includes(S.zQuery.toLowerCase()));
    if(S.zSort==='name') list.sort((a,b)=>a.n.localeCompare(b.n));
    else if(S.zSort==='kcal') list.sort((a,b)=>(b.k||0)-(a.k||0));
    else list.sort((a,b)=>(b[S.zSort]||0)-(a[S.zSort]||0));
    list = list.slice(0,80);
    for(const z of list){
      const i = DATA.zutaten.indexOf(z);
      h += `<div class="list-item" onclick="openPortion(${i})" style="cursor:pointer">

    h += `</div>`;

  else if(S.foodTab==='recipes'){

      h += `<div class="card recipecard" id="rc${i}" onclick="this.classList.toggle('open')">

        <div class="rc-name">${esc(r.name)}</div>
        <div class="rc-body">
          <b>${esc(t('ingredients'))}:</b> ${r.ing.map(esc).join(', ')}
          ${r.sp && r.sp.length? `<br><b>${esc(t('spices'))}:</b> ${r.sp.map(esc).join(', ')}`:''}
          ${r.txt? `<div class="rc-instr">${esc(r.txt)}</div>`:''}
        </div></div>`;
    });
  }
  else if(S.foodTab==='shop'){
    const order = ['Eiweißquelle','Kohlenhydrate','Fette','Gemüse','Obst','Basics & Vorrat'];
    for(const cat of order){
      const items = DATA.einkaufsliste[cat]||[];

      h += `<div class="card"><h3 style="margin-top:0">${esc(t('cat_'+cat))}</h3>`;

        h += `<label class="checkrow ${on?'done':''}"><input type="checkbox" ${on?'checked':''} onchange="S.shop['${esc(key).replace(/'/g,"\\'")}']=this.checked;save();renderFood()"><span>${esc(it)}</span></label>`;
      });
      h += `</div>`;
    }
    h += `<button class="btn sec" style="width:100%" onclick="S.shop={};save();renderFood()">${esc(t('shop_reset'))}</button>`;
  }
  document.getElementById('v-food').innerHTML = h;
  if(S.foodTab==='db'){ const q=document.getElementById('zq'); if(S.zQuery && q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} }

      <div class="seg">
        <button class="${S.lang==='de'?'on':''}" onclick="setLang('de')">Deutsch</button>
        <button class="${S.lang==='en'?'on':''}" onclick="setLang('en')">English</button>
        <button class="${S.lang==='es'?'on':''}" onclick="setLang('es')">Español</button>
      </div></div>
    <div class="fld"><label>${esc(t('theme'))}</label>
      <div class="seg">
        <button class="${S.theme==='auto'?'on':''}" onclick="setTheme('auto')">${esc(t('theme_auto'))}</button>
        <button class="${S.theme==='light'?'on':''}" onclick="setTheme('light')">${esc(t('theme_light'))}</button>
        <button class="${S.theme==='dark'?'on':''}" onclick="setTheme('dark')">${esc(t('theme_dark'))}</button>
      </div></div>
  </div>
  <div class="card"><h3 style="margin-top:0">${esc(t('backup'))}</h3>
    <div class="note" style="margin-bottom:10px">${esc(t('backup_note'))}</div>
    <div class="rowflex">
      <button class="btn" onclick="exportData()">⬇ ${esc(t('export_btn'))}</button>
      <button class="btn sec" onclick="document.getElementById('impfile').click()">⬆ ${esc(t('import_btn'))}</button>
    </div>
    <input type="file" id="impfile" accept=".json,application/json" style="display:none" onchange="importData(this)">
    <div class="divider"></div>
    <button class="btn sec" style="width:100%;color:var(--bad)" onclick="resetAll()">${esc(t('reset_btn'))}</button>
  </div>`;
  document.getElementById('v-more').innerHTML = h;
}
function setLang(l){ S.lang=l; save(); renderAll(); }
function setTheme(th){
  S.theme=th; save();
  if(th==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', th);
  renderAll();
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hausi-fit-backup-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const obj = JSON.parse(rd.result);
      if(!obj.ex && !obj.meas) throw new Error('bad');
      S = Object.assign(defaultState(), obj);
      save(); toast(t('import_ok'));
      setTheme(S.theme); renderAll();
    }catch(e){ toast(t('import_err')); }
  };
  rd.readAsText(f);
  inp.value='';
}
function resetAll(){
  if(!confirm(t('reset_confirm'))) return;
  localStorage.removeItem(LS_KEY);
  S = defaultState(); save(); setTheme(S.theme); renderAll();
}

/* ================= Shell ================= */
const TABS = [
  {id:'train', ico:'🏋️'}, {id:'calc', ico:'🔢'}, {id:'meas', ico:'📈'}, {id:'food', ico:'🥦'}, {id:'more', ico:'☰'},
];
let activeTab = 'train';
function renderTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(tb=>
    `<button class="${activeTab===tb.id?'on':''}" onclick="showTab('${tb.id}')"><span class="ico">${tb.ico}</span>${esc(t('tab_'+tb.id))}</button>`).join('');
}
function showTab(id){
  activeTab = id;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+id).classList.add('active');
  renderTabs();
  if(id==='train') renderTrain();
  if(id==='calc') renderCalc();
  if(id==='meas') renderMeas();
  if(id==='food') renderFood();
  if(id==='more') renderMore();
  window.scrollTo(0,0);
}
function renderAll(){
  const dateStr = new Date().toLocaleDateString(S.lang==='de'?'de-DE':(S.lang==='es'?'es-ES':'en-US'),{weekday:'long', day:'numeric', month:'long'});
  document.getElementById('hsub').innerHTML = `<span class="syncdot ${syncState==='ok'?'ok':(syncState==='err'?'err':'')}" id="syncdot"></span>` + esc(dateStr);
  renderLogin();
  document.getElementById('langbtn').textContent = S.lang.toUpperCase();
  renderTabs(); showTab(activeTab);
}
document.getElementById('langbtn').onclick = ()=>{
  const order=['de','en','es'];
  setLang(order[(order.indexOf(S.lang)+1)%order.length]);
};
document.getElementById('themebtn').onclick = ()=>{
  const cur = S.theme==='auto' ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : S.theme;
  setTheme(cur==='dark'?'light':'dark');
};
/* Select-all on focus: tap a field and type straight over the old value */
document.addEventListener('focusin', (e)=>{
  const el = e.target;
  if(!(el instanceof HTMLInputElement)) return;
  if(el.type==='number' || (el.type==='text' && el.closest('.numwrap'))){
    setTimeout(()=>{ try{ el.select(); }catch(_){ } }, 0);
  }
});
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme', S.theme);
renderAll();
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
         sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDYhquqdbn5fV3kmyZUy9K0xZYmXmbZ8No",
  authDomain: "hausi-fit.firebaseapp.com",
  projectId: "hausi-fit",
  storageBucket: "hausi-fit.firebasestorage.app",
  messagingSenderId: "1035964548183",
  appId: "1:1035964548183:web:0f006faf79a759484e0f12"
};

try{
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  window.FB = {
    saveState: (uid, json, ts) => setDoc(doc(db, 'users', uid, 'app', 'state'), {json, ts, v:1}),
    loadState: async (uid) => {
      const snap = await getDoc(doc(db, 'users', uid, 'app', 'state'));
      return snap.exists() ? snap.data() : null;
    },
    signInEmail: (e,p) => signInWithEmailAndPassword(auth, e, p),
    registerEmail: (e,p) => createUserWithEmailAndPassword(auth, e, p),
    signInGoogle: async () => {
      const prov = new GoogleAuthProvider();
      try{ await signInWithPopup(auth, prov); }
      catch(e){
        const c = ''+(e && e.code);
        if(c.includes('popup-blocked') || c.includes('operation-not-supported') || c.includes('cancelled-popup-request')){
          await signInWithRedirect(auth, prov);
        } else if(!c.includes('popup-closed')) { throw e; }
      }
    },
    resetPw: (e) => sendPasswordResetEmail(auth, e),
    signOut: () => signOut(auth),
  };
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth, (u) => { try{ window.onAuth(u); }catch(e){ console.error(e); } });
}catch(e){
  console.error('Firebase init failed', e);
  try{ window.onAuth(null); }catch(_){ }
}
</script>
