        h += `<tr><td><button class="cartbtn ${inCart?'on':''}" onclick="toggleCart('${nEsc}')">🛒</button> ${s.ic} ${esc(tc(s.n))}</td>
          <td class="num">${fmt(s.v, s.v%1?1:0)} ${mi.unit}</td>
          <td class="num" style="font-weight:650;color:var(--accent)">${gTxt}</td>
          <td class="num"><input type="number" inputmode="numeric" class="amtin" value="${amt||''}" placeholder="0" onfocus="this.select()" onchange="setMicroAmt('${nEsc}',this.value)">${amt&&(DATA.kcalDB||{})[s.n]? `<div class="note" style="font-size:10px;margin-top:2px;white-space:nowrap">${fmt(amt*DATA.kcalDB[s.n].k/100)} ${t('kcal')}</div>`:''}</td></tr>`;
      }
      h += `</tbody></table>`;
      if(mi.tip) h += `<div class="note" style="margin-top:8px">💡 ${esc(t('tip_'+mi.tip))}</div>`;
      h += `</div></details>`;
    }
  }
  else if(S.foodTab==='myday'){
    const md=S.myday;
    if(!md.kcalMan) md.kcal=Math.round(calcAll().intake);
    if(!md.protMan) md.prot=Math.round(macroCalc(md.kcal).p);
    h += `<h2 style="margin-top:4px">${esc(t('myday_title'))}</h2><div class="note" style="margin:0 2px 10px">${esc(t('myday_sub'))}</div>`;
    h += `<div class="card"><div style="display:flex;gap:10px">
      <div class="fld" style="flex:1;margin:0"><label>${esc(t('myday_kcal'))}</label><input type="number" inputmode="numeric" value="${md.kcal}" onfocus="this.select()" onchange="S.myday.kcal=+this.value||0;S.myday.kcalMan=true;save()"></div>
      <div class="fld" style="flex:1;margin:0"><label>${esc(t('myday_protein'))}</label><input type="number" inputmode="numeric" value="${md.prot}" onfocus="this.select()" onchange="S.myday.prot=+this.value||0;S.myday.protMan=true;save()"></div>
    </div>${(md.kcalMan||md.protMan)? `<button class="btn sec" style="width:100%;margin-top:8px;font-size:12.5px" onclick="S.myday.kcalMan=false;S.myday.protMan=false;save();renderFood()">↻ ${esc(t('myday_sync'))}</button>`:''}</div>`;
    h += `<h3 style="margin:10px 2px 2px">${esc(t('myday_pick'))}</h3><div class="note" style="margin:0 2px 6px">${esc(t('myday_pick_hint'))}</div>`;
    const NN=DATA.nutrition;
    if(!md.extOpen) md.extOpen={};
    const chip = it => { const st=md.sel[it.n]||0; const nEsc=esc(it.n).replace(/'/g,"\\'");
      return `<button class="pickchip ${st===2?'must':(st?'on':'')}" onclick="toggleMydaySel('${nEsc}')">${st===2?'⭐ ':''}${it.ic} ${esc(tc(it.n))}</button>`; };
    for(const grp of ['macroCats','otherCats']) for(const cat of NN[grp]){
      h += `<div class="card" style="padding:10px 12px"><h3 style="margin:0 0 4px;font-size:13px">${esc(t('fcat_'+cat.key))}</h3><div>`;
      for(const it of cat.items){ if(!it.k) continue; h += chip(it); }
      const extra = (DATA.foodsExt||[]).filter(x=>x.cat===cat.key && x.k);
      const selExtra = extra.filter(x=>md.sel[x.n]);
      if(selExtra.length && !md.extOpen[cat.key]) selExtra.forEach(x=>h+=chip(x));
      if(extra.length){
        if(md.extOpen[cat.key]) extra.filter(x=>!selExtra.includes(x)).forEach(x=>h+=chip(x));
        h += `<button class="pickchip" style="border-style:dashed;opacity:.85" onclick="toggleExtCat('${cat.key}')">${md.extOpen[cat.key]? '▾ '+esc(t('myday_less')) : '＋ '+esc(t('myday_more'))+' ('+extra.length+')'}</button>`;
      }
      h += `</div></div>`;
    }
    if(!md.minAmt) md.minAmt={};
    if(!md.maxAmt) md.maxAmt={};
    const selNames = Object.keys(md.sel).filter(n=>md.sel[n]);
    if(selNames.length){
      h += `<div class="card" style="padding:10px 12px"><h3 style="margin:0 0 2px;font-size:13px">${esc(t('myday_minamt_title'))}</h3>
        <div class="note" style="margin:0 0 6px">${esc(t('myday_minamt_note'))}</div>
        <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:2px"><span class="note" style="width:64px;text-align:center">${esc(t('myday_min'))}</span><span class="note" style="width:64px;text-align:center">${esc(t('myday_max'))}</span></div>`;
      const afAll = mydayAllFoods();
      for(const n of selNames){
        const f = afAll.find(x=>x.n===n); if(!f) continue;
        const dmin = MYDAY_SPECIAL[n]?MYDAY_SPECIAL[n][0]:(MYDAY_MINUSE[f.cat]||20);
        const dmax = MYDAY_SPECIAL[n]?MYDAY_SPECIAL[n][1]:(MYDAY_MAX[f.cat]||300);
        const um = +md.minAmt[n]||0, ux = +md.maxAmt[n]||0;
        const nEsc = esc(n).replace(/'/g,"\\'");
        h += `<div class="statline" style="padding:3px 0"><span class="sl" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.ic} ${esc(tc(n))}</span>
          <span style="display:flex;gap:6px;flex:0 0 auto">
            <input type="number" inputmode="numeric" class="amtin" style="width:64px" value="${um||''}" placeholder="${dmin}" onfocus="this.select()" onchange="setMydayMin('${nEsc}',this.value)">
            <input type="number" inputmode="numeric" class="amtin" style="width:64px" value="${ux||''}" placeholder="${dmax}" onfocus="this.select()" onchange="setMydayMax('${nEsc}',this.value)">
          </span></div>`;
      }
      h += `</div>`;
    }
    h += `<button class="btn" style="width:100%;margin-top:6px" onclick="calcMyday()">${esc(t('myday_calc'))}</button>`;
    const R = window._mydayRes;
    if(R===false) h += `<div class="note" style="text-align:center;margin-top:8px">${esc(t('myday_few'))}</div>`;
    else if(R){
      h += `<h3 id="mydayres" style="margin:16px 2px 2px">${esc(t('myday_result'))}</h3><div class="note" style="margin:0 2px 6px">${esc(t('myday_rowhint'))}</div>`;
      /* default view: flat ingredient list for the day */
      h += `<div class="card" style="padding:8px 12px"><table class="mini"><thead><tr><th></th><th class="num">${esc(t('myday_amount'))}</th><th class="num">${esc(t('kcal'))}</th></tr></thead><tbody>`;
      R.foods.forEach((f,i)=>{ if(R.g[i]<=0) return;
        const gr=R.g[i];
        const pr=(DATA.microDB&&DATA.microDB[f.n])||{};
        const mParts = R.micros.map((m,j)=>{
          const amt = gr*(pr[MKEY[m.key]]||0)/100;
          return {m, amt, pct:Math.round(amt/R.rda[m.key]*100)};
        }).filter(x=>x.pct>=3);
        let det = `<b>${esc(t('protein'))}</b> ${fmt(gr*f.p/100,1)} g · <b>${esc(t('carbs'))}</b> ${fmt(gr*f.c/100,1)} g · <b>${esc(t('fat'))}</b> ${fmt(gr*f.f/100,1)} g`;
        if(mParts.length) det += '<br>' + mParts.map(x=>`${x.m.icon} ${esc(t('micro_'+x.m.key))}: ${fmt(x.amt, x.amt<10?1:0)} ${x.m.unit} (<b style="color:${x.pct>=100?'#2e9e5b':'var(--accent)'}">${x.pct} %</b>)`).join(' · ');
        else det += `<br><span class="note">${esc(t('myday_nomicro'))}</span>`;
        h += `<tr onclick="toggleMydayRow(${i})" style="cursor:pointer"><td>${f.ic} ${esc(tc(f.n))} <span class="note">▾</span></td>
          <td class="num" style="font-weight:650">${fmt(gr)} g${convLine(f.n, gr)}</td>
          <td class="num">${fmt(gr*f.k/100)}</td></tr>
          <tr class="mdetrow" id="mdet${i}" style="display:none"><td colspan="3">${det}</td></tr>`;
      });
      h += `<tr><td style="font-weight:700">${esc(t('myday_total'))}</td><td class="num" style="font-weight:650">P ${fmt(R.T.p)} · C ${fmt(R.T.c)} · F ${fmt(R.T.f)}</td><td class="num" style="font-weight:700">${fmt(R.T.k)}</td></tr></tbody></table></div>`;
      /* collapsed meal suggestion with warm/cold choice */
      const meals = composeMeals(R);
      const mainsN = MEAL_SLOTS[Math.min(5,Math.max(3,+S.calc.meals||4))].filter(k=>k!=='snack').length;
      const curWarm = (S.myday.warm===undefined||S.myday.warm===null)?2:+S.myday.warm;
      h += `<details class="acc" ${S.myday.mealsOpen?'open':''} ontoggle="S.myday.mealsOpen=this.open">
        <summary><span>💡 ${esc(t('myday_mealsugg').replace('{n}', meals.length))}</span></summary><div class="accbody">`;
      h += `<div style="display:flex;align-items:center;gap:8px;margin:2px 0 10px"><span class="note">${esc(t('myday_warm'))}:</span>
        ${Array.from({length:mainsN+1},(_,n)=>`<button class="pickchip ${curWarm===n?'on':''}" onclick="S.myday.warm=${n};save();renderFood()">${n}× 🔥</button>`).join('')}</div>`;
      meals.forEach(slot=>{
        const ttl = mealTitle(slot);
        h += `<div class="card" style="padding:8px 12px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
            <b>${slot.warm?'🔥 ':''}${esc(t(slot.key))}${ttl? ' · <span style="color:var(--accent)">'+esc(ttl)+'</span>':''}</b>
            <span class="note">${fmt(slot.kcal)} ${t('kcal')}</span></div>
          <table class="mini"><tbody>`;
        slot.items.forEach(itm=>{
          h += `<tr><td>${itm.ic} ${esc(tc(itm.n))}</td><td class="num" style="font-weight:650">${fmt(itm.g)} g${convLine(itm.n, itm.g)}</td><td class="num">${fmt(itm.g*itm.k/100)}</td></tr>`;
        });
        h += `</tbody></table></div>`;
      });
      h += `</div></details>`;
      const bar=(label,pct,corr)=>{ let col;
        if(corr){ col = (pct>=90&&pct<=115)?'#2e9e5b':((pct>=70&&pct<135)?'var(--accent)':'#d9822b'); }
        else{ col = pct>=100?'#2e9e5b':(pct>=70?'var(--accent)':'#d9822b'); }
        return `<div class="covrow"><span class="cl">${label}</span><div class="cb"><div style="width:${Math.min(100,pct)}%;background:${col}"></div></div><span class="cv" style="color:${col}">${pct>999?'999+':Math.round(pct)} %</span></div>`; };
      h += `<div class="card"><h3 style="margin-top:0">${esc(t('myday_cov'))}</h3>`;
      h += bar(esc(t('kcal')), R.T.k/(+S.myday.kcal||1)*100, true);
      h += bar(esc(t('protein'))+' ~'+fmt(R.P||+S.myday.prot)+' g', R.T.p/(R.P||+S.myday.prot||1)*100, true);
      h += bar(esc(t('carbs'))+' ~'+fmt(R.C||0)+' g', R.T.c/Math.max(R.C||1,1)*100, true);
      h += bar(esc(t('fat'))+' ~'+fmt(R.Fmin)+' g', R.T.f/R.Fmin*100, true);
      h += bar('🌾 '+esc(t('fiber'))+' ~'+fmt(R.Ftarget)+' g', R.T.fi/Math.max(R.Ftarget,1)*100);
      h += `<div style="height:1px;background:var(--line,#8883);margin:8px 0"></div>`;
      R.micros.forEach((m,j)=>{
        const lbl = m.icon+' '+esc(t('micro_'+m.key)) + (MICRO_SUPP.has(m.key)? ' 💊':'');
        h += bar(lbl, R.T.mi[j]/R.rda[m.key]*100);
      });
      /* Ehrlichkeit: sagen, was NICHT geprüft wird */
      h += `<div class="note" style="margin-top:8px">${esc(t('myday_untracked'))}</div>`;
      h += `<div class="note" style="margin-top:6px">${esc(t('myday_hint'))}</div></div>`;
      /* Kennzahlen, die bei einem wochenlang gleichen Plan zählen */
      h += `<div class="card" style="padding:10px 14px">
        <div class="statline"><span class="sl">🍽️ ${esc(t('myday_volume'))}</span><span class="sv">${fmt(R.T.g/1000,1)} kg</span></div>
        <div class="statline"><span class="sl">🌱 ${esc(t('myday_plants'))}</span><span class="sv">${R.plantCount} / ${R.diversity}</span></div>
        <div class="statline"><span class="sl">💡 ${esc(t('myday_density'))}</span><span class="sv">${fmt(R.T.p/Math.max(R.T.k,1)*1000)} g / 1000 ${t('kcal')}</span></div></div>`;
      /* Sicherheits- und Qualitätshinweise */
      if(R.warns && R.warns.length){
        h += `<div class="card" style="padding:10px 14px;border-left:3px solid #d9822b"><h3 style="margin-top:0">🛡️ ${esc(t('myday_safety'))}</h3>`;
        for(const w of R.warns){
          let txt='';
          if(w.type==='ul') txt = t('warn_ul').replace('{n}', t('micro_'+w.key)).replace('{v}', fmt(w.val)+' '+w.unit).replace('{ul}', fmt(w.ul)+' '+w.unit);
          else if(w.type==='lowcarb') txt = t('warn_lowcarb').replace('{v}', fmt(w.val));
          else if(w.type==='volume') txt = t('warn_volume').replace('{v}', fmt(w.val/1000,1));
          else if(w.type==='diversity') txt = t('warn_diversity').replace('{v}', w.val);
          else if(w.type==='rotation') txt = t('warn_rotation').replace('{f}', w.foods.map(n=>tc(n)).join(', '));
          h += `<div style="margin:6px 0;font-size:12.5px">${w.icon} ${esc(txt)}</div>`;
        }
        h += `</div>`;
      }
      if(R.gaps && R.gaps.length){
        h += `<div class="card"><h3 style="margin-top:0">⚠️ ${esc(t('myday_gaps'))}</h3><div class="note" style="margin:0 0 6px">${esc(t('myday_gaps_note'))}</div>`;
        for(const gp of R.gaps){
          h += `<div style="margin:10px 0 2px;font-weight:650">${gp.icon} ${esc(gp.macro? t(gp.key) : t('micro_'+gp.key))} <span style="color:#d9822b">${gp.cov} %</span></div>`;
          if(gp.sugg.length){
            h += `<div>`+gp.sugg.map(sg=>{ const nEsc=esc(sg.n).replace(/'/g,"\\'");
              return `<button class="pickchip" onclick="S.myday.sel['${nEsc}']=1;save();calcMyday()">＋ ${sg.ic} ${esc(tc(sg.n))}</button>`; }).join('')+`</div>`;
          }
          h += `<div class="note" style="margin-top:3px">💊 ${esc(t(gp.supp || ('msupp_'+gp.key)))}</div>`;
        }
        h += `</div>`;
      }
      h += `<button class="btn" style="width:100%" onclick="applyMydayCart()">🛒 ${esc(t('myday_tocart'))}</button>`;
      if(window._mydayAdded) h += `<div class="note" style="text-align:center;margin-top:6px">${esc(t('myday_added'))}</div>`;
    }
  }
  else if(S.foodTab==='db'){
    h += `<div class="note" style="margin:2px 2px 8px">${esc(t('db_hint'))}</div>
    <div class="searchrow">
      <input type="text" placeholder="${esc(t('search'))}" value="${esc(S.zQuery)}" oninput="S.zQuery=this.value;renderFood();this===document.activeElement||0" id="zq">
      <select style="flex:0 0 118px" onchange="S.zSort=this.value;save();renderFood()">
        ${['name','kcal','p','c','f'].map(k=>`<option value="${k}" ${S.zSort===k?'selected':''}>${esc(t('sort_'+(k==='name'?'name':(k==='kcal'?'kcal':k))))}</option>`).join('')}
      </select>
    </div><div class="card" style="padding:6px 12px">`;
    let list = DATA.zutaten.filter(z=>(z.n+' '+tc(z.n)).toLowerCase().includes(S.zQuery.toLowerCase()));
    if(S.zSort==='name') list.sort((a,b)=>tc(a.n).localeCompare(tc(b.n)));
    else if(S.zSort==='kcal') list.sort((a,b)=>(b.k||0)-(a.k||0));
    else list.sort((a,b)=>(b[S.zSort]||0)-(a[S.zSort]||0));
    list = list.slice(0,80);
    for(const z of list){
      const i = DATA.zutaten.indexOf(z);
      h += `<div class="list-item" onclick="openPortion(${i})" style="cursor:pointer">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tc(z.n))}</span>
        <span class="note" style="flex:0 0 auto;font-variant-numeric:tabular-nums">${fmt(z.k)} ${t('kcal')} · P ${fmt(z.p??0)} · C ${fmt(z.c??0)} · F ${fmt(z.f??0)}</span>
      </div>`;
    }
    h += `</div>`;
  }
  else if(S.foodTab==='recipes'){
    const cats = ['all','breakfast','lunch','dinner','snack'];
    h += `<div class="chips">${cats.map(cn=>`<button class="chip ${S.recipeCat===cn?'on':''}" onclick="S.recipeCat='${cn}';save();renderFood()">${esc(t(cn))}</button>`).join('')}</div>`;
    DATA.recipes.forEach((r,i)=>{
      if(S.recipeCat!=='all' && r.cat!==S.recipeCat) return;
      h += `<div class="card recipecard" id="rc${i}" onclick="this.classList.toggle('open')">
        <div class="rc-cat">${esc(t(r.cat))}</div>
        <div class="rc-name">${esc(tc(r.name))}</div>
        <div class="rc-body">
          <b>${esc(t('ingredients'))}:</b> ${r.ing.map(x=>esc(tc(x))).join(', ')}
          ${r.sp && r.sp.length? `<br><b>${esc(t('spices'))}:</b> ${r.sp.map(x=>esc(tc(x))).join(', ')}`:''}
          ${r.txt? `<div class="rc-instr">${esc(tc(r.txt))}</div>`:''}
        </div></div>`;
    });
  }
  else if(S.foodTab==='shop'){
    const cartItems = Object.keys(S.cart).filter(n=>S.cart[n]);
    h += `<div class="card"><h3 style="margin-top:0">🛒 ${esc(t('cart_title'))}</h3>`;
    if(!cartItems.length) h += `<div class="note">${esc(t('cart_empty'))}</div>`;
    else{
      cartItems.forEach(n=>{
        const key='cart|'+n; const on=!!S.shop[key];
        const amt=+S.microAmt[n]||0;
        h += `<label class="checkrow ${on?'done':''}"><input type="checkbox" ${on?'checked':''} onchange="S.shop['${esc(key).replace(/'/g,"\\'")}']=this.checked;save();renderFood()"><span>${esc(tc(n))}${amt?` <span class="note">(${fmt(amt)} g/${esc(t('today'))})</span>`:''}</span></label>`;
      });
      h += `<button class="btn sec" style="width:100%;margin-top:8px" onclick="S.cart={};save();renderFood()">${esc(t('cart_clear'))}</button>`;
    }
    h += `</div>`;
    const order = ['Eiweißquelle','Kohlenhydrate','Fette','Gemüse','Obst','Basics & Vorrat'];
    for(const cat of order){
      const items = DATA.einkaufsliste[cat]||[];
      if(!items.length) continue;
      h += `<div class="card"><h3 style="margin-top:0">${esc(t('cat_'+cat))}</h3>`;
      items.forEach((it)=>{
        const key = cat+'|'+it;
        const on = !!S.shop[key];
        h += `<label class="checkrow ${on?'done':''}"><input type="checkbox" ${on?'checked':''} onchange="S.shop['${esc(key).replace(/'/g,"\\'")}']=this.checked;save();renderFood()"><span>${esc(tc(it))}</span></label>`;
      });
      h += `</div>`;
    }
    h += `<button class="btn sec" style="width:100%" onclick="S.shop={};save();renderFood()">${esc(t('shop_reset'))}</button>`;
  }
  document.getElementById('v-food').innerHTML = h;
  if(S.foodTab==='db'){ const q=document.getElementById('zq'); if(S.zQuery && q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} }
}
function openPortion(i){
  const z = DATA.zutaten[i];
  let h = `<h3>${esc(tc(z.n))}</h3>
  <div class="fld"><label>${esc(t('portion'))} – ${esc(t('grams'))}</label>
  <input type="number" inputmode="numeric" value="100" id="pg" oninput="calcPortion(${i})"></div>
  <div id="pres" style="margin-top:12px"></div>
  <div style="margin-top:14px"><button class="btn sec" style="width:100%" onclick="closeModal()">${esc(t('close'))}</button></div>`;
  openModal(h); calcPortion(i);
}
function calcPortion(i){
  const z = DATA.zutaten[i];
  const g = parseFloat(document.getElementById('pg').value)||0;
  const f = g/100;
  document.getElementById('pres').innerHTML = `<table class="mini"><tbody>
    <tr><td>${esc(t('kcal'))}</td><td class="num"><b>${fmt((z.k||0)*f)}</b></td></tr>
    <tr><td>${esc(t('protein'))}</td><td class="num">${fmt((z.p||0)*f,1)} ${t('g')}</td></tr>
    <tr><td>${esc(t('carbs'))}</td><td class="num">${fmt((z.c||0)*f,1)} ${t('g')}</td></tr>
    <tr><td>${esc(t('fat'))}</td><td class="num">${fmt((z.f||0)*f,1)} ${t('g')}</td></tr>
    <tr><td>${esc(t('fiber'))}</td><td class="num">${fmt((z.fi||0)*f,1)} ${t('g')}</td></tr>
  </tbody></table>`;
}

/* ================= More ================= */
function renderMore(){
  let h = '';
  // ===== Wissen =====
  h += `<h2 style="margin-top:6px">${esc(t('know_title'))}</h2><div class="note" style="margin:0 2px 10px">${esc(t('know_sub'))}</div>`;
  for(const a of DATA.articles){
    h += `<details class="acc"><summary><span>${a.ic} ${esc(tc(a.title))}</span></summary><div class="accbody">
      <ul class="artlist">${a.points.map(p=>`<li>${esc(tc(p))}</li>`).join('')}</ul></div></details>`;
  }
  // ===== Supplemente =====
  h += `<h2>${esc(t('suppl_title'))}</h2><div class="note" style="margin:0 2px 10px">${esc(t('suppl_sub'))}</div>`;
  const suppCard = (s)=>`<div class="card" style="padding:12px 14px">
    <div style="display:flex;align-items:center;gap:10px"><div style="font-size:24px">${s.ic}</div>
      <div style="font-size:16px;font-weight:650">${esc(tc(s.name))}</div></div>
    <div style="margin-top:8px"><span class="suplbl">${esc(t('suppl_dose'))}</span> ${esc(tc(s.dose))}</div>
    <div style="margin-top:4px"><span class="suplbl">${esc(t('suppl_why'))}</span> ${esc(tc(s.why))}</div></div>`;
  h += `<h3 style="margin:6px 2px">✅ ${esc(t('suppl_top'))}</h3>`;
  DATA.supps.filter(s=>s.tag==='top').forEach(s=>h+=suppCard(s));
  h += `<h3 style="margin:12px 2px 6px">🔵 ${esc(t('suppl_sit'))}</h3>`;
  DATA.supps.filter(s=>s.tag==='situativ').forEach(s=>h+=suppCard(s));
  h += `<div class="note" style="margin:6px 2px 4px">${esc(t('suppl_disc'))}</div>`;
  // ===== Homeworkouts =====
  h += `<h2>${esc(t('hw_title'))}</h2>`;
  for(const hw of DATA.homeworkouts){
    h += `<details class="acc"><summary>${esc(t(hw.nameKey))}</summary><div class="accbody">`;
    if(hw.type==='circuit'){
      h += `<table class="mini"><thead><tr><th>${esc(t('exercise'))}</th><th class="num">${esc(t('duration'))}</th></tr></thead><tbody>`;
      hw.items.forEach(it=>{ h+=`<tr><td>${esc(tc(it.n))}</td><td class="num">${esc(tc(it.v))}</td></tr>`; });
      h += `</tbody></table>`;
      if(hw.note) h += `<div class="note" style="margin-top:8px">${esc(t(hw.note))}</div>`;
    }else if(hw.type==='sets'){
      h += `<table class="mini"><thead><tr><th>${esc(t('exercise'))}</th><th class="num">${esc(t('sets'))}</th><th class="num">${esc(t('reps'))}</th></tr></thead><tbody>`;
      hw.items.forEach(it=>{ h+=`<tr><td>${esc(tc(it.n))}</td><td class="num">${it.s}</td><td class="num">${esc(tc(it.r))}</td></tr>`; });
      h += `</tbody></table>`;
    }else{
      for(const c of hw.circuits){
        h += `<h3>${esc(tc(c.name))}</h3><table class="mini"><tbody>`;
        c.items.forEach(it=>{ h+=`<tr><td>${esc(tc(it.n))}</td><td class="num">${it.s} × ${esc(tc(it.r))}</td></tr>`; });
        h += `</tbody></table>`;
      }
      h += `<div class="note" style="margin-top:8px">${esc(t('hw_abs_note'))}</div>`;
    }
    h += `</div></details>`;
  }
  h += `<h2>${esc(t('account'))}</h2>
  <div class="card">
    <div class="statline"><span class="sl">${esc(t('logged_in_as'))}</span><span class="sv">${esc(cloudUser ? (cloudUser.email||'') : '–')}</span></div>
    <div class="note" style="margin:8px 0 12px">${esc(t('cloud_note'))}</div>
    <button class="btn sec" style="width:100%" onclick="doLogout()">${esc(t('logout'))}</button>
  </div>
  <h2>${esc(t('settings'))}</h2>
  <div class="card">
    <div class="fld" style="margin-bottom:10px"><label>${esc(t('language'))}</label>
      <div class="seg">
        <button class="${S.lang==='de'?'on':''}" onclick="setLang('de')">Deutsch</button>
        <button class="${S.lang==='en'?'on':''}" onclick="setLang('en')">English</button>
        <button class="${S.lang==='es'?'on':''}" onclick="setLang('es')">Español</button>
      </div></div>
    <div class="fld"><label>${esc(t('theme'))}</label>
      <div class="seg">
        <button class="${S.theme==='auto'?'on':''}" onclick="setTheme('auto')">${esc(t('theme_auto'))}</button>
        <button class="${S.theme==='light'?'on':''}" onclick="setTheme('light')">${esc(t('theme_light'))}</button>
        <button class="${S.theme==='dark'?'on':''}" onclick="setTheme('dark')">${esc(t('theme_dark'))}</button>
      </div></div>
  </div>
  <div class="card"><h3 style="margin-top:0">${esc(t('backup'))}</h3>
    <div class="note" style="margin-bottom:10px">${esc(t('backup_note'))}</div>
    <div class="rowflex">
      <button class="btn" onclick="exportData()">⬇ ${esc(t('export_btn'))}</button>
      <button class="btn sec" onclick="document.getElementById('impfile').click()">⬆ ${esc(t('import_btn'))}</button>
    </div>
    <input type="file" id="impfile" accept=".json,application/json" style="display:none" onchange="importData(this)">
    <div class="divider"></div>
    <button class="btn sec" style="width:100%;color:var(--bad)" onclick="resetAll()">${esc(t('reset_btn'))}</button>
  </div>`;
  document.getElementById('v-more').innerHTML = h;
}
function setLang(l){ S.lang=l; save(); renderAll(); }
function setTheme(th){
  S.theme=th; save();
  if(th==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', th);
  renderAll();
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hausi-fit-backup-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const obj = JSON.parse(rd.result);
      if(!obj.ex && !obj.meas) throw new Error('bad');
      S = Object.assign(defaultState(), obj);
      save(); toast(t('import_ok'));
      setTheme(S.theme); renderAll();
    }catch(e){ toast(t('import_err')); }
  };
  rd.readAsText(f);
  inp.value='';
}
function resetAll(){
  if(!confirm(t('reset_confirm'))) return;
  localStorage.removeItem(LS_KEY);
  S = defaultState(); save(); setTheme(S.theme); renderAll();
}

/* ================= Shell ================= */
const TABS = [
  {id:'home', ico:'🏠'}, {id:'train', ico:'🏋️'}, {id:'calc', ico:'🔢'}, {id:'meas', ico:'📈'}, {id:'food', ico:'🥦'}, {id:'more', ico:'☰'},
];
let activeTab = 'home';
function renderTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(tb=>
    `<button class="${activeTab===tb.id?'on':''}" onclick="showTab('${tb.id}')"><span class="ico">${tb.ico}</span>${esc(t('tab_'+tb.id))}</button>`).join('');
}
function showTab(id){
  activeTab = id;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+id).classList.add('active');
  renderTabs();
  if(id==='home') renderHome();
  if(id==='train') renderTrain();
  if(id==='calc') renderCalc();
  if(id==='meas') renderMeas();
  if(id==='food') renderFood();
  if(id==='more') renderMore();
  window.scrollTo(0,0);
}
function renderAll(){
  const dateStr = new Date().toLocaleDateString(S.lang==='de'?'de-DE':(S.lang==='es'?'es-ES':'en-US'),{weekday:'long', day:'numeric', month:'long'});
  document.getElementById('hsub').innerHTML = `<span class="syncdot ${syncState==='ok'?'ok':(syncState==='err'?'err':'')}" id="syncdot"></span>` + esc(dateStr);
  renderLogin();
  document.getElementById('langbtn').textContent = S.lang.toUpperCase();
  renderTabs(); showTab(activeTab);
}
document.getElementById('langbtn').onclick = ()=>{
  const order=['de','en','es'];
  setLang(order[(order.indexOf(S.lang)+1)%order.length]);
};
document.getElementById('themebtn').onclick = ()=>{
  const cur = S.theme==='auto' ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : S.theme;
  setTheme(cur==='dark'?'light':'dark');
};
/* Select-all on focus: tap a field and type straight over the old value */
document.addEventListener('focusin', (e)=>{
  const el = e.target;
  if(!(el instanceof HTMLInputElement)) return;
  if(el.type==='number' || (el.type==='text' && el.closest('.numwrap'))){
    setTimeout(()=>{ try{ el.select(); }catch(_){ } }, 0);
  }
});
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme', S.theme);
renderAll();
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
         sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDYhquqdbn5fV3kmyZUy9K0xZYmXmbZ8No",
  authDomain: "hausi-fit.firebaseapp.com",
  projectId: "hausi-fit",
  storageBucket: "hausi-fit.firebasestorage.app",
  messagingSenderId: "1035964548183",
  appId: "1:1035964548183:web:0f006faf79a759484e0f12"
};

try{
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  window.FB = {
    saveState: (uid, json, ts) => setDoc(doc(db, 'users', uid, 'app', 'state'), {json, ts, v:1}),
    loadState: async (uid) => {
      const snap = await getDoc(doc(db, 'users', uid, 'app', 'state'));
      return snap.exists() ? snap.data() : null;
    },
    signInEmail: (e,p) => signInWithEmailAndPassword(auth, e, p),
    registerEmail: (e,p) => createUserWithEmailAndPassword(auth, e, p),
    signInGoogle: async () => {
      const prov = new GoogleAuthProvider();
      try{ await signInWithPopup(auth, prov); }
      catch(e){
        const c = ''+(e && e.code);
        if(c.includes('popup-blocked') || c.includes('operation-not-supported') || c.includes('cancelled-popup-request')){
          await signInWithRedirect(auth, prov);
        } else if(!c.includes('popup-closed')) { throw e; }
      }
    },
    resetPw: (e) => sendPasswordResetEmail(auth, e),
    signOut: () => signOut(auth),
  };
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth, (u) => { try{ window.onAuth(u); }catch(e){ console.error(e); } });
}catch(e){
  console.error('Firebase init failed', e);
  try{ window.onAuth(null); }catch(_){ }
}
</script>
