ntequilla a ambas partes, agregar la lechuga, tomate, salsa bbq y el pollo\n4.\tDisfrutar":{"de":"1.\tDas Hähnchen in einen Topf mit Wasser bei mittlerer Hitze geben.\n2.\tWarten, bis es perfekt gegart ist, und beiseitestellen\n3.\tDein Sandwichbrot nehmen, beide Hälften mit Butter bestreichen, den Salat, die Tomate, die BBQ-Sauce und das Hähnchen hinzufügen\n4.\tGenießen","en":"1.\tPlace the chicken in a pot with water over medium heat.\n2.\tWait until it is perfectly cooked and set aside\n3.\tTake your sandwich bread, spread butter on both halves, add the lettuce, tomato, bbq sauce and the chicken\n4.\tEnjoy","es":"1.\tColocar el pollo en una olla con agua a fuego medio.\n2.\tEsperar hasta que esté cocinado perfectamente y reservar\n3.\tCoger tu pan de molde, untar mantequilla a ambas partes, agregar la lechuga, tomate, salsa bbq y el pollo\n4.\tDisfrutar"},"1.\tColocar el salmón en un sartén caliente\n2.\tDejar dorar por lado y lado por unos 10 minutos\n3.\tAgregar el sumo de una naranja, la salsa de soja, el ajo picado y la miel\n4.\tDejar por otros 10 minutos\n5.\tParalelamente hacer el arroz integral/ quinoa según indica el paquete\n6.\tHacer la ensalada\n7.\tEmplatar todo junto":{"de":"1.\tDen Lachs in eine heiße Pfanne geben\n2.\tVon beiden Seiten etwa 10 Minuten anbraten lassen\n3.\tDen Saft einer Orange, die Sojasauce, den gehackten Knoblauch und den Honig hinzufügen\n4.\tWeitere 10 Minuten ziehen lassen\n5.\tParallel den Vollkornreis/Quinoa nach Packungsanweisung kochen\n6.\tDen Salat zubereiten\n7.\tAlles zusammen anrichten","en":"1.\tPlace the salmon in a hot pan\n2.\tLet it brown on both sides for about 10 minutes\n3.\tAdd the juice of one orange, the soy sauce, the chopped garlic and the honey\n4.\tLeave for another 10 minutes\n5.\tMeanwhile, cook the brown rice/quinoa as the package indicates\n6.\tMake the salad\n7.\tPlate everything together","es":"1.\tColocar el salmón en un sartén caliente\n2.\tDejar dorar por lado y lado por unos 10 minutos\n3.\tAgregar el sumo de una naranja, la salsa de soja, el ajo picado y la miel\n4.\tDejar por otros 10 minutos\n5.\tParalelamente hacer el arroz integral/ quinoa según indica el paquete\n6.\tHacer la ensalada\n7.\tEmplatar todo junto"},"1.\tColocar la avena en una olla y llenarla con agua de tal manera que la cubra por completo\n2.\tLa cocinamos a fuego medio\n3.\tAgregar la mitad del banano machacado y dejar la otra mitad para decorar\n4.\tCuando la avena tiene la textura deseada sacar del fuego\n5.\tServir y decorar con tus toppings":{"de":"1.\tDie Haferflocken in einen Topf geben und so mit Wasser auffüllen, dass sie vollständig bedeckt sind\n2.\tBei mittlerer Hitze garen\n3.\tDie Hälfte der zerdrückten Banane hinzufügen und die andere Hälfte zum Garnieren aufbewahren\n4.\tWenn die Haferflocken die gewünschte Textur haben, von der Hitze nehmen\n5.\tServieren und mit deinen Toppings garnieren","en":"1.\tPlace the oats in a pot and fill it with water so that it covers them completely\n2.\tCook them over medium heat\n3.\tAdd half of the mashed banana and keep the other half for decorating\n4.\tWhen the oats have the desired texture, take them off the heat\n5.\tServe and decorate with your toppings","es":"1.\tColocar la avena en una olla y llenarla con agua de tal manera que la cubra por completo\n2.\tLa cocinamos a fuego medio\n3.\tAgregar la mitad del banano machacado y dejar la otra mitad para decorar\n4.\tCuando la avena tiene la textura deseada sacar del fuego\n5.\tServir y decorar con tus toppings"},"1.\tColocar tu arepa en el sartén y esperar a que dore\n2.\tEn una olla agregar la pechuga de pollo, la cebolla y agua con sal\n3.\tHervir hasta que el pollo esté cocinado perfectamente\n4.\tSacar el pollo del agua y desmechar. Después mezclar con la salsa bbq\n5.\tColocar una capa de aguacate y encima el pollo bbq\n6.\tDisfrutar":{"de":"1.\tDeine Arepa in die Pfanne legen und warten, bis sie bräunt\n2.\tIn einen Topf die Hähnchenbrust, die Zwiebel und Salzwasser geben\n3.\tKochen, bis das Hähnchen perfekt gegart ist\n4.\tDas Hähnchen aus dem Wasser nehmen und zerpflücken. Anschließend mit der BBQ-Sauce vermengen\n5.\tEine Schicht Avocado und darauf das BBQ-Hähnchen geben\n6.\tGenießen","en":"1.\tPlace your arepa in the pan and wait for it to brown\n2.\tIn a pot, add the chicken breast, the onion and salted water\n3.\tBoil until the chicken is perfectly cooked\n4.\tTake the chicken out of the water and shred it. Then mix it with the bbq sauce\n5.\tPlace a layer of avocado and the bbq chicken on top\n6.\tEnjoy","es":"1.\tColocar tu arepa en el sartén y esperar a que dore\n2.\tEn una olla agregar la pechuga de pollo, la cebolla y agua con sal\n3.\tHervir hasta que el pollo esté cocinado perfectamente\n4.\tSacar el pollo del agua y desmechar. Después mezclar con la salsa bbq\n5.\tColocar una capa de aguacate y encima el pollo bbq\n6.\tDisfrutar"},"1.\tColocas el aceite en un sartén junto con la cebolla\n2.\tCuando la cebolla esté transparente agregas la carne molida\n3.\tEsperas a que esté bien cocinada y la sacas del fuego\n4.\tArmar tu wrap con todos los ingredientes":{"de":"1.\tDas Öl zusammen mit der Zwiebel in eine Pfanne geben\n2.\tWenn die Zwiebel glasig ist, das Hackfleisch hinzufügen\n3.\tWarten, bis es gut durchgegart ist, und von der Hitze nehmen\n4.\tDeinen Wrap mit allen Zutaten zusammenstellen","en":"1.\tPlace the oil in a pan together with the onion\n2.\tWhen the onion is translucent, add the ground beef\n3.\tWait until it is well cooked and take it off the heat\n4.\tAssemble your wrap with all the ingredients","es":"1.\tColocas el aceite en un sartén junto con la cebolla\n2.\tCuando la cebolla esté transparente agregas la carne molida\n3.\tEsperas a que esté bien cocinada y la sacas del fuego\n4.\tArmar tu wrap con todos los ingredientes"},"1.\tColocas el aceite en un sartén junto con la cebolla y el pollo \n2.\tCuando el pollo esté en su punto agregas la salsa bbq\n3.\tSacas todo del sartén y lo colocas sobre el Wrap\n4.\tAgregar el queso\n5.\tDisfrutar":{"de":"1.\tDas Öl zusammen mit der Zwiebel und dem Hähnchen in eine Pfanne geben \n2.\tWenn das Hähnchen den richtigen Punkt hat, die BBQ-Sauce hinzufügen\n3.\tAlles aus der Pfanne nehmen und auf den Wrap geben\n4.\tDen Käse hinzufügen\n5.\tGenießen","en":"1.\tPlace the oil in a pan together with the onion and the chicken \n2.\tWhen the chicken is at its point, add the bbq sauce\n3.\tTake everything out of the pan and place it on the Wrap\n4.\tAdd the cheese\n5.\tEnjoy","es":"1.\tColocas el aceite en un sartén junto con la cebolla y el pollo \n2.\tCuando el pollo esté en su punto agregas la salsa bbq\n3.\tSacas todo del sartén y lo colocas sobre el Wrap\n4.\tAgregar el queso\n5.\tDisfrutar"},"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo y el maíz de lata, mezclamos bien. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada":{"de":"1.\tDie Butter zusammen mit der Zwiebel und der Tomate in eine Pfanne geben\n2.\tWarten, bis die Zwiebel glasig wird und die Tomate ihren Saft abgibt\n3.\tDas Ei und den Mais aus der Dose hinzufügen, gut vermengen. Salz und Pfeffer nach Geschmack\n4.\tServieren und mit deinen Reiswaffeln und Marmelade begleiten","en":"1.\tPlace the butter in a pan together with the onion and the tomato\n2.\tWait until the onion turns translucent and the tomato releases its juices\n3.\tAdd the egg and the canned corn, mix well. Salt and pepper to taste\n4.\tServe and accompany with your rice crackers and jam","es":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo y el maíz de lata, mezclamos bien. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada"},"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo, sal y pimienta al gusto\n4.\tCoges los panes y los pones a tostar, después sobre ellos pones el huevo\n5.\tDecorar con cilantro y siracha al gusto":{"de":"1.\tDie Butter zusammen mit der Zwiebel und der Tomate in eine Pfanne geben\n2.\tWarten, bis die Zwiebel glasig wird und die Tomate ihren Saft abgibt\n3.\tDas Ei hinzufügen, Salz und Pfeffer nach Geschmack\n4.\tDie Brote nehmen und toasten, dann das Ei darauf geben\n5.\tMit Koriander und Sriracha nach Geschmack garnieren","en":"1.\tPlace the butter in a pan together with the onion and the tomato\n2.\tWait until the onion turns translucent and the tomato releases its juices\n3.\tAdd the egg, salt and pepper to taste\n4.\tTake the breads and toast them, then place the egg on top of them\n5.\tDecorate with cilantro and sriracha to taste","es":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo, sal y pimienta al gusto\n4.\tCoges los panes y los pones a tostar, después sobre ellos pones el huevo\n5.\tDecorar con cilantro y siracha al gusto"},"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada":{"de":"1.\tDie Butter zusammen mit der Zwiebel und der Tomate in eine Pfanne geben\n2.\tWarten, bis die Zwiebel glasig wird und die Tomate ihren Saft abgibt\n3.\tDas Ei hinzufügen. Salz und Pfeffer nach Geschmack\n4.\tServieren und mit deinen Reiswaffeln und Marmelade begleiten","en":"1.\tPlace the butter in a pan together with the onion and the tomato\n2.\tWait until the onion turns translucent and the tomato releases its juices\n3.\tAdd the egg. Salt and pepper to taste\n4.\tServe and accompany with your rice crackers and jam","es":"1.\tColocas en un sartén la mantequilla junto con la cebolla y el tomate\n2.\tEsperas hasta que la cebolla se ponga transparente y el tomate saque sus jugos\n3.\tAñadimos el huevo. Sal y pimienta al gusto\n4.\tServir y acompañar con tus galletas de arroz y mermelada"},"1.\tEn un bowl colocar el huevo, la leche y la canela\n2.\tCoger un sartén y agregar la mantequilla\n3.\tPasas por la mezcla las rebanadas de pan, procura que se impregnen super bien\n4.\tDorar las rebanadas en el sartén\n5.\tDecorar con miel y fresas":{"de":"1.\tIn eine Schüssel das Ei, die Milch und den Zimt geben\n2.\tEine Pfanne nehmen und die Butter hinzufügen\n3.\tDie Brotscheiben durch die Mischung ziehen und darauf achten, dass sie sich gut vollsaugen\n4.\tDie Scheiben in der Pfanne anbräunen\n5.\tMit Honig und Erdbeeren garnieren","en":"1.\tIn a bowl, place the egg, the milk and the cinnamon\n2.\tTake a pan and add the butter\n3.\tDip the bread slices in the mixture, making sure they soak up really well\n4.\tBrown the slices in the pan\n5.\tDecorate with honey and strawberries","es":"1.\tEn un bowl colocar el huevo, la leche y la canela\n2.\tCoger un sartén y agregar la mantequilla\n3.\tPasas por la mezcla las rebanadas de pan, procura que se impregnen super bien\n4.\tDorar las rebanadas en el sartén\n5.\tDecorar con miel y fresas"},"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tAgregar la salsa de soja y miel. Cocinar por unos cuantos minutos más y sacar del fuego\n4.\tServir el pollo junto con la ensalada\n5.\tDisfrutar":{"de":"1.\tIn eine Pfanne das Olivenöl geben, warten, bis es heiß ist, und die Zwiebel hinzufügen.\n2.\tWenn sie glasig ist, die Hähnchenbrust hinzufügen und von beiden Seiten anbraten\n3.\tDie Sojasauce und den Honig hinzufügen. Ein paar Minuten weitergaren und von der Hitze nehmen\n4.\tDas Hähnchen zusammen mit dem Salat servieren\n5.\tGenießen","en":"1.\tIn a pan, place the olive oil, wait for it to heat up and add the onion.\n2.\tWhen it is translucent, add the chicken breast and brown it on both sides\n3.\tAdd the soy sauce and honey. Cook for a few more minutes and take off the heat\n4.\tServe the chicken together with the salad\n5.\tEnjoy","es":"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tAgregar la salsa de soja y miel. Cocinar por unos cuantos minutos más y sacar del fuego\n4.\tServir el pollo junto con la ensalada\n5.\tDisfrutar"},"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tEn una taza mezclar de forma homogénea la mostaza y la miel\n4.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz y aguacate":{"de":"1.\tIn eine Pfanne das Olivenöl geben, warten, bis es heiß ist, und die Zwiebel hinzufügen.\n2.\tWenn sie glasig ist, die Hähnchenbrust hinzufügen und von beiden Seiten anbraten\n3.\tIn einer Tasse den Senf und den Honig glatt verrühren\n4.\tDas Hähnchen servieren und die Sauce darüber geben. Mit Reis und Avocado begleiten","en":"1.\tIn a pan, place the olive oil, wait for it to heat up and add the onion.\n2.\tWhen it is translucent, add the chicken breast and brown it on both sides\n3.\tIn a cup, mix the mustard and the honey until smooth\n4.\tServe the chicken and pour the sauce over the top. Accompany with rice and avocado","es":"1.\tEn un sartén colocar el aceite de oliva, esperar a que se caliente e incorporar la cebolla.\n2.\tCuando esta esté transparente agregar la pechuga de pollo y dorar por ambos lados\n3.\tEn una taza mezclar de forma homogénea la mostaza y la miel\n4.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz y aguacate"},"1.\tEn un sartén colocar el aceite de oliva, y las rodajas de un limón. Esperar hasta que las rodajas estén doradas y hagan sacado su jugo.\n2.\tSacar las rodajas del fuego y ahí mismo colocamos la pechuga de pollo cortada en cubos.\n3.\tDoramos por ambos lados y reservamos el pollo fuera del fuego.\n4.\tEn el mismo sartén agregamos cebolla cortada en cuadritos pequeños.\n5.\tAgregamos condimento como sal, pimienta, jengibre, cúrcuma, ajo en polvo y esperamos hasta que la cebolla se vaya poniendo tierna y transparente.\n6.\tDespués agregamos media taza de agua y colocamos de nuevo el pollo en el sartén.\n7.\tAgregamos el jugo de un limón, las aceitunas verdes cortadas en cubos y las rodajas de limón que utilizamos al principio de la preparación.\n8.\tCubrimos por unos minutos y dejamos cocinar a fuego medio para que todos lo sabores se combinen perfectamente\n9.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz":{"de":"1.\tIn eine Pfanne das Olivenöl und die Scheiben einer Zitrone geben. Warten, bis die Scheiben goldbraun sind und ihren Saft abgegeben haben.\n2.\tDie Scheiben von der Hitze nehmen und an derselben Stelle die in Würfel geschnittene Hähnchenbrust hineingeben.\n3.\tVon beiden Seiten anbraten und das Hähnchen abseits der Hitze beiseitestellen.\n4.\tIn dieselbe Pfanne die in kleine Würfel geschnittene Zwiebel geben.\n5.\tGewürze wie Salz, Pfeffer, Ingwer, Kurkuma und Knoblauchpulver hinzufügen und warten, bis die Zwiebel zart und glasig wird.\n6.\tAnschließend eine halbe Tasse Wasser hinzufügen und das Hähnchen wieder in die Pfanne geben.\n7.\tDen Saft einer Zitrone, die in Würfel geschnittenen grünen Oliven und die Zitronenscheiben, die wir zu Beginn der Zubereitung verwendet haben, hinzufügen.\n8.\tEinige Minuten abdecken und bei mittlerer Hitze garen lassen, damit sich alle Aromen perfekt verbinden\n9.\tDas Hähnchen servieren und die Sauce darüber geben. Mit Reis begleiten","en":"1.\tIn a pan, place the olive oil and the slices of one lemon. Wait until the slices are golden and have released their juice.\n2.\tTake the slices off the heat and, right there, place the chicken breast cut into cubes.\n3.\tBrown it on both sides and set the chicken aside off the heat.\n4.\tIn the same pan, add onion cut into small squares.\n5.\tAdd seasoning such as salt, pepper, ginger, turmeric, garlic powder and wait until the onion becomes tender and translucent.\n6.\tThen add half a cup of water and put the chicken back in the pan.\n7.\tAdd the juice of one lemon, the green olives cut into cubes and the lemon slices we used at the beginning of the preparation.\n8.\tCover for a few minutes and let it cook over medium heat so that all the flavors combine perfectly\n9.\tServe the chicken and pour the sauce over the top. Accompany with rice","es":"1.\tEn un sartén colocar el aceite de oliva, y las rodajas de un limón. Esperar hasta que las rodajas estén doradas y hagan sacado su jugo.\n2.\tSacar las rodajas del fuego y ahí mismo colocamos la pechuga de pollo cortada en cubos.\n3.\tDoramos por ambos lados y reservamos el pollo fuera del fuego.\n4.\tEn el mismo sartén agregamos cebolla cortada en cuadritos pequeños.\n5.\tAgregamos condimento como sal, pimienta, jengibre, cúrcuma, ajo en polvo y esperamos hasta que la cebolla se vaya poniendo tierna y transparente.\n6.\tDespués agregamos media taza de agua y colocamos de nuevo el pollo en el sartén.\n7.\tAgregamos el jugo de un limón, las aceitunas verdes cortadas en cubos y las rodajas de limón que utilizamos al principio de la preparación.\n8.\tCubrimos por unos minutos y dejamos cocinar a fuego medio para que todos lo sabores se combinen perfectamente\n9.\tServir el pollo y agregar la salsa por encima. Acompañar con arroz"},"1.\tEn un vaso colocar las semillas de chia y de linaza\n2.\tAgregar la leche y la miel\n3.\tDejar durante toda la noche en la nevera \n4.\tAl siguiente día obtendrás un pudding ya que la chia ha absorvido gran parte de los líquidos \n5.\tDecorar con tus toppings\n6.\tServir y disfrutar":{"de":"1.\tIn ein Glas die Chia- und Leinsamen geben\n2.\tDie Milch und den Honig hinzufügen\n3.\tÜber Nacht im Kühlschrank ziehen lassen \n4.\tAm nächsten Tag erhältst du einen Pudding, da die Chia einen Großteil der Flüssigkeit aufgesogen hat \n5.\tMit deinen Toppings garnieren\n6.\tServieren und genießen","en":"1.\tIn a glass, place the chia and flax seeds\n2.\tAdd the milk and the honey\n3.\tLeave overnight in the fridge \n4.\tThe next day you will get a pudding since the chia has absorbed most of the liquids \n5.\tDecorate with your toppings\n6.\tServe and enjoy","es":"1.\tEn un vaso colocar las semillas de chia y de linaza\n2.\tAgregar la leche y la miel\n3.\tDejar durante toda la noche en la nevera \n4.\tAl siguiente día obtendrás un pudding ya que la chia ha absorvido gran parte de los líquidos \n5.\tDecorar con tus toppings\n6.\tServir y disfrutar"},"1.\tEn una olla grande con agua hirviendo con sal, cocina la pasta según las instrucciones del paquete; escurrir bien.\n2.\tDerrita la mantequilla en una sartén grande a fuego medio alto. Agregue el ajo, y cocine, revolviendo con frecuencia, hasta que estén fragantes, aproximadamente 2 minutos\n3.\tBatir la harina hasta que esté ligeramente dorada, aproximadamente 1 minuto. Agregue gradualmente la leche, y la crema de leche hasta que espese un poco, aproximadamente 3-4 minutos. Si la mezcla es demasiado espesa, agregue más leche según sea necesario; sazone con sal y pimienta, al gusto.\n4.\tAgregue la pasta, el brócoli y el pollo previamente cocinado hasta que estén bien combinados, unos 3-4 minutos.\n5.\tServir inmediatamente.":{"de":"1.\tIn einem großen Topf mit kochendem Salzwasser die Pasta nach Packungsanweisung kochen; gut abtropfen lassen.\n2.\tDie Butter in einer großen Pfanne bei mittlerer bis hoher Hitze schmelzen. Den Knoblauch hinzufügen und unter häufigem Rühren garen, bis er duftet, etwa 2 Minuten\n3.\tDas Mehl einrühren, bis es leicht goldbraun ist, etwa 1 Minute. Nach und nach die Milch und die Sahne hinzufügen, bis es leicht andickt, etwa 3-4 Minuten. Ist die Mischung zu dick, nach Bedarf mehr Milch hinzufügen; mit Salz und Pfeffer nach Geschmack würzen.\n4.\tDie Pasta, den Brokkoli und das zuvor gegarte Hähnchen hinzufügen, bis alles gut vermengt ist, etwa 3-4 Minuten.\n5.\tSofort servieren.","en":"1.\tIn a large pot of boiling salted water, cook the pasta according to the package instructions; drain well.\n2.\tMelt the butter in a large pan over medium-high heat. Add the garlic and cook, stirring frequently, until fragrant, about 2 minutes\n3.\tWhisk in the flour until lightly golden, about 1 minute. Gradually add the milk and the cream until it thickens slightly, about 3-4 minutes. If the mixture is too thick, add more milk as needed; season with salt and pepper, to taste.\n4.\tAdd the pasta, the broccoli and the previously cooked chicken until well combined, about 3-4 minutes.\n5.\tServe immediately.","es":"1.\tEn una olla grande con agua hirviendo con sal, cocina la pasta según las instrucciones del paquete; escurrir bien.\n2.\tDerrita la mantequilla en una sartén grande a fuego medio alto. Agregue el ajo, y cocine, revolviendo con frecuencia, hasta que estén fragantes, aproximadamente 2 minutos\n3.\tBatir la harina hasta que esté ligeramente dorada, aproximadamente 1 minuto. Agregue gradualmente la leche, y la crema de leche hasta que espese un poco, aproximadamente 3-4 minutos. Si la mezcla es demasiado espesa, agregue más leche según sea necesario; sazone con sal y pimienta, al gusto.\n4.\tAgregue la pasta, el brócoli y el pollo previamente cocinado hasta que estén bien combinados, unos 3-4 minutos.\n5.\tServir inmediatamente."},"1.\tEn una olla mediana hervir la quinoa y 2 tazas de agua. Reducir el fuego y hervir hasta que el agua sea totalmente absorbida, aproximadamente unos 15 a 20 minutos. \n2.\tSazonar con sal y remover con un tenedor para separar la quinoa. \n3.\tEn una sartén a fuego medio calentar el aceite de oliva. Agregar la cebolla, zanahoria y arvejas. Cocinar hasta que estén suaves. \n4.\tAgregar el ajo junto con la salsa de soya y cocinar por un par de minutos más. \n5.\tEn un bowl pequeño batir ligeramente el huevo y cocinarlos en una sartén que está previamente engrasada. \n6.\tFormar una tortilla, cocinando por ambos lados. Transferir a un plato y cortar cubitos.\n7.\tAgregar el huevo cocido a la mezcla de quinoa junto con la cebolla china. Servir.":{"de":"1.\tIn einem mittleren Topf die Quinoa und 2 Tassen Wasser aufkochen. Die Hitze reduzieren und köcheln lassen, bis das Wasser vollständig aufgesogen ist, etwa 15 bis 20 Minuten. \n2.\tMit Salz würzen und mit einer Gabel auflockern, um die Quinoa zu trennen. \n3.\tIn einer Pfanne bei mittlerer Hitze das Olivenöl erwärmen. Die Zwiebel, Karotte und Erbsen hinzufügen. Garen, bis sie weich sind. \n4.\tDen Knoblauch zusammen mit der Sojasauce hinzufügen und ein paar Minuten weitergaren. \n5.\tIn einer kleinen Schüssel das Ei leicht verquirlen und in einer zuvor eingefetteten Pfanne garen. \n6.\tEin Omelett formen und von beiden Seiten garen. Auf einen Teller geben und in Würfel schneiden.\n7.\tDas gegarte Ei zusammen mit der Frühlingszwiebel zur Quinoa-Mischung geben. Servieren.","en":"1.\tIn a medium pot, boil the quinoa and 2 cups of water. Lower the heat and simmer until the water is fully absorbed, approximately 15 to 20 minutes. \n2.\tSeason with salt and fluff with a fork to separate the quinoa. \n3.\tIn a pan over medium heat, warm the olive oil. Add the onion, carrot and peas. Cook until they are soft. \n4.\tAdd the garlic along with the soy sauce and cook for a couple more minutes. \n5.\tIn a small bowl, lightly beat the egg and cook it in a previously greased pan. \n6.\tForm an omelette, cooking it on both sides. Transfer to a plate and cut into cubes.\n7.\tAdd the cooked egg to the quinoa mixture along with the green onion. Serve.","es":"1.\tEn una olla mediana hervir la quinoa y 2 tazas de agua. Reducir el fuego y hervir hasta que el agua sea totalmente absorbida, aproximadamente unos 15 a 20 minutos. \n2.\tSazonar con sal y remover con un tenedor para separar la quinoa. \n3.\tEn una sartén a fuego medio calentar el aceite de oliva. Agregar la cebolla, zanahoria y arvejas. Cocinar hasta que estén suaves. \n4.\tAgregar el ajo junto con la salsa de soya y cocinar por un par de minutos más. \n5.\tEn un bowl pequeño batir ligeramente el huevo y cocinarlos en una sartén que está previamente engrasada. \n6.\tFormar una tortilla, cocinando por ambos lados. Transferir a un plato y cortar cubitos.\n7.\tAgregar el huevo cocido a la mezcla de quinoa junto con la cebolla china. Servir."},"1.\tHacer la quinua según el empaque. (Puedes agregar al agua un poco de sal y un ajo sin cáscara para darle mejor sabor)\n2.\tCuando la quinua esté hecha agregar los fríjoles de lata y revolver bien. Agregar un chorrito de limón para darle un sabor refrescante\n3.\tEn una bandeja para horno colocar la coliflor en pequeños pedazos, condimentarla completamente con páprika, sal y pimienta.\n4.\tHacer lo mismo con tu pechuga de pollo\n5.\tLlevar al horno y cocinar hasta que el pollo esté completamente hecho\n6.\tLuego vamos a hacer un aliño para la ensalada. Mezclamos yogur griego, aceite balsámico, aceite de oliva, miel, sal y pimienta.\n7.\tPor último vamos a servir nuestra quinoa con fríjoles, el pollo y la ensalada con nuestro aderezo.":{"de":"1.\tDie Quinoa nach Packungsanweisung kochen. (Du kannst dem Wasser etwas Salz und eine ungeschälte Knoblauchzehe hinzufügen, um mehr Geschmack zu geben)\n2.\tWenn die Quinoa fertig ist, die Bohnen aus der Dose hinzufügen und gut umrühren. Einen Spritzer Zitrone hinzufügen, um einen erfrischenden Geschmack zu geben\n3.\tDen Blumenkohl in kleinen Stücken auf ein Backblech legen und rundum mit Paprika, Salz und Pfeffer würzen.\n4.\tDasselbe mit deiner Hähnchenbrust machen\n5.\tIn den Ofen geben und garen, bis das Hähnchen vollständig durch ist\n6.\tAnschließend bereiten wir ein Dressing für den Salat zu. Griechischen Joghurt, Balsamico-Essig, Olivenöl, Honig, Salz und Pfeffer verrühren.\n7.\tZum Schluss servieren wir unsere Quinoa mit Bohnen, das Hähnchen und den Salat mit unserem Dressing.","en":"1.\tCook the quinoa according to the package. (You can add a little salt and an unpeeled garlic clove to the water to give it more flavor)\n2.\tWhen the quinoa is done, add the canned beans and stir well. Add a splash of lemon to give it a refreshing flavor\n3.\tOn a baking tray, place the cauliflower in small pieces and season it thoroughly with paprika, salt and pepper.\n4.\tDo the same with your chicken breast\n5.\tPut it in the oven and cook until the chicken is completely done\n6.\tThen we are going to make a dressing for the salad. Mix Greek yogurt, balsamic vinegar, olive oil, honey, salt and pepper.\n7.\tFinally, we are going to serve our quinoa with beans, the chicken and the salad with our dressing.","es":"1.\tHacer la quinua según el empaque. (Puedes agregar al agua un poco de sal y un ajo sin cáscara para darle mejor sabor)\n2.\tCuando la quinua esté hecha agregar los fríjoles de lata y revolver bien. Agregar un chorrito de limón para darle un sabor refrescante\n3.\tEn una bandeja para horno colocar la coliflor en pequeños pedazos, condimentarla completamente con páprika, sal y pimienta.\n4.\tHacer lo mismo con tu pechuga de pollo\n5.\tLlevar al horno y cocinar hasta que el pollo esté completamente hecho\n6.\tLuego vamos a hacer un aliño para la ensalada. Mezclamos yogur griego, aceite balsámico, aceite de oliva, miel, sal y pimienta.\n7.\tPor último vamos a servir nuestra quinoa con fríjoles, el pollo y la ensalada con nuestro aderezo."},"1.\tLo primero que haremos será el bizcocho y para ello haremos un mug cake (un bizcocho en una taza). Mezclaremos muy bien en una taza, el huevo, la leche, la harina de avena (la haces simplemente moliendo la avena), la levadura, la miel (o pasta de dátiles si tienes) y la canela. Engrasamos una taza pintándola con un poco de aceite de oliva y echamos la mezcla del bizcocho. La metemos al microondas 3 minutos.\n2.\tUna vez pasado ese tiempo sacamos el bizcocho de la taza, lo dejamos atemperar y lo desmigajamos bien. Le echamos el café por encima y lo removemos bien para que el café empape bien todo el bizcocho.\n3.\tAhora haremos la crema. Mezclamos el yogurt, la vainilla y la miel. Mezclamos muy bien hasta que quede una crema uniforme.\n4.\tCogemos un vasito y empezamos a montar el tiramisú de la siguiente forma: ponemos una capa de bizcocho, luego una capa de crema de queso, otra capa de bizcocho, otra capa de crema de queso… y así hasta que lleguemos al final del vaso donde culminaremos con una capa de queso y cacao espolvoreado. Para esto yo uso un colador, pongo un poco de cacao en el colador y le doy unos toques laterales y queda perfectamente espolvoreado.":{"de":"1.\tAls Erstes machen wir den Biskuit, und dafür machen wir einen Tassenkuchen (ein Biskuit in der Tasse). In einer Tasse das Ei, die Milch, das Hafermehl (das machst du einfach, indem du die Haferflocken mahlst), das Backpulver, den Honig (oder Dattelpaste, falls vorhanden) und den Zimt sehr gut verrühren. Eine Tasse mit etwas Olivenöl einfetten und die Biskuitmasse hineingeben. 3 Minuten in die Mikrowelle stellen.\n2.\tNach Ablauf dieser Zeit den Biskuit aus der Tasse nehmen, abkühlen lassen und gut zerbröseln. Den Kaffee darüber gießen und gut umrühren, damit der Kaffee den ganzen Biskuit gut durchtränkt.\n3.\tNun machen wir die Creme. Den Joghurt, die Vanille und den Honig verrühren. Sehr gut verrühren, bis eine gleichmäßige Creme entsteht.\n4.\tEin kleines Glas nehmen und das Tiramisu wie folgt schichten: eine Schicht Biskuit, dann eine Schicht Käsecreme, wieder eine Schicht Biskuit, wieder eine Schicht Käsecreme… und so weiter, bis wir oben am Glas ankommen, wo wir mit einer Schicht Käse und gestäubtem Kakao abschließen. Dafür verwende ich ein Sieb: Ich gebe etwas Kakao in das Sieb und klopfe seitlich ein paar Mal dagegen, so wird es perfekt bestäubt.","en":"1.\tThe first thing we'll make is the sponge, and for that we'll make a mug cake (a sponge in a mug). In a mug, mix very well the egg, the milk, the oat flour (you make it simply by grinding the oats), the baking powder, the honey (or date paste if you have it) and the cinnamon. Grease a mug by brushing it with a little olive oil and pour in the sponge mixture. Put it in the microwave for 3 minutes.\n2.\tOnce that time has passed, take the sponge out of the mug, let it cool down and crumble it well. Pour the coffee over it and stir well so the coffee soaks the whole sponge thoroughly.\n3.\tNow we'll make the cream. Mix the yogurt, the vanilla and the honey. Mix very well until you get a uniform cream.\n4.\tTake a small glass and start assembling the tiramisu as follows: place a layer of sponge, then a layer of cheese cream, another layer of sponge, another layer of cheese cream… and so on until you reach the top of the glass, where you finish with a layer of cheese and dusted cocoa. For this I use a sieve: I put a little cocoa in the sieve and give it a few taps on the side, and it comes out perfectly dusted.","es":"1.\tLo primero que haremos será el bizcocho y para ello haremos un mug cake (un bizcocho en una taza). Mezclaremos muy bien en una taza, el huevo, la leche, la harina de avena (la haces simplemente moliendo la avena), la levadura, la miel (o pasta de dátiles si tienes) y la canela. Engrasamos una taza pintándola con un poco de aceite de oliva y echamos la mezcla del bizcocho. La metemos al microondas 3 minutos.\n2.\tUna vez pasado ese tiempo sacamos el bizcocho de la taza, lo dejamos atemperar y lo desmigajamos bien. Le echamos el café por encima y lo removemos bien para que el café empape bien todo el bizcocho.\n3.\tAhora haremos la crema. Mezclamos el yogurt, la vainilla y la miel. Mezclamos muy bien hasta que quede una crema uniforme.\n4.\tCogemos un vasito y empezamos a montar el tiramisú de la siguiente forma: ponemos una capa de bizcocho, luego una capa de crema de queso, otra capa de bizcocho, otra capa de crema de queso… y así hasta que lleguemos al final del vaso donde culminaremos con una capa de queso y cacao espolvoreado. Para esto yo uso un colador, pongo un poco de cacao en el colador y le doy unos toques laterales y queda perfectamente espolvoreado."},"1.\tLo primero que hay que hacer es cortar el zucchini por la mitad y vaciarlos con la ayuda de una cuchara. Después unta cada una de las mitades con un poco de aceite de oliva y hornéalas durante 15-20 minutos. Recuerda precalentar el horno previamente a 200º.\n2.\tCorta las papas en laminas y colócalas también en el horno junto al Zucchini\n3.\tMientras tanto, mezcla todos los ingredientes en un bowl grande: atún escurrido, un tallo de apio picado, media cebolla picada, dos cucharadas de zumo de limón y una de aceite de oliva, sal y pimientas al gusto.\n4.\tHecho esto rellena cada mitad de calabacín con la mezcla de atún y verduras, y cúbrelas con queso rallado.\n5.\tPara acabar, vuelve a hornear los calabacines durante 3-5 minutos hasta que el queso quede derretido. Sácalos del horno, emplata y ¡a comer!":{"de":"1.\tAls Erstes die Zucchini halbieren und mithilfe eines Löffels aushöhlen. Anschließend jede Hälfte mit etwas Olivenöl bestreichen und 15-20 Minuten backen. Denk daran, den Ofen vorher auf 200º vorzuheizen.\n2.\tDie Kartoffeln in Scheiben schneiden und ebenfalls neben die Zucchini in den Ofen geben\n3.\tIn der Zwischenzeit alle Zutaten in einer großen Schüssel vermengen: abgetropfter Thunfisch, eine gehackte Stange Sellerie, eine halbe gehackte Zwiebel, zwei Esslöffel Zitronensaft und einen Esslöffel Olivenöl, Salz und Pfeffer nach Geschmack.\n4.\tDanach jede Zucchinihälfte mit der Thunfisch-Gemüse-Mischung füllen und mit geriebenem Käse bedecken.\n5.\tZum Abschluss die Zucchini erneut 3-5 Minuten backen, bis der Käse geschmolzen ist. Aus dem Ofen nehmen, anrichten und los essen!","en":"1.\tThe first thing to do is cut the zucchini in half and hollow them out with the help of a spoon. Then brush each of the halves with a little olive oil and bake them for 15-20 minutes. Remember to preheat the oven beforehand to 200º.\n2.\tCut the potatoes into slices and also place them in the oven next to the zucchini\n3.\tMeanwhile, mix all the ingredients in a large bowl: drained tuna, one chopped celery stalk, half a chopped onion, two tablespoons of lemon juice and one of olive oil, salt and pepper to taste.\n4.\tOnce this is done, fill each zucchini half with the tuna and vegetable mixture, and cover them with grated cheese.\n5.\tTo finish, bake the zucchini again for 3-5 minutes until the cheese is melted. Take them out of the oven, plate up and let's eat!","es":"1.\tLo primero que hay que hacer es cortar el zucchini por la mitad y vaciarlos con la ayuda de una cuchara. Después unta cada una de las mitades con un poco de aceite de oliva y hornéalas durante 15-20 minutos. Recuerda precalentar el horno previamente a 200º.\n2.\tCorta las papas en laminas y colócalas también en el horno junto al Zucchini\n3.\tMientras tanto, mezcla todos los ingredientes en un bowl grande: atún escurrido, un tallo de apio picado, media cebolla picada, dos cucharadas de zumo de limón y una de aceite de oliva, sal y pimientas al gusto.\n4.\tHecho esto rellena cada mitad de calabacín con la mezcla de atún y verduras, y cúbrelas con queso rallado.\n5.\tPara acabar, vuelve a hornear los calabacines durante 3-5 minutos hasta que el queso quede derretido. Sácalos del horno, emplata y ¡a comer!"},"1.\tPicar la cebolla, el tomate y el aguacate en cubos pequeños.\n2.\tAgregar todo en un bowl y mezclar bien, agregar el jugo del limón, sal y pimienta al gusto.\n3.\tEn un sartén hacer tu filete hasta que este cocinado por ambos lados\n4.\tMientras tanto hacer tus papas hervidas hasta que estén suaves \n5.\tServir todo y disfrutar":{"de":"1.\tDie Zwiebel, die Tomate und die Avocado in kleine Würfel schneiden.\n2.\tAlles in eine Schüssel geben und gut vermengen, den Zitronensaft, Salz und Pfeffer nach Geschmack hinzufügen.\n3.\tIn einer Pfanne dein Steak braten, bis es von beiden Seiten gegart ist\n4.\tIn der Zwischenzeit deine Kartoffeln kochen, bis sie weich sind \n5.\tAlles servieren und genießen","en":"1.\tChop the onion, the tomato and the avocado into small cubes.\n2.\tAdd everything to a bowl and mix well, add the lemon juice, salt and pepper to taste.\n3.\tIn a pan, cook your steak until it is cooked on both sides\n4.\tMeanwhile, boil your potatoes until they are soft \n5.\tServe everything and enjoy","es":"1.\tPicar la cebolla, el tomate y el aguacate en cubos pequeños.\n2.\tAgregar todo en un bowl y mezclar bien, agregar el jugo del limón, sal y pimienta al gusto.\n3.\tEn un sartén hacer tu filete hasta que este cocinado por ambos lados\n4.\tMientras tanto hacer tus papas hervidas hasta que estén suaves \n5.\tServir todo y disfrutar"},"1.\tPicas la cebolla y el tomate en cuadritos pequeños\n2.\tCoges el aguacate, lo machacas, le agregas sal y pimienta al gusto\n3.\tAgregas la mayonesa al aguacate y mezclas bien\n4.\tColocar la cebolla y el tomate a la preparación anterior\n5.\tEscurres el atún y lo agregas a la mezcla\n6.\tHaces la pasta como indica en el empaque\n7.\tJuntas todo y a disfrutar":{"de":"1.\tDie Zwiebel und die Tomate in kleine Würfel schneiden\n2.\tDie Avocado nehmen, zerdrücken, Salz und Pfeffer nach Geschmack hinzufügen\n3.\tDie Mayonnaise zur Avocado geben und gut vermengen\n4.\tDie Zwiebel und die Tomate zur vorherigen Zubereitung geben\n5.\tDen Thunfisch abtropfen lassen und zur Mischung geben\n6.\tDie Pasta nach Packungsanweisung kochen\n7.\tAlles zusammenfügen und genießen","en":"1.\tChop the onion and the tomato into small squares\n2.\tTake the avocado, mash it, add salt and pepper to taste\n3.\tAdd the mayonnaise to the avocado and mix well\n4.\tAdd the onion and the tomato to the previous preparation\n5.\tDrain the tuna and add it to the mixture\n6.\tCook the pasta as the package indicates\n7.\tCombine everything and enjoy","es":"1.\tPicas la cebolla y el tomate en cuadritos pequeños\n2.\tCoges el aguacate, lo machacas, le agregas sal y pimienta al gusto\n3.\tAgregas la mayonesa al aguacate y mezclas bien\n4.\tColocar la cebolla y el tomate a la preparación anterior\n5.\tEscurres el atún y lo agregas a la mezcla\n6.\tHaces la pasta como indica en el empaque\n7.\tJuntas todo y a disfrutar"},"1.\tPoner a hacer el arroz según las instrucciones del empaque\n2.\tEn un sartén aparte colocar el aceite y la pechuga\n3.\tCuando la pechuga esté lista agregar la zanahoria y la arveja\n4.\tDejar cocinar un rato y agregar el arroz\n5.\tCuando todo esta incorporado darle sabor con sal, pimienta y la salsa de tomate\n6.\tServir con aguacate":{"de":"1.\tDen Reis nach Packungsanweisung kochen\n2.\tIn einer separaten Pfanne das Öl und die Hähnchenbrust anrichten\n3.\tWenn die Brust fertig ist, die Karotte und die Erbsen hinzufügen\n4.\tEine Weile garen lassen und den Reis hinzufügen\n5.\tWenn alles vermengt ist, mit Salz, Pfeffer und der Tomatensauce abschmecken\n6.\tMit Avocado servieren","en":"1.\tStart cooking the rice according to the package instructions\n2.\tIn a separate pan, place the oil and the breast\n3.\tWhen the breast is ready, add the carrot and the peas\n4.\tLet it cook for a while and add the rice\n5.\tWhen everything is combined, flavor it with salt, pepper and the tomato sauce\n6.\tServe with avocado","es":"1.\tPoner a hacer el arroz según las instrucciones del empaque\n2.\tEn un sartén aparte colocar el aceite y la pechuga\n3.\tCuando la pechuga esté lista agregar la zanahoria y la arveja\n4.\tDejar cocinar un rato y agregar el arroz\n5.\tCuando todo esta incorporado darle sabor con sal, pimienta y la salsa de tomate\n6.\tServir con aguacate"},"1.\tPoner a hervir la pechuga hasta que este cocinada\n2.\tParalelamente ve haciendo las arepas\n3.\tColocar la harina en un bowl, junto con un poco del queso, sal y agua\n4.\tArmas las arepas\n5.\tEn un sartén colocas la mantequilla y pones a cocinar las arepas\n6.\tDesmechar la pechuga de pollo\n7.\tEn otro bowl mezclar el aguacate, la mayonesa, la cebolla, y la pechuga de pollo desmechada, salpimentar al gusto\n8.\tCuando las arepas estén doradas y listas partir por la mitad, rellenarlas y disfrutar 😊":{"de":"1.\tDie Hähnchenbrust kochen, bis sie gar ist\n2.\tParallel dazu die Arepas zubereiten\n3.\tDas Mehl zusammen mit etwas Käse, Salz und Wasser in eine Schüssel geben\n4.\tDie Arepas formen\n5.\tIn einer Pfanne die Butter zerlassen und die Arepas garen\n6.\tDie Hähnchenbrust zerpflücken\n7.\tIn einer anderen Schüssel die Avocado, die Mayonnaise, die Zwiebel und die zerpflückte Hähnchenbrust vermengen, mit Salz und Pfeffer nach Geschmack abschmecken\n8.\tWenn die Arepas goldbraun und fertig sind, halbieren, füllen und genießen 😊","en":"1.\tBoil the breast until it is cooked\n2.\tAt the same time, start making the arepas\n3.\tPlace the flour in a bowl, together with a little of the cheese, salt and water\n4.\tForm the arepas\n5.\tIn a pan, place the butter and cook the arepas\n6.\tShred the chicken breast\n7.\tIn another bowl, mix the avocado, the mayonnaise, the onion and the shredded chicken breast, season with salt and pepper to taste\n8.\tWhen the arepas are golden and ready, cut them in half, fill them and enjoy 😊","es":"1.\tPoner a hervir la pechuga hasta que este cocinada\n2.\tParalelamente ve haciendo las arepas\n3.\tColocar la harina en un bowl, junto con un poco del queso, sal y agua\n4.\tArmas las arepas\n5.\tEn un sartén colocas la mantequilla y pones a cocinar las arepas\n6.\tDesmechar la pechuga de pollo\n7.\tEn otro bowl mezclar el aguacate, la mayonesa, la cebolla, y la pechuga de pollo desmechada, salpimentar al gusto\n8.\tCuando las arepas estén doradas y listas partir por la mitad, rellenarlas y disfrutar 😊"},"1.\tPones a hervir la pechuga de pollo \n2.\tEn una olla agregar el aceite y la cebolla\n3.\tCuando la cebolla se blanquea incorporas la zanahoria, la papa y el broccoli \n4.\tDejas cocinar hasta que el pollo esté en su punto, lo sacas del agua y lo empiezas a desmechar\n5.\tAgregas el caldo donde hiciste el pollo a las verduras (no todo para que no te quede tan líquido) (reserva para después por si te queda muy espesa la crema)\n6.\tLicuas, agrega sal y pimienta al gusto\n7.\tEmplatamos primero la crema y por encima el pollo desmechado (Puedes agregarle un chorrito de crema de leche…poquito)":{"de":"1.\tDie Hähnchenbrust kochen \n2.\tIn einen Topf das Öl und die Zwiebel geben\n3.\tWenn die Zwiebel hell wird, die Karotte, die Kartoffel und den Brokkoli hinzufügen \n4.\tGaren lassen, bis das Hähnchen den richtigen Punkt hat, aus dem Wasser nehmen und zerpflücken\n5.\tDie Brühe, in der du das Hähnchen gegart hast, zum Gemüse geben (nicht die ganze, damit es nicht zu flüssig wird) (etwas für später zurückbehalten, falls die Suppe zu dick wird)\n6.\tPürieren, Salz und Pfeffer nach Geschmack hinzufügen\n7.\tZuerst die Suppe anrichten und darauf das zerpflückte Hähnchen (Du kannst einen Spritzer Sahne hinzufügen…nur wenig)","en":"1.\tBoil the chicken breast \n2.\tIn a pot, add the oil and the onion\n3.\tWhen the onion turns pale, add the carrot, the potato and the broccoli \n4.\tLet it cook until the chicken is at its point, take it out of the water and start shredding it\n5.\tAdd the broth in which you cooked the chicken to the vegetables (not all of it so it doesn't turn out too runny) (reserve some for later in case the soup turns out too thick)\n6.\tBlend, add salt and pepper to taste\n7.\tFirst plate the soup and top it with the shredded chicken (You can add a splash of cream…just a little)","es":"1.\tPones a hervir la pechuga de pollo \n2.\tEn una olla agregar el aceite y la cebolla\n3.\tCuando la cebolla se blanquea incorporas la zanahoria, la papa y el broccoli \n4.\tDejas cocinar hasta que el pollo esté en su punto, lo sacas del agua y lo empiezas a desmechar\n5.\tAgregas el caldo donde hiciste el pollo a las verduras (no todo para que no te quede tan líquido) (reserva para después por si te queda muy espesa la crema)\n6.\tLicuas, agrega sal y pimienta al gusto\n7.\tEmplatamos primero la crema y por encima el pollo desmechado (Puedes agregarle un chorrito de crema de leche…poquito)"},"1.\tPrecalentar el horno a 170ºC y preparar un molde. Podemos engrasarlo ligeramente con aceite para facilitar el desmoldado posterior.\n2.\tCombinar en un recipiente los copos de avena con la levadura, las especias, la sal y las almendras. También podemos combinar copos de avena de diferentes tamaños para darle otra textura a la miga.\n3.\tBatir con unas varillas manuales en otro cuenco la leche con el plátano machacado, la vainilla, el huevo y el aceite. Echar a los ingredientes secos y combinar bien, añadiendo los arándanos.\n4.\tVerter en el molde, procurando que quede distribuido de forma homogénea, y coronar con fresas lavadas y cortadas al gusto\n5.Hornear durante unos 35-40 minutos, hasta que esté bien dorado por arriba. Servir y disfrutar":{"de":"1.\tDen Ofen auf 170ºC vorheizen und eine Form vorbereiten. Wir können sie leicht mit Öl einfetten, um das spätere Stürzen zu erleichtern.\n2.\tIn einer Schüssel die Haferflocken mit dem Backpulver, den Gewürzen, dem Salz und den Mandeln vermengen. Wir können auch Haferflocken unterschiedlicher Größe kombinieren, um der Krume eine andere Textur zu geben.\n3.\tIn einer anderen Schüssel mit einem Handschneebesen die Milch mit der zerdrückten Banane, der Vanille, dem Ei und dem Öl verquirlen. Zu den trockenen Zutaten geben und gut vermengen, dabei die Heidelbeeren hinzufügen.\n4.\tIn die Form gießen, dabei darauf achten, dass sie gleichmäßig verteilt ist, und mit gewaschenen und nach Geschmack geschnittenen Erdbeeren belegen\n5.Etwa 35-40 Minuten backen, bis es oben schön goldbraun ist. Servieren und genießen","en":"1.\tPreheat the oven to 170ºC and prepare a mold. We can lightly grease it with oil to make unmolding easier later.\n2.\tIn a bowl, combine the oat flakes with the baking powder, the spices, the salt and the almonds. We can also combine oat flakes of different sizes to give the crumb a different texture.\n3.\tIn another bowl, whisk with a hand whisk the milk with the mashed banana, the vanilla, the egg and the oil. Pour into the dry ingredients and combine well, adding the blueberries.\n4.\tPour into the mold, making sure it is evenly distributed, and top with strawberries washed and cut to taste\n5.Bake for about 35-40 minutes, until it is nicely golden on top. Serve and enjoy","es":"1.\tPrecalentar el horno a 170ºC y preparar un molde. Podemos engrasarlo ligeramente con aceite para facilitar el desmoldado posterior.\n2.\tCombinar en un recipiente los copos de avena con la levadura, las especias, la sal y las almendras. También podemos combinar copos de avena de diferentes tamaños para darle otra textura a la miga.\n3.\tBatir con unas varillas manuales en otro cuenco la leche con el plátano machacado, la vainilla, el huevo y el aceite. Echar a los ingredientes secos y combinar bien, añadiendo los arándanos.\n4.\tVerter en el molde, procurando que quede distribuido de forma homogénea, y coronar con fresas lavadas y cortadas al gusto\n5.Hornear durante unos 35-40 minutos, hasta que esté bien dorado por arriba. Servir y disfrutar"},"1. Colocar la avena en una olla\n2. Agregar la leche y la canela\n3. Calentar hasta encontrar la consistencia que más te guste.\n4.Decorar con el banano, las fresas, las nueces y la miel\nDisfrutar":{"de":"1. Die Haferflocken in einen Topf geben\n2. Die Milch und den Zimt hinzufügen\n3. Erhitzen, bis die Konsistenz erreicht ist, die dir am besten gefällt.\n4.Mit der Banane, den Erdbeeren, den Walnüssen und dem Honig garnieren\nGenießen","en":"1. Place the oats in a pot\n2. Add the milk and the cinnamon\n3. Heat until you reach the consistency you like best.\n4.Decorate with the banana, the strawberries, the walnuts and the honey\nEnjoy","es":"1. Colocar la avena en una olla\n2. Agregar la leche y la canela\n3. Calentar hasta encontrar la consistencia que más te guste.\n4.Decorar con el banano, las fresas, las nueces y la miel\nDisfrutar"},"1. Colocar la avena en una olla\n2. Agregar la leche y la canela\n3. Calentar hasta encontrar la consistencia que más te guste.\n4.Retirar del fuego\n5. En un sartén derretir la mantequilla, agregar azúcar y canela. \n6. Picar la manzana en cubitos y agregar al sartén.\n7.Dejar caramelizar y retirar del fuego\n8.Agregar a la avena\nDisfrutar":{"de":"1. Die Haferflocken in einen Topf geben\n2. Die Milch und den Zimt hinzufügen\n3. Erhitzen, bis die Konsistenz erreicht ist, die dir am besten gefällt.\n4.Von der Hitze nehmen\n5. In einer Pfanne die Butter schmelzen, Zucker und Zimt hinzufügen. \n6. Den Apfel in kleine Würfel schneiden und in die Pfanne geben.\n7.Karamellisieren lassen und von der Hitze nehmen\n8.Zu den Haferflocken geben\nGenießen","en":"1. Place the oats in a pot\n2. Add the milk and the cinnamon\n3. Heat until you reach the consistency you like best.\n4.Take off the heat\n5. In a pan, melt the butter, add sugar and cinnamon. \n6. Dice the apple into small cubes and add it to the pan.\n7.Let it caramelize and take off the heat\n8.Add it to the oats\nEnjoy","es":"1. Colocar la avena en una olla\n2. Agregar la leche y la canela\n3. Calentar hasta encontrar la consistencia que más te guste.\n4.Retirar del fuego\n5. En un sartén derretir la mantequilla, agregar azúcar y canela. \n6. Picar la manzana en cubitos y agregar al sartén.\n7.Dejar caramelizar y retirar del fuego\n8.Agregar a la avena\nDisfrutar"},"1. En un bowl añade el pollo, el sofrito y los condimentos. Frótalo por todo el pollo y déjalo marinar 20 minutos (a temperatura ambiente) o durante varias horas, hasta toda la noche, en la nevera.\n2. Pon una olla con tapa a fuego medio-alto. Una vez caliente, añade el aceite y espolvorea el azúcar. Una vez que vea que el azúcar empieza a caramelizarse, aproximadamente 1 minuto, añada el pollo marinado (conserva el recipiente). Dora el pollo por un lado durante 3 - 5 minutos, o hasta que aparezcan marcas de cocción profundas, y luego da la vuelta al pollo.\n3. Reduce el fuego a medio, vierte ¼ de taza de agua y cubre el pollo con el pimiento y las rodajas de cebolla. Cubre y cocina durante unos 5 minutos hasta que las verduras se hayan ablandado, PERO sigan estando tiernamente crujientes. Si es necesario, añade cucharadas de agua para evitar que se quemen.\n4. Vierte el agua restante en el recipiente que utilizaste para marinar el pollo y agítalo para quitar el resto de los condimentos y el sofrito de los lados. Luego viértelo en la olla junto con la salsa de tomate. Mézclalo rápidamente, luego tápalo y cocina durante 15 - 20 minutos hasta que se forme una rica salsa.\n5. Reduce el fuego, sazona al gusto con sal marina y pimienta, y adorna con cilantro fresco.\n6. Servir con arroz blanco.":{"de":"1. In eine Schüssel das Hähnchen, das Sofrito und die Gewürze geben. Über das ganze Hähnchen einreiben und 20 Minuten (bei Raumtemperatur) oder mehrere Stunden, bis über Nacht, im Kühlschrank marinieren lassen.\n2. Einen Topf mit Deckel bei mittlerer bis hoher Hitze erhitzen. Sobald er heiß ist, das Öl hinzufügen und den Zucker darüber streuen. Sobald der Zucker zu karamellisieren beginnt, etwa nach 1 Minute, das marinierte Hähnchen hinzufügen (das Gefäß aufbewahren). Das Hähnchen von einer Seite 3 - 5 Minuten anbraten, oder bis tiefe Röstspuren erscheinen, und dann wenden.\n3. Die Hitze auf mittlere Stufe reduzieren, ¼ Tasse Wasser hinzugießen und das Hähnchen mit der Paprika und den Zwiebelscheiben bedecken. Zudecken und etwa 5 Minuten garen, bis das Gemüse weich geworden ist, ABER noch bissfest bleibt. Bei Bedarf löffelweise Wasser hinzufügen, damit es nicht anbrennt.\n4. Das restliche Wasser in das Gefäß gießen, in dem du das Hähnchen mariniert hast, und schütteln, um die restlichen Gewürze und das Sofrito von den Seiten zu lösen. Dann zusammen mit der Tomatensauce in den Topf gießen. Schnell verrühren, dann zudecken und 15 - 20 Minuten garen, bis eine reichhaltige Sauce entsteht.\n5. Die Hitze reduzieren, mit Meersalz und Pfeffer nach Geschmack würzen und mit frischem Koriander garnieren.\n6. Mit weißem Reis servieren.","en":"1. In a bowl, add the chicken, the sofrito and the seasonings. Rub it all over the chicken and let it marinate for 20 minutes (at room temperature) or for several hours, up to overnight, in the fridge.\n2. Put a pot with a lid over medium-high heat. Once hot, add the oil and sprinkle the sugar. Once you see the sugar starting to caramelize, about 1 minute, add the marinated chicken (keep the container). Brown the chicken on one side for 3 - 5 minutes, or until deep sear marks appear, and then flip the chicken over.\n3. Lower the heat to medium, pour in ¼ cup of water and cover the chicken with the pepper and the onion slices. Cover and cook for about 5 minutes until the vegetables have softened, BUT are still tender-crisp. If necessary, add spoonfuls of water to keep them from burning.\n4. Pour the remaining water into the container you used to marinate the chicken and shake it to remove the rest of the seasonings and the sofrito from the sides. Then pour it into the pot along with the tomato sauce. Mix it quickly, then cover and cook for 15 - 20 minutes until a rich sauce forms.\n5. Lower the heat, season to taste with sea salt and pepper, and garnish with fresh cilantro.\n6. Serve with white rice.","es":"1. En un bowl añade el pollo, el sofrito y los condimentos. Frótalo por todo el pollo y déjalo marinar 20 minutos (a temperatura ambiente) o durante varias horas, hasta toda la noche, en la nevera.\n2. Pon una olla con tapa a fuego medio-alto. Una vez caliente, añade el aceite y espolvorea el azúcar. Una vez que vea que el azúcar empieza a caramelizarse, aproximadamente 1 minuto, añada el pollo marinado (conserva el recipiente). Dora el pollo por un lado durante 3 - 5 minutos, o hasta que aparezcan marcas de cocción profundas, y luego da la vuelta al pollo.\n3. Reduce el fuego a medio, vierte ¼ de taza de agua y cubre el pollo con el pimiento y las rodajas de cebolla. Cubre y cocina durante unos 5 minutos hasta que las verduras se hayan ablandado, PERO sigan estando tiernamente crujientes. Si es necesario, añade cucharadas de agua para evitar que se quemen.\n4. Vierte el agua restante en el recipiente que utilizaste para marinar el pollo y agítalo para quitar el resto de los condimentos y el sofrito de los lados. Luego viértelo en la olla junto con la salsa de tomate. Mézclalo rápidamente, luego tápalo y cocina durante 15 - 20 minutos hasta que se forme una rica salsa.\n5. Reduce el fuego, sazona al gusto con sal marina y pimienta, y adorna con cilantro fresco.\n6. Servir con arroz blanco."},"1. En un sartén agregar el aceite de oliva\n2. Cuando el aceite esté caliente agregar la cebolla cortada en julianas\n3.Esperar a que la cebolla esté transparente y agregar el pollo\n4.Cocinar por ambos lados hasta que esté tierno y jugoso. Sal y pimienta al gusto\n5. Sacar del fuego.\n6. En un recipiente mezclar la miel y la mostaza\n7. Bañar el pollo con la salsa que hiciste\n8. Servir con arroz\nDisfrutar":{"de":"1. In eine Pfanne das Olivenöl geben\n2. Wenn das Öl heiß ist, die in Streifen geschnittene Zwiebel hinzufügen\n3.Warten, bis die Zwiebel glasig ist, und das Hähnchen hinzufügen\n4.Von beiden Seiten garen, bis es zart und saftig ist. Salz und Pfeffer nach Geschmack\n5. Von der Hitze nehmen.\n6. In einem Gefäß den Honig und den Senf verrühren\n7. Das Hähnchen mit der zubereiteten Sauce übergießen\n8. Mit Reis servieren\nGenießen","en":"1. In a pan, add the olive oil\n2. When the oil is hot, add the onion cut into julienne\n3.Wait for the onion to turn translucent and add the chicken\n4.Cook on both sides until it is tender and juicy. Salt and pepper to taste\n5. Take off the heat.\n6. In a container, mix the honey and the mustard\n7. Coat the chicken with the sauce you made\n8. Serve with rice\nEnjoy","es":"1. En un sartén agregar el aceite de oliva\n2. Cuando el aceite esté caliente agregar la cebolla cortada en julianas\n3.Esperar a que la cebolla esté transparente y agregar el pollo\n4.Cocinar por ambos lados hasta que esté tierno y jugoso. Sal y pimienta al gusto\n5. Sacar del fuego.\n6. En un recipiente mezclar la miel y la mostaza\n7. Bañar el pollo con la salsa que hiciste\n8. Servir con arroz\nDisfrutar"},"1. En un sartén agregar la mantequilla\n2. Cortar el tomate y la cebolla y agregarlos al sartén\n3.Cuando la cebolla esté traslúcida agregar los huevos y revolver.\n4.Cocinar hasta el punto que te guste.\n5. Servir con pan integral\nDisfrutar":{"de":"1. In eine Pfanne die Butter geben\n2. Die Tomate und die Zwiebel schneiden und in die Pfanne geben\n3.Wenn die Zwiebel glasig ist, die Eier hinzufügen und verrühren.\n4.Bis zum gewünschten Punkt garen.\n5. Mit Vollkornbrot servieren\nGenießen","en":"1. In a pan, add the butter\n2. Cut the tomato and the onion and add them to the pan\n3.When the onion is translucent, add the eggs and stir.\n4.Cook to the point you like.\n5. Serve with whole-grain bread\nEnjoy","es":"1. En un sartén agregar la mantequilla\n2. Cortar el tomate y la cebolla y agregarlos al sartén\n3.Cuando la cebolla esté traslúcida agregar los huevos y revolver.\n4.Cocinar hasta el punto que te guste.\n5. Servir con pan integral\nDisfrutar"},"1. Hacer el arroz según las instrucciones del paquete.\n2. Pon en un wok (o sartén) antiadherente grande a fuego ALTO. Una vez caliente, rocíe un poco de aceite y agregar el pollo. Deja que se dore durante unos 4 o 5 minutos (sin tocarlo) y luego remueva y espolvoree el polvo de curry. Mezcle en el wok y continúe la cocción durante 2 minutos más. Retirar y reservar.\n3. Reduce el fuego de la sartén a medio (y asegúrate de que la sartén se ha enfriado, esto es importante), luego añada el aceite, las cebollas y el ajo. Ralla el jengibre fresco. Cocina durante 2 o 3 minutos para aromatizar el aceite, luego has un hueco en el sartén y añade el huevo. Revuelve rápidamente los huevos y pícalos continuamente.\n4. Aumenta el fuego a medio-alto o ALTO. Incorpora el arroz y mezcla bien. Espolvorea el resto del curry en polvo y dobla continuamente, asegurándote de que cada grano de arroz esté cubierto de curry. Añade la ralladura de lima para avivar los sabores y mezcla.\n5. Añade los pimientos y el pollo y sigue mezclando. Incorpora los guisantes y las zanahorias congeladas o frescas y mezcla todo. Retira el wok del fuego y añada las hojas de albahaca arrancadas (si tienes)\n6. Sazona al gusto con soja baja en sodio y zumo de limón fresco.\n7. Disfruta":{"de":"1. Den Reis nach Packungsanweisung kochen.\n2. Einen großen beschichteten Wok (oder eine Pfanne) bei HOHER Hitze erhitzen. Sobald er heiß ist, etwas Öl hineinträufeln und das Hähnchen hinzufügen. Etwa 4 bis 5 Minuten anbraten lassen (ohne es zu berühren), dann umrühren und das Currypulver darüber streuen. Im Wok schwenken und weitere 2 Minuten garen. Herausnehmen und beiseitestellen.\n3. Die Hitze der Pfanne auf mittlere Stufe reduzieren (und sicherstellen, dass die Pfanne abgekühlt ist, das ist wichtig), dann das Öl, die Zwiebeln und den Knoblauch hinzufügen. Den frischen Ingwer reiben. 2 bis 3 Minuten garen, um das Öl zu aromatisieren, dann eine Mulde in der Pfanne freimachen und das Ei hineingeben. Die Eier schnell verrühren und fortlaufend zerkleinern.\n4. Die Hitze auf mittlere bis hohe oder HOHE Stufe erhöhen. Den Reis hinzufügen und gut vermengen. Das restliche Currypulver darüber streuen und fortlaufend unterheben, dabei sicherstellen, dass jedes Reiskorn mit Curry überzogen ist. Die Limettenschale hinzufügen, um die Aromen zu beleben, und vermengen.\n5. Die Paprika und das Hähnchen hinzufügen und weiter vermengen. Die gefrorenen oder frischen Erbsen und Karotten hinzufügen und alles vermengen. Den Wok von der Hitze nehmen und die gezupften Basilikumblätter hinzufügen (falls vorhanden)\n6. Mit natriumarmer Sojasauce und frischem Zitronensaft nach Geschmack würzen.\n7. Genießen","en":"1. Cook the rice according to the package instructions.\n2. Put a large non-stick wok (or pan) over HIGH heat. Once hot, drizzle a little oil and add the chicken. Let it brown for about 4 or 5 minutes (without touching it) and then stir and sprinkle the curry powder. Toss in the wok and continue cooking for 2 more minutes. Remove and set aside.\n3. Lower the heat of the pan to medium (and make sure the pan has cooled down, this is important), then add the oil, the onions and the garlic. Grate the fresh ginger. Cook for 2 or 3 minutes to flavor the oil, then make a well in the pan and add the egg. Quickly scramble the eggs and chop them continuously.\n4. Raise the heat to medium-high or HIGH. Add the rice and mix well. Sprinkle the rest of the curry powder and fold continuously, making sure every grain of rice is coated with curry. Add the lime zest to brighten the flavors and mix.\n5. Add the peppers and the chicken and keep mixing. Add the frozen or fresh peas and carrots and mix everything. Remove the wok from the heat and add the torn basil leaves (if you have them)\n6. Season to taste with low-sodium soy and fresh lemon juice.\n7. Enjoy","es":"1. Hacer el arroz según las instrucciones del paquete.\n2. Pon en un wok (o sartén) antiadherente grande a fuego ALTO. Una vez caliente, rocíe un poco de aceite y agregar el pollo. Deja que se dore durante unos 4 o 5 minutos (sin tocarlo) y luego remueva y espolvoree el polvo de curry. Mezcle en el wok y continúe la cocción durante 2 minutos más. Retirar y reservar.\n3. Reduce el fuego de la sartén a medio (y asegúrate de que la sartén se ha enfriado, esto es importante), luego añada el aceite, las cebollas y el ajo. Ralla el jengibre fresco. Cocina durante 2 o 3 minutos para aromatizar el aceite, luego has un hueco en el sartén y añade el huevo. Revuelve rápidamente los huevos y pícalos continuamente.\n4. Aumenta el fuego a medio-alto o ALTO. Incorpora el arroz y mezcla bien. Espolvorea el resto del curry en polvo y dobla continuamente, asegurándote de que cada grano de arroz esté cubierto de curry. Añade la ralladura de lima para avivar los sabores y mezcla.\n5. Añade los pimientos y el pollo y sigue mezclando. Incorpora los guisantes y las zanahorias congeladas o frescas y mezcla todo. Retira el wok del fuego y añada las hojas de albahaca arrancadas (si tienes)\n6. Sazona al gusto con soja baja en sodio y zumo de limón fresco.\n7. Disfruta"},"1. Usar una tortilla integral\n2. Agregar los fríjoles en lata, el maís, la cebolla, el tomate, el queso y el aguacate\n3. Decorar con salsa bbq\n4. Puedes comerlo caliente si así lo prefieres, para esto cerrar bien y llevarlo a una sartén.\nDisfrutar":{"de":"1. Eine Vollkorn-Tortilla verwenden\n2. Die Bohnen aus der Dose, den Mais, die Zwiebel, die Tomate, den Käse und die Avocado hinzufügen\n3. Mit BBQ-Sauce garnieren\n4. Du kannst ihn warm essen, wenn du möchtest; dafür gut verschließen und in eine Pfanne geben.\nGenießen","en":"1. Use a whole-grain tortilla\n2. Add the canned beans, the corn, the onion, the tomato, the cheese and the avocado\n3. Decorate with bbq sauce\n4. You can eat it warm if you prefer; for this, close it well and put it in a pan.\nEnjoy","es":"1. Usar una tortilla integral\n2. Agregar los fríjoles en lata, el maís, la cebolla, el tomate, el queso y el aguacate\n3. Decorar con salsa bbq\n4. Puedes comerlo caliente si así lo prefieres, para esto cerrar bien y llevarlo a una sartén.\nDisfrutar"},"1. Vaciamos las latas de atún sobre un colador fino y exprimimos lo más que se pueda, para que el atún nos quede con la menor cantidad de líquido posible.\n2. Lavamos el perejil y lo picamos finito.\n3. En un bowl grande, agregamos el atún, la linaza, el perejil, el huevo, el jugo de limón, el ajo en polvo y salpimentamos. Mezclamos hasta integrar perfectamente.\n4. Colocamos un sartén grande a fuego medio y agregamos el aceite. Con ayuda de una servilleta, lo esparcimos sobre toda la superficie y retiramos el exceso.\n5. Comenzamos a formar las tortitas de atún, una a una, con nuestras manos. Tomamos un poco de la mezcla, formamos una bola y después la aplanamos apretando bien para que no se desbarate al cocinarla. Con ayuda de nuestras manos, redondeamos las orillas para que nos queden bonitas y no con forma de amiba. =)\n6. Colocamos en el sartén cada tortita que vayamos formando. Cocinamos alrededor de 5 minutos por cada lado, o hasta que éste se vea doradito. Al voltear, apretamos un poquito más con una pala de cocina, para terminar de sacar líquido y que la croqueta quede bien compacta.\n7. Conforme vayan saliendo, colocamos las tortitas sobre una servilleta de cocina para absorber el excedente de grasa.":{"de":"1. Die Thunfischdosen über ein feines Sieb entleeren und so stark wie möglich ausdrücken, damit der Thunfisch möglichst wenig Flüssigkeit enthält.\n2. Die Petersilie waschen und fein hacken.\n3. In eine große Schüssel den Thunfisch, die Leinsamen, die Petersilie, das Ei, den Zitronensaft, das Knoblauchpulver geben und mit Salz und Pfeffer würzen. Vermengen, bis alles perfekt verbunden ist.\n4. Eine große Pfanne bei mittlerer Hitze erhitzen und das Öl hinzufügen. Mithilfe einer Serviette über die gesamte Oberfläche verteilen und den Überschuss entfernen.\n5. Beginne, die Thunfischküchlein einzeln mit den Händen zu formen. Nimm etwas von der Mischung, forme eine Kugel und drücke sie dann flach, damit sie beim Garen nicht auseinanderfällt. Mit den Händen die Ränder abrunden, damit sie schön werden und nicht amöbenförmig. =)\n6. Jedes geformte Küchlein in die Pfanne legen. Etwa 5 Minuten pro Seite garen, oder bis es goldbraun aussieht. Beim Wenden mit einem Pfannenwender etwas fester andrücken, um die restliche Flüssigkeit herauszubekommen und die Krokette schön kompakt zu machen.\n7. Sobald sie fertig sind, die Küchlein auf ein Küchenpapier legen, um das überschüssige Fett aufzusaugen.","en":"1. Empty the cans of tuna over a fine strainer and squeeze as much as possible, so the tuna is left with the least amount of liquid possible.\n2. Wash the parsley and chop it finely.\n3. In a large bowl, add the tuna, the flaxseed, the parsley, the egg, the lemon juice, the garlic powder and season with salt and pepper. Mix until perfectly combined.\n4. Place a large pan over medium heat and add the oil. With the help of a napkin, spread it over the whole surface and remove the excess.\n5. Start forming the tuna patties, one by one, with your hands. Take a bit of the mixture, form a ball and then flatten it, pressing well so it doesn't fall apart when cooking. With your hands, round the edges so they turn out nice and not amoeba-shaped. =)\n6. Place each patty you form in the pan. Cook for about 5 minutes on each side, or until it looks golden. When flipping, press a little more with a spatula to finish removing liquid and make the croquette nicely compact.\n7. As they come out, place the patties on a kitchen napkin to absorb the excess grease.","es":"1. Vaciamos las latas de atún sobre un colador fino y exprimimos lo más que se pueda, para que el atún nos quede con la menor cantidad de líquido posible.\n2. Lavamos el perejil y lo picamos finito.\n3. En un bowl grande, agregamos el atún, la linaza, el perejil, el huevo, el jugo de limón, el ajo en polvo y salpimentamos. Mezclamos hasta integrar perfectamente.\n4. Colocamos un sartén grande a fuego medio y agregamos el aceite. Con ayuda de una servilleta, lo esparcimos sobre toda la superficie y retiramos el exceso.\n5. Comenzamos a formar las tortitas de atún, una a una, con nuestras manos. Tomamos un poco de la mezcla, formamos una bola y después la aplanamos apretando bien para que no se desbarate al cocinarla. Con ayuda de nuestras manos, redondeamos las orillas para que nos queden bonitas y no con forma de amiba. =)\n6. Colocamos en el sartén cada tortita que vayamos formando. Cocinamos alrededor de 5 minutos por cada lado, o hasta que éste se vea doradito. Al voltear, apretamos un poquito más con una pala de cocina, para terminar de sacar líquido y que la croqueta quede bien compacta.\n7. Conforme vayan saliendo, colocamos las tortitas sobre una servilleta de cocina para absorber el excedente de grasa."},"1.Cortar las papas en julianas.\n2. Agregar en un bowl sal, pimienta, páprika y aceite de oliva. Luego pasar todas tus papas por esta mezcla\n3.En una bandeja colocas papel refinado y pones tus papas previamente condimentadas.\n4.Hornear a 180 grados hasta que estén doradas y crujientes\n5.Picar las salchichas y agregar en un bowl junto con tus papas crocantes. Agregar maíz, queso y salsas":{"de":"1.Die Kartoffeln in Streifen schneiden.\n2. In eine Schüssel Salz, Pfeffer, Paprika und Olivenöl geben. Dann alle Kartoffeln in dieser Mischung wenden\n3.Auf ein Blech Backpapier legen und deine zuvor gewürzten Kartoffeln darauf verteilen.\n4.Bei 180 Grad backen, bis sie goldbraun und knusprig sind\n5.Die Würstchen schneiden und zusammen mit deinen knusprigen Kartoffeln in eine Schüssel geben. Mais, Käse und Saucen hinzufügen","en":"1.Cut the potatoes into julienne.\n2. In a bowl, add salt, pepper, paprika and olive oil. Then coat all your potatoes in this mixture\n3.On a tray, place parchment paper and put your previously seasoned potatoes on it.\n4.Bake at 180 degrees until they are golden and crispy\n5.Chop the sausages and add them to a bowl together with your crispy potatoes. Add corn, cheese and sauces","es":"1.Cortar las papas en julianas.\n2. Agregar en un bowl sal, pimienta, páprika y aceite de oliva. Luego pasar todas tus papas por esta mezcla\n3.En una bandeja colocas papel refinado y pones tus papas previamente condimentadas.\n4.Hornear a 180 grados hasta que estén doradas y crujientes\n5.Picar las salchichas y agregar en un bowl junto con tus papas crocantes. Agregar maíz, queso y salsas"},"1.En tu licuadora pon la avena para hacerla harina, luego agregar la chia, linaza, huevo, queso cottage, banano y leche.\n2. Batir hasta tener una mezcla homogénea.\n3. Engrasar el sartén con mantequilla.\n4. Con una cuchara coger un poco de la mezcla y arma tus tortitas.\n5. Dorar por lado y lado\n6. Decorar con topings.":{"de":"1.In deinen Mixer die Haferflocken geben, um sie zu Mehl zu mahlen, dann die Chia, Leinsamen, das Ei, den Hüttenkäse, die Banane und die Milch hinzufügen.\n2. Mixen, bis eine gleichmäßige Masse entsteht.\n3. Die Pfanne mit Butter einfetten.\n4. Mit einem Löffel etwas von der Masse nehmen und deine Küchlein formen.\n5. Von beiden Seiten anbräunen\n6. Mit Toppings garnieren.","en":"1.In your blender, put the oats to make them into flour, then add the chia, flaxseed, egg, cottage cheese, banana and milk.\n2. Blend until you have a smooth mixture.\n3. Grease the pan with butter.\n4. With a spoon, take a little of the mixture and form your pancakes.\n5. Brown on both sides\n6. Decorate with toppings.","es":"1.En tu licuadora pon la avena para hacerla harina, luego agregar la chia, linaza, huevo, queso cottage, banano y leche.\n2. Batir hasta tener una mezcla homogénea.\n3. Engrasar el sartén con mantequilla.\n4. Con una cuchara coger un poco de la mezcla y arma tus tortitas.\n5. Dorar por lado y lado\n6. Decorar con topings."},"1.En un bowl agregar el atún, la cebolla en cubos, la mayonesa, sal y pimienta.\n2. Mezclar muy bien,\n3.Armar tu sanduche.\n4.puedes agregar una rodaja de tomate si así lo deseas":{"de":"1.In eine Schüssel den Thunfisch, die gewürfelte Zwiebel, die Mayonnaise, Salz und Pfeffer geben.\n2. Sehr gut vermengen,\n3.Dein Sandwich zusammenstellen.\n4.du kannst eine Tomatenscheibe hinzufügen, wenn du möchtest","en":"1.In a bowl, add the tuna, the diced onion, the mayonnaise, salt and pepper.\n2. Mix very well,\n3.Assemble your sandwich.\n4.you can add a slice of tomato if you wish","es":"1.En un bowl agregar el atún, la cebolla en cubos, la mayonesa, sal y pimienta.\n2. Mezclar muy bien,\n3.Armar tu sanduche.\n4.puedes agregar una rodaja de tomate si así lo deseas"},"1.Hacer el arroz según las instrucciones del empaque y reservar\n2.En un sartén agregar el aceite, la cebolla, el ajo. Espera a que la cebolla se ponga transparente y agrega la carne molida.\n3.Añada las zanahorias, los dátiles, la pasta de tomate, 100g de agua, 1 cucharadita de sal, la pimienta, el comino, la canela y el curry.\n4.Después agregar las arvejas y cocinar durante 40 minutos.\n5.Emplatar y servir con una ensalada de lechuga, tomate y pepino del tamaño de tu mano":{"de":"1.Den Reis nach Packungsanweisung kochen und beiseitestellen\n2.In eine Pfanne das Öl, die Zwiebel, den Knoblauch geben. Warten, bis die Zwiebel glasig wird, und das Hackfleisch hinzufügen.\n3.Die Karotten, die Datteln, das Tomatenmark, 100g Wasser, 1 Teelöffel Salz, den Pfeffer, den Kreuzkümmel, den Zimt und das Curry hinzufügen.\n4.Danach die Erbsen hinzufügen und 40 Minuten garen.\n5.Anrichten und mit einem Salat aus Salat, Tomate und Gurke von der Größe deiner Hand servieren","en":"1.Cook the rice according to the package instructions and set aside\n2.In a pan, add the oil, the onion, the garlic. Wait for the onion to turn translucent and add the ground beef.\n3.Add the carrots, the dates, the tomato paste, 100g of water, 1 teaspoon of salt, the pepper, the cumin, the cinnamon and the curry.\n4.Then add the peas and cook for 40 minutes.\n5.Plate up and serve with a salad of lettuce, tomato and cucumber the size of your hand","es":"1.Hacer el arroz según las instrucciones del empaque y reservar\n2.En un sartén agregar el aceite, la cebolla, el ajo. Espera a que la cebolla se ponga transparente y agrega la carne molida.\n3.Añada las zanahorias, los dátiles, la pasta de tomate, 100g de agua, 1 cucharadita de sal, la pimienta, el comino, la canela y el curry.\n4.Después agregar las arvejas y cocinar durante 40 minutos.\n5.Emplatar y servir con una ensalada de lechuga, tomate y pepino del tamaño de tu mano"},"1.Lo primero que vamos a hacer es colocara hervir la pechuga de pollo en agua.\n2. Cuando esté completamente cocinada sacamos la pechuga y reservamos el consomé.\n3. En otra olla colocamos un poco de aceite de oliva, un diente de ajo y la cebolla.\n4. Cuando la cebolla esté transparente colocamos la espinaca y dejamos cocinar por unos segundos.\n5. Agregamos las papas y un poco del consomé que teníamos guardado.\n6. Cuando las papas estén blandas sacar del fuego.\n7. Agregar todo a la licuadora (no agregues todo el líquido de la olla de una vez sino que ve mirando poco a poco hasta tener la textura deseada)\n8. Servir con el pollo desmechado por encima.":{"de":"1.Als Erstes werden wir die Hähnchenbrust in Wasser kochen.\n2. Wenn sie vollständig gegart ist, die Brust herausnehmen und die Brühe aufbewahren.\n3. In einen anderen Topf etwas Olivenöl, eine Knoblauchzehe und die Zwiebel geben.\n4. Wenn die Zwiebel glasig ist, den Spinat hinzufügen und einige Sekunden garen lassen.\n5. Die Kartoffeln und etwas von der aufbewahrten Brühe hinzufügen.\n6. Wenn die Kartoffeln weich sind, von der Hitze nehmen.\n7. Alles in den Mixer geben (nicht die gesamte Flüssigkeit aus dem Topf auf einmal hinzufügen, sondern nach und nach dosieren, bis die gewünschte Textur erreicht ist)\n8. Mit dem zerpflückten Hähnchen obenauf servieren.","en":"1.The first thing we are going to do is boil the chicken breast in water.\n2. When it is completely cooked, take out the breast and reserve the broth.\n3. In another pot, place a little olive oil, a garlic clove and the onion.\n4. When the onion is translucent, add the spinach and let it cook for a few seconds.\n5. Add the potatoes and a little of the broth we had saved.\n6. When the potatoes are soft, take off the heat.\n7. Add everything to the blender (do not add all the liquid from the pot at once, but check little by little until you get the desired texture)\n8. Serve with the shredded chicken on top.","es":"1.Lo primero que vamos a hacer es colocara hervir la pechuga de pollo en agua.\n2. Cuando esté completamente cocinada sacamos la pechuga y reservamos el consomé.\n3. En otra olla colocamos un poco de aceite de oliva, un diente de ajo y la cebolla.\n4. Cuando la cebolla esté transparente colocamos la espinaca y dejamos cocinar por unos segundos.\n5. Agregamos las papas y un poco del consomé que teníamos guardado.\n6. Cuando las papas estén blandas sacar del fuego.\n7. Agregar todo a la licuadora (no agregues todo el líquido de la olla de una vez sino que ve mirando poco a poco hasta tener la textura deseada)\n8. Servir con el pollo desmechado por encima."},"Prepara el cuscús perlado según las instrucciones del paquete. Escúrrelo y resérvalo.\n2. Sazona las gambas en un bol para mezclar.\n3. Pon una sartén de acero al carbono a fuego alto, rocíala con un poco de aceite y añade las gambas. Cocínalas, unos 6 - 8 minutos. Una vez terminada la cocción, corta las gambas en trozos.\n4. Prepara todos los ingredientes.\n5. Mezcla los ingredientes en una taza para la salsa.\n6. Combina las gambas y los ingredientes de la ensalada en un bowl grande. Vierte la salsa y mezcla todo suavemente.\n7. Sazona al gusto con sal marina y pimienta, y utiliza zumo de lima o naranja para ajustar el sabor según sea necesario.":{"de":"Den Perlcouscous nach Packungsanweisung zubereiten. Abgießen und beiseitestellen.\n2. Die Garnelen in einer Rührschüssel würzen.\n3. Eine Pfanne aus Karbonstahl bei hoher Hitze erhitzen, mit etwas Öl beträufeln und die Garnelen hinzufügen. Etwa 6 - 8 Minuten garen. Nach dem Garen die Garnelen in Stücke schneiden.\n4. Alle Zutaten vorbereiten.\n5. Die Zutaten für die Sauce in einer Tasse verrühren.\n6. Die Garnelen und die Salatzutaten in einer großen Schüssel vereinen. Die Sauce darüber gießen und alles vorsichtig vermengen.\n7. Mit Meersalz und Pfeffer nach Geschmack würzen und mit Limetten- oder Orangensaft den Geschmack nach Bedarf anpassen.","en":"Prepare the pearl couscous according to the package instructions. Drain it and set it aside.\n2. Season the prawns in a mixing bowl.\n3. Put a carbon steel pan over high heat, drizzle it with a little oil and add the prawns. Cook them for about 6 - 8 minutes. Once cooking is finished, cut the prawns into pieces.\n4. Prepare all the ingredients.\n5. Mix the ingredients in a cup for the sauce.\n6. Combine the prawns and the salad ingredients in a large bowl. Pour the sauce and mix everything gently.\n7. Season to taste with sea salt and pepper, and use lime or orange juice to adjust the flavor as needed.","es":"Prepara el cuscús perlado según las instrucciones del paquete. Escúrrelo y resérvalo.\n2. Sazona las gambas en un bol para mezclar.\n3. Pon una sartén de acero al carbono a fuego alto, rocíala con un poco de aceite y añade las gambas. Cocínalas, unos 6 - 8 minutos. Una vez terminada la cocción, corta las gambas en trozos.\n4. Prepara todos los ingredientes.\n5. Mezcla los ingredientes en una taza para la salsa.\n6. Combina las gambas y los ingredientes de la ensalada en un bowl grande. Vierte la salsa y mezcla todo suavemente.\n7. Sazona al gusto con sal marina y pimienta, y utiliza zumo de lima o naranja para ajustar el sabor según sea necesario."},"Ausfallschritte":{"de":"Ausfallschritte","en":"Lunges","es":"Zancadas"},"Beinheben":{"de":"Beinheben","en":"Leg Raises","es":"Elevaciones de piernas"},"Bicycle Crunch":{"de":"Fahrrad-Crunch","en":"Bicycle Crunch","es":"Crunch de bicicleta"},"Brücke → Beinheben":{"de":"Brücke → Beinheben","en":"Bridge → Leg Raises","es":"Puente → Elevaciones de piernas"},"Bulgarian Split Squat":{"de":"Bulgarischer Split Squat","en":"Bulgarian Split Squat","es":"Sentadilla búlgara"},"Bulgarian Split Squats":{"de":"Bulgarische Split Squats"
